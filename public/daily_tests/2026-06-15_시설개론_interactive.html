<!doctype html>
<html lang="ko">

    <script src="https://cdn.tailwindcss.com"></script>
    <style>

        .quiz-container::-webkit-scrollbar-track { background: #1e293b; }

<body class="min-h-screen flex flex-col items-center justify-center p-4">

    <!-- Header -->
    <div class="w-full max-w-3xl mb-6 text-center mt-4">
        <h1 class="text-3xl md:text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-emerald-400 drop-shadow-md tracking-tight">
            주택관리사보 1차 특강 모의고사
        </h1>
        <p class="text-slate-400 mt-2 text-sm md:text-base font-medium">일타강사의 정밀 해설과 완벽 오답노트로 합격의 쐐기를 박으세요!</p>
    </div>

    <!-- Quiz Wrapper -->
    <div id="app" class="w-full max-w-3xl bg-slate-800 rounded-2xl shadow-2xl border border-slate-700 overflow-hidden relative pb-6">
        
        <!-- Progress Bar -->
        <div class="w-full bg-slate-700 h-1.5 relative">
            <div id="progress" class="bg-emerald-500 h-1.5 absolute left-0 top-0 transition-all duration-300 w-0"></div>
        </div>

        <div class="p-6 md:p-8">
            <!-- Quiz Section -->
            <div id="quiz-section">
                <div class="flex justify-between items-center mb-6">
                    <span id="q-num" class="px-3 py-1 bg-blue-500/20 text-blue-300 font-bold rounded-md text-sm tracking-wide"></span>
                </div>
                
                <h2 id="q-text" class="text-xl md:text-2xl font-bold text-slate-100 mb-8 leading-snug whitespace-pre-wrap break-keep">
                    <!-- Question Text -->
                </h2>

                <div id="options" class="flex flex-col gap-3">
                    <!-- Options injected via JS -->
                </div>

                <div id="explanation" class="hidden mt-8 p-5 bg-slate-900/50 rounded-xl border-l-4 border-blue-500 shadow-inner">
                    <div class="flex items-center gap-2 mb-2">
                        <svg class="w-5 h-5 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>

                    </div>
                    <p id="expl-text" class="text-slate-300 leading-relaxed font-medium"></p>
                </div>

                <button id="next-btn" onclick="nextQuestion()" class="hidden w-full mt-6 py-4 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-xl transition-colors duration-200 shadow-lg text-lg">
                    다음 문제로 이동 ➔
                </button>
            </div>

            <!-- Result Section -->
            <div id="result-section" class="hidden text-center">
                <h2 class="text-3xl font-extrabold text-white mb-4">시험 종료!</h2>
                <div class="inline-block p-6 rounded-full bg-slate-700/50 mb-6 border-4 border-emerald-500 shadow-xl">
                    <p class="text-5xl font-black text-emerald-400" id="final-score">100점</p>
                </div>
                <p class="text-slate-300 mb-8 text-lg" id="result-msg">수고하셨습니다. 완벽하게 학습하셨네요!</p>
                
                <div id="wrong-notes" class="text-left bg-slate-900 p-6 rounded-xl border border-slate-700 hidden mt-6 max-h-[600px] overflow-y-auto quiz-container">
                    <h3 class="text-2xl font-bold text-rose-400 mb-6 flex items-center gap-2">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path></svg>
                        핵심 오답 노트
                    </h3>
                    <div id="wrong-list" class="flex flex-col gap-6">
                        <!-- Wrong answers injected here -->
                    </div>
                </div>

                <button onclick="location.reload()" class="w-full mt-8 py-4 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-xl transition-colors duration-200 shadow-lg text-lg">
                    다시 풀어보기
                </button>
            </div>
        </div>
    </div>

<script>

            explanation: `핵심 포인트! 습도가 높으면 수분 증발이 억제되어 건조수축 균열은 감소합니다. 하지만 굳지 않은 콘크리트의 경화가 지연되므로 거푸집에 가해지는 측압은 오히려 증가하게 됩니다. 반드시 기억하세요!`,

        {

            question: `콘크리트 구조물에서 발생되는 크리프 현상의 원인으로 옳지 않은 것은?`,

        {

                `② 방수모르타르의 바름 두께 및 회수는 정한 바가 없을 때 두께 15mm 내외의 1회 바름으로 한다.`,

    let currentIdx = 0;
    let score = 0;
    let wrongAnswers = [];
    let isAnswered = false;

    // DOM Elements
    const qNum = document.getElementById('q-num');
    const qText = document.getElementById('q-text');
    const optionsDiv = document.getElementById('options');
    const explDiv = document.getElementById('explanation');
    const explText = document.getElementById('expl-text');
    const nextBtn = document.getElementById('next-btn');
    const progress = document.getElementById('progress');
    const quizSection = document.getElementById('quiz-section');
    const resultSection = document.getElementById('result-section');

    function init() {
        renderQuestion();
    }

    function renderQuestion() {
        isAnswered = false;
        const q = questions[currentIdx];
        
        qNum.innerText = `문제 ${q.id} / ${questions.length}`;
        qText.innerText = q.question;
        optionsDiv.innerHTML = '';
        explDiv.classList.add('hidden');
        explDiv.classList.remove('fade-in');
        nextBtn.classList.add('hidden');
        nextBtn.classList.remove('fade-in');
        
        // Update Progress
        progress.style.width = `${((currentIdx) / questions.length) * 100}%`;

        q.options.forEach((opt, idx) => {
            const btn = document.createElement('button');
            btn.className = "option-btn w-full text-left p-4 bg-slate-700/60 hover:bg-slate-600 rounded-xl border-2 border-transparent transition-all duration-200 text-slate-200 text-lg md:text-xl shadow-sm";
            btn.innerText = opt;
            btn.onclick = () => selectAnswer(idx + 1, btn);
            optionsDiv.appendChild(btn);
        });
    }

    function selectAnswer(selectedId, btn) {
        if (isAnswered) return;
        isAnswered = true;
        
        const q = questions[currentIdx];
        const btns = optionsDiv.children;

        // Visual Feedback
        if (selectedId === q.answer) {
            btn.classList.replace('bg-slate-700/60', 'bg-emerald-600');
            btn.classList.replace('hover:bg-slate-600', 'bg-emerald-600');
            btn.classList.replace('border-transparent', 'border-emerald-400');
            btn.classList.add('font-bold', 'text-white');
            score++;
        } else {
            btn.classList.replace('bg-slate-700/60', 'bg-rose-600');
            btn.classList.replace('hover:bg-slate-600', 'bg-rose-600');
            btn.classList.replace('border-transparent', 'border-rose-400');
            btn.classList.add('font-bold', 'text-white');
            
            // Highlight Correct Answer
            btns[q.answer - 1].classList.replace('bg-slate-700/60', 'bg-emerald-600/80');
            btns[q.answer - 1].classList.replace('border-transparent', 'border-emerald-400');
            btns[q.answer - 1].classList.add('text-white');

            // Save Wrong Answer
            wrongAnswers.push({
                id: q.id,
                questionText: q.question,
                userAnswer: q.options[selectedId - 1],
                correctAnswer: q.options[q.answer - 1],
                explanation: q.explanation,
                keyword: q.keyword
            });
        }

        // Disable all buttons
        for (let i = 0; i < btns.length; i++) {
            btns[i].disabled = true;
            btns[i].classList.remove('hover:bg-slate-600', 'cursor-pointer');
            btns[i].classList.add('cursor-default', 'opacity-90');
        }

        // Show Explanation
        explText.innerText = q.explanation;
        explDiv.classList.remove('hidden');
        explDiv.classList.add('fade-in');
        
        // Show Next Button
        nextBtn.classList.remove('hidden');
        nextBtn.classList.add('fade-in');
        if (currentIdx === questions.length - 1) {
            nextBtn.innerText = "채점 결과 및 오답 노트 확인 ➔";
            nextBtn.classList.replace('bg-blue-600', 'bg-purple-600');
            nextBtn.classList.replace('hover:bg-blue-500', 'hover:bg-purple-500');
        }
    }

    function nextQuestion() {
        if (currentIdx < questions.length - 1) {
            currentIdx++;
            renderQuestion();
        } else {
            showResult();
        }
    }

    function showResult() {
        progress.style.width = '100%';
        quizSection.classList.add('hidden');
        resultSection.classList.remove('hidden');
        resultSection.classList.add('fade-in');

        const finalScore = Math.round((score / questions.length) * 100);
        document.getElementById('final-score').innerText = `${finalScore}점`;
        
        const msg = document.getElementById('result-msg');
        if(finalScore >= 80) msg.innerText = "합격권입니다! 이 기세를 몰아 실전에서도 압도하세요.";
        else if(finalScore >= 60) msg.innerText = "합격의 문턱에 왔습니다. 오답 노트를 통해 취약점을 보완하세요!";
        else msg.innerText = "아직 기초가 부족합니다. 해설을 꼼꼼히 읽고 다시 도전하십시오.";

        if (wrongAnswers.length > 0) {
            document.getElementById('wrong-notes').classList.remove('hidden');
            const wrongList = document.getElementById('wrong-list');
            
            wrongAnswers.forEach(item => {
                const noteDiv = document.createElement('div');
                noteDiv.className = "p-5 bg-slate-800 rounded-lg border-l-4 border-rose-500";
                noteDiv.innerHTML = `
                    <div class="flex items-center justify-between mb-3">
                        <span class="px-2 py-1 bg-rose-500/20 text-rose-300 text-xs font-bold rounded">문제 ${item.id}</span>
                        <span class="px-2 py-1 bg-blue-500/20 text-blue-300 text-xs font-bold rounded">Key: ${item.keyword}</span>
                    </div>
                    <p class="text-slate-200 font-bold mb-4 whitespace-pre-wrap">${item.questionText}</p>
                    <div class="mb-3">
                        <p class="text-sm text-rose-400 mb-1">❌ 나의 선택</p>
                        <p class="text-slate-300 p-2 bg-slate-900 rounded">${item.userAnswer}</p>
                    </div>
                    <div class="mb-4">
                        <p class="text-sm text-emerald-400 mb-1">✅ 정답</p>
                        <p class="text-slate-300 p-2 bg-slate-900 rounded">${item.correctAnswer}</p>
                    </div>
                    <div class="p-3 bg-blue-900/30 rounded border border-blue-800/50">
                        <p class="text-sm text-blue-300 mb-1 font-bold">💡 일타강사 해설</p>
                        <p class="text-slate-300 text-sm leading-relaxed">${item.explanation}</p>
                    </div>
                `;
                wrongList.appendChild(noteDiv);
            });
        }

        // Send Data to Parent
        syncToParentGist(wrongAnswers);
    }

    function syncToParentGist(wrongData) {
        const payload = {
            type: 'sync_gist',
            payload: {
                title: "주택관리사보 1차 오답노트 결과",
                content: JSON.stringify({
                    totalQuestions: questions.length,
                    correctAnswers: score,
                    wrongAnswers: wrongData
                }, null, 2)
            }
        };
        // Post message to parent window
        window.parent.postMessage(payload, '*');
    }

    // Start Quiz
    window.onload = init;
</script>
