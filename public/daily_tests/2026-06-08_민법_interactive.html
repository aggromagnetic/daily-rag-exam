<!doctype html>
<html lang="ko">
<head>

  <title>주택관리사보 1차 프리미엄 인터랙티브 퀴즈</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700&display=swap');

<body class="min-h-screen flex flex-col justify-between antialiased selection:bg-teal-500 selection:text-white">

  <!-- 상단 헤더 -->
  <header class="border-b border-slate-800 bg-slate-900/50 backdrop-blur sticky top-0 z-50 px-4 py-3">
    <div class="max-w-3xl mx-auto flex justify-between items-center">
      <div class="flex items-center space-x-3">
        <span class="bg-teal-500 text-slate-950 text-xs font-bold px-2 py-1 rounded">1차 핵심</span>
        <h1 class="text-base font-bold text-slate-200">주택관리사보 마스터 퀴즈</h1>
      </div>
      <div id="progress-text" class="text-xs font-semibold text-teal-400">0 / 0 문제</div>
    </div>
    <!-- 상단 프로그레스 바 -->

  </header>

        <svg class="w-12 h-12" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
      </div>
      <div class="space-y-2">
        <h2 class="text-2xl font-bold text-slate-100">합격을 위한 완벽한 동반자</h2>
        <p class="text-sm text-slate-400 max-w-md mx-auto leading-relaxed">
          실제 시험과 동일한 엄격한 기준의 민법 핵심 30문항입니다. 클릭 기반 인터랙티브 학습과 실시간 피드백으로 점수를 끌어올리세요.
        </p>
      </div>
      <button onclick="startQuiz()" class="w-full sm:w-auto px-8 py-3 bg-teal-500 hover:bg-teal-400 text-slate-950 font-bold rounded-xl shadow-lg transition-all transform hover:-translate-y-0.5">
        합격 훈련 시작하기
      </button>
    </div>

    <!-- 퀴즈 플레이어 스크린 (기본 숨김) -->
    <div id="quiz-screen" class="hidden space-y-6">
      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-2xl space-y-6">
        <!-- 문제 태그 및 정보 -->
        <div class="flex justify-between items-center text-xs text-slate-400 border-b border-slate-800 pb-3">
          <span id="question-category" class="font-bold text-teal-400">민법 일반</span>
          <span id="question-number" class="font-mono">QUESTION 01</span>
        </div>

        <!-- 문제 지문 -->
        <div id="question-text" class="text-base font-semibold text-slate-100 leading-relaxed break-keep">
          <!-- 문제 텍스트가 동적으로 렌더링됩니다 -->
        </div>

        <!-- 보기 선택지 목록 -->
        <div id="options-container" class="space-y-2">
          <!-- 보기 버튼들이 동적으로 추가됩니다 -->
        </div>

        <!-- 실시간 즉석 피드백 및 해설 박스 (기본 숨김) -->
        <div id="feedback-box" class="hidden rounded-xl p-5 border transition-all duration-300">
          <div class="flex items-center space-x-2 font-bold text-base mb-2" id="feedback-title">
            <!-- 정답 여부 텍스트/아이콘 -->
          </div>
          <div class="text-sm text-slate-300 leading-relaxed break-keep border-t border-slate-800/60 pt-3 mt-1" id="feedback-explanation">
            <!-- 해설 내용 -->
          </div>
        </div>
      </div>

      <!-- 내비게이션 컨트롤 -->
      <div class="flex justify-end">
        <button id="next-btn" onclick="nextQuestion()" class="px-6 py-3 bg-slate-800 hover:bg-slate-700 text-slate-200 font-semibold rounded-xl border border-slate-700 shadow-md transition-all flex items-center space-x-2">
          <span>다음 문제</span>
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
        </button>
      </div>
    </div>

    <!-- 최종 리포트 스크린 (기본 숨김) -->
    <div id="report-screen" class="hidden space-y-6">
      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-2xl text-center space-y-6">
        <div class="inline-flex p-4 bg-emerald-500/10 rounded-full text-emerald-400">
          <svg class="w-12 h-12" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path></svg>
        </div>
        <div class="space-y-1">
          <h2 class="text-2xl font-bold text-slate-100">시험 종료! 수고하셨습니다.</h2>
          <p class="text-xs text-slate-400">분석된 오답 노트를 확인하고 취약점을 보완하세요.</p>
        </div>

        <!-- 최종 점수 스코어보드 -->
        <div class="grid grid-cols-2 gap-4 max-w-md mx-auto pt-2">
          <div class="bg-slate-950/60 p-4 rounded-xl border border-slate-800">
            <div class="text-xs text-slate-500 font-semibold">최종 점수</div>
            <div class="text-3xl font-extrabold text-teal-400 mt-1" id="report-score">0점</div>
          </div>
          <div class="bg-slate-950/60 p-4 rounded-xl border border-slate-800">
            <div class="text-xs text-slate-500 font-semibold">정답률 (맞춘 수)</div>
            <div class="text-3xl font-extrabold text-slate-200 mt-1" id="report-accuracy">0%</div>
          </div>
        </div>

        <div class="border-t border-slate-800 my-6"></div>

        <div class="text-left space-y-4">
          <h3 class="text-sm font-bold text-slate-300 flex items-center space-x-2">

        </div>
      </div>
    </div>

        answer: 3,

      {

        options: [
          "甲٠⼄ 간의 매매계약은 유효하다.",

      },
      {
        id: 29,
        question: "민법상 위임에 관한 설명으로 옳은 것은?",
        options: [

          "위임사무의 처리에 비용을 요하는 때에는 위임인은 수임인의 청구에 의하여 이를 선급하여야 한다.",
          "수임인은 자기재산과 동일한 주의로 위임사무를 처리하여야 한다.",
          "위임인의 승낙이나 부득이한 사유가 없더라도 수임인은 제3자로 하여금 자기에 갈음하여 위임사무를 처리하게 할 수 있다.",
          "수임인은 위임인의 불리한 시기에 위임계약을 해지하지 못한다."
        ],
        answer: 2,
        explanation: "민법 제687조에 의거하여 위임사무 처리에 비용이 필요한 경우 위임인은 수임인의 청구가 있을 때 이를 미리 선급해주어야 하므로 2번 기술이 정확합니다. ① 민법상 위임은 무상이 기본 원칙입니다. ③ 수임인은 유무상을 막론하고 선량한 관리자의 주의의무(선관주의)를 가집니다. ④, ⑤ 임의 대행은 제한되며 해지는 언제든 쌍방 자유롭습니다."
      },
      {
        id: 30,
        question: "민법이 규정하고 있는 전형계약이 아닌 것은?",
        options: [
          "부당이득",
          "위임",
          "도급",
          "증여",
          "매매"
        ],
        answer: 1,
        explanation: "부당이득은 계약이 아니라, 법률의 규정에 의하여 당연히 채권채무관계가 발생하는 '법정채권 발생원인'에 해당할 뿐이므로 민법전이 정의하는 15종 전형계약 스펙트럼에 속하지 않습니다."
      }
    ];

    let currentIdx = 0;
    let score = 0;
    let userAnswers = [];

    // 주택관리사 Gist 모듈 연동 패런트 싱크 코드 탑재 완료
    function syncToParentGist() {
      const wrongNotes = [];
      quizData.forEach((q, idx) => {
        if (userAnswers[idx] !== q.answer) {
          wrongNotes.push({
            no: q.id,
            userSel: userAnswers[idx] || "미선택",
            correctSel: q.answer,
            keyword: q.question.substring(0, 30) + "..."
          });
        }
      });

      const messageData = {
        type: "QUIZ_RESULT_SYNC",
        totalQuestions: quizData.length,
        score: Math.round((score / quizData.length) * 100),
        wrongNotes: wrongNotes,
        timestamp: new Date().toISOString()
      };

      if (window.parent && window.parent !== window) {
        window.parent.postMessage(messageData, "*");
      }
      console.log("Parent Gist Sync Executed:", messageData);
    }

    function startQuiz() {
      document.getElementById('welcome-screen').classList.add('hidden');
      document.getElementById('quiz-screen').classList.remove('hidden');
      currentIdx = 0;
      score = 0;
      userAnswers = [];
      renderQuestion();
    }

    function renderQuestion() {
      const q = quizData[currentIdx];
      
      // 상태 바 업데이트
      const progressPercent = ((currentIdx) / quizData.length) * 100;
      document.getElementById('progress-bar').style.width = `${progressPercent}%`;
      document.getElementById('progress-text').innerText = `${currentIdx + 1} / ${quizData.length} 문제`;

      // 텍스트 매핑
      document.getElementById('question-number').innerText = `QUESTION ${String(q.id).padStart(2, '0')}`;
      document.getElementById('question-text').innerHTML = q.question;
      
      // 피드백 박스 리셋 초기화
      const fBox = document.getElementById('feedback-box');
      fBox.classList.add('hidden');
      fBox.className = "rounded-xl p-5 border transition-all duration-300 hidden";

      // 옵션 렌더링
      const optContainer = document.getElementById('options-container');
      optContainer.innerHTML = '';

      q.options.forEach((opt, index) => {
        const choiceNum = index + 1;
        const btn = document.createElement('button');
        btn.className = "w-full text-left p-4 rounded-xl bg-slate-950/50 border border-slate-800 text-sm hover:bg-slate-800 hover:border-slate-700 transition-all flex items-start space-x-3 text-slate-300";
        btn.innerHTML = `<span class="inline-flex items-center justify-center bg-slate-800 text-slate-400 font-bold rounded-full w-5 h-5 text-xs flex-shrink-0 mt-0.5">${choiceNum}</span><span class="break-keep leading-relaxed">${opt}</span>`;
        btn.onclick = () => selectOption(choiceNum);
        optContainer.appendChild(btn);
      });

      document.getElementById('next-btn').style.visibility = "hidden";
    }

    function selectOption(choice) {
      if (userAnswers[currentIdx] !== undefined) return; // 중복 클릭 제어
      
      userAnswers[currentIdx] = choice;
      const q = quizData[currentIdx];
      const isCorrect = (choice === q.answer);
      if (isCorrect) score++;

      // 하이라이트 표시 및 피드백 처리
      const container = document.getElementById('options-container');
      const buttons = container.getElementsByTagName('button');

      for (let i = 0; i < buttons.length; i++) {
        const currentNum = i + 1;
        buttons[i].onclick = null; // 이벤트 비활성화
        if (currentNum === q.answer) {
          buttons[i].className = "w-full text-left p-4 rounded-xl bg-emerald-500/10 border-2 border-emerald-500 text-sm transition-all flex items-start space-x-3 text-emerald-300 font-semibold";
          buttons[i].querySelector('span').className = "inline-flex items-center justify-center bg-emerald-500 text-slate-950 font-bold rounded-full w-5 h-5 text-xs flex-shrink-0 mt-0.5";
        } else if (currentNum === choice && !isCorrect) {
          buttons[i].className = "w-full text-left p-4 rounded-xl bg-rose-500/10 border-2 border-rose-500 text-sm transition-all flex items-start space-x-3 text-rose-300";
          buttons[i].querySelector('span').className = "inline-flex items-center justify-center bg-rose-500 text-white font-bold rounded-full w-5 h-5 text-xs flex-shrink-0 mt-0.5";
        } else {
          buttons[i].className = "w-full text-left p-4 rounded-xl bg-slate-950/20 border border-slate-900 text-sm opacity-40 flex items-start space-x-3 text-slate-500";
        }
      }

      // 피드백 엘리먼트 노출
      const fBox = document.getElementById('feedback-box');
      const fTitle = document.getElementById('feedback-title');
      const fExpl = document.getElementById('feedback-explanation');

      fBox.classList.remove('hidden');
      if (isCorrect) {
        fBox.classList.add('bg-emerald-950/20', 'border-emerald-900/50');
        fTitle.className = "flex items-center space-x-2 font-bold text-base text-emerald-400";
        fTitle.innerHTML = `<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg><span>정답입니다! 완벽한 분석이네요.</span>`;
      } else {
        fBox.classList.add('bg-rose-950/20', 'border-rose-900/50');
        fTitle.className = "flex items-center space-x-2 font-bold text-base text-rose-400";
        fTitle.innerHTML = `<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg><span>놓친 지문 교정 리포트</span>`;
      }
      fExpl.innerHTML = q.explanation;

      // 다음버튼 활성화
      const nextBtn = document.getElementById('next-btn');
      nextBtn.style.visibility = "visible";
      if (currentIdx === quizData.length - 1) {
        nextBtn.innerHTML = `<span>최종 결과 보기</span>`;
      } else {
        nextBtn.innerHTML = `<span>다음 문제</span><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>`;
      }
    }

    function nextQuestion() {
      if (currentIdx < quizData.length - 1) {
        currentIdx++;
        renderQuestion();
      } else {
        showReport();
      }
    }

    function showReport() {
      document.getElementById('quiz-screen').classList.add('hidden');
      document.getElementById('report-screen').classList.remove('hidden');
      
      document.getElementById('progress-bar').style.width = `100%`;
      document.getElementById('progress-text').innerText = `합격 진단 완료`;

      const scorePercent = Math.round((score / quizData.length) * 100);
      document.getElementById('report-score').innerText = `${scorePercent}점`;
      document.getElementById('report-accuracy').innerText = `${scorePercent}% (${score}/${quizData.length})`;

      const wrongContainer = document.getElementById('wrong-answers-container');
      wrongContainer.innerHTML = '';

      let wrongCount = 0;
      quizData.forEach((q, idx) => {
        if (userAnswers[idx] !== q.answer) {
          wrongCount++;
          const item = document.createElement('div');
          item.className = "p-3 bg-slate-950/80 border border-slate-800 rounded-xl space-y-1.5";
          item.innerHTML = `
            <div class="flex justify-between text-slate-400 font-semibold border-b border-slate-900 pb-1">
              <span>번호: ${q.id}번 문항</span>
              <span class="text-rose-400">선택: ${userAnswers[idx] || '미선택'}번 / 정답: ${q.answer}번</span>
            </div>
            <div class="text-slate-300 font-medium truncate">${q.question.replace(/<br>/g, ' ')}</div>
          `;
          wrongContainer.appendChild(item);
        }
      });

      if (wrongCount === 0) {
        wrongContainer.innerHTML = `<div class="text-center text-emerald-400 font-semibold py-4">틀린 문제가 없습니다! 만점 합격권입니다.</div>`;
      }

      // 최종 부모 연동 발사
      syncToParentGist();
    }

    function restartQuiz() {
      document.getElementById('report-screen').classList.add('hidden');
      document.getElementById('welcome-screen').classList.remove('hidden');
      document.getElementById('progress-bar').style.width = `0%`;
      document.getElementById('progress-text').innerText = `0 / 0 문제`;
    }
  </script>
