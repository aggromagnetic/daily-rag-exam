<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>일타 강사 Gem의 주택관리사보 민법 프리미엄 모의고사</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap');
        
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #0f172a; /* Slate 900 */
            color: #f8fafc; /* Slate 50 */
        }
        
        .fade-in {
            animation: fadeIn 0.4s ease-in-out;
        }

        .slide-up {
            animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .box-question {
            background-color: #1e293b; /* Slate 800 */
            border-left: 4px solid #fbbf24; /* Amber 400 */
            padding: 1rem 1.5rem;
            margin-top: 1rem;
            margin-bottom: 1rem;
            border-radius: 0.5rem;
            line-height: 1.7;
        }

        .option-btn {
            transition: all 0.2s ease;
        }
        
        .option-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        /* Custom Scrollbar for the container */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #1e293b; 
        }
        ::-webkit-scrollbar-thumb {
            background: #475569; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #64748b; 
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 selection:bg-amber-400 selection:text-slate-900">

            </div>
            <h1 class="text-4xl md:text-5xl font-black mb-6 leading-tight">

                본 훈련은 실전과 동일한 30문항으로 구성되어 있으며, 틀린 문제는 세션 종료 후 완벽한 오답 노트로 제공됩니다. 자, 준비되셨습니까?

            progressText.innerText = `${currentQuestionIndex + 1} / ${quizData.length}`;
            progressBar.style.width = `${((currentQuestionIndex + 1) / quizData.length) * 100}%`;

            // Set Question (innerHTML is safe here as data is statically typed and allows HTML for boxes)
            questionText.innerHTML = currentQ.question;

            // Render Options
            currentQ.options.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn w-full text-left p-4 md:p-5 rounded-xl bg-slate-800 border border-slate-700 text-slate-200 hover:bg-slate-700 hover:border-amber-500/50 flex gap-4 items-start text-base md:text-lg cursor-pointer';
                
                const numberCircle = document.createElement('span');
                numberCircle.className = 'flex-shrink-0 w-8 h-8 rounded-full bg-slate-900 border border-slate-600 flex items-center justify-center text-sm font-bold mt-0.5';
                numberCircle.innerText = index + 1;
                
                const optText = document.createElement('span');
                optText.className = 'leading-relaxed';
                optText.innerText = opt;

                btn.appendChild(numberCircle);
                btn.appendChild(optText);

                btn.onclick = () => handleAnswer(index + 1, btn);
                optionsContainer.appendChild(btn);
            });
        }

        function handleAnswer(selectedIndex, selectedBtn) {
            if (isAnswered) return;
            isAnswered = true;

            const currentQ = quizData[currentQuestionIndex];
            const isCorrect = selectedIndex === currentQ.answer;

            // Disable all buttons and apply styles
            const buttons = optionsContainer.children;
            for (let i = 0; i < buttons.length; i++) {
                buttons[i].disabled = true;
                buttons[i].classList.remove('hover:bg-slate-700', 'hover:border-amber-500/50', 'cursor-pointer');
                
                if (i + 1 === currentQ.answer) {
                    // Correct answer style
                    buttons[i].classList.add('bg-green-900/40', 'border-green-500', 'text-green-100');
                    buttons[i].children[0].classList.add('bg-green-600', 'border-green-500', 'text-white');
                } else if (i + 1 === selectedIndex && !isCorrect) {
                    // Wrong choice style
                    buttons[i].classList.add('bg-red-900/40', 'border-red-500', 'text-red-100');
                    buttons[i].children[0].classList.add('bg-red-600', 'border-red-500', 'text-white');
                } else {
                    buttons[i].classList.add('opacity-50');
                }
            }

            // Logic & Feedback
            if (isCorrect) {
                score++;
                feedbackBox.className = 'p-6 rounded-xl border-l-4 bg-green-900/20 border-green-500';
                feedbackIcon.innerText = '✅';
                feedbackTitle.className = 'text-xl font-bold text-green-400';
                feedbackTitle.innerText = '정답입니다! 완벽한 이해력입니다.';
            } else {
                feedbackBox.className = 'p-6 rounded-xl border-l-4 bg-red-900/20 border-red-500';
                feedbackIcon.innerText = '❌';
                feedbackTitle.className = 'text-xl font-bold text-red-400';
                feedbackTitle.innerText = '오답입니다. 개념을 다시 짚어봅시다.';
                
                // Store wrong answer data
                wrongAnswers.push({
                    qNum: currentQuestionIndex + 1,
                    question: currentQ.question,
                    userChoice: currentQ.options[selectedIndex - 1],
                    correctChoice: currentQ.options[currentQ.answer - 1],
                    explanation: currentQ.explanation
                });
            }

            feedbackExplanation.innerHTML = `<span class="font-bold text-amber-400 mb-2 block">일타 강사 Gem의 명쾌한 해설:</span>${currentQ.explanation}`;
            
            // Show Feedback
            feedbackArea.classList.remove('hidden');
            // Scroll to bottom
            setTimeout(() => {
                feedbackArea.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }, 50);
        }

        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < quizData.length) {
                // Fade out current, then render next
                quizScreen.classList.remove('fade-in');
                void quizScreen.offsetWidth; // trigger reflow
                quizScreen.classList.add('fade-in');
                renderQuestion();
                // Scroll to top
                document.getElementById('quiz-screen').children[1].scrollTop = 0;
            } else {
                renderResult();
            }
        }

        function renderResult() {
            quizScreen.classList.add('hidden');
            quizScreen.classList.remove('flex');
            resultScreen.classList.remove('hidden');

            document.getElementById('final-score').innerText = score;
            const msgEl = document.getElementById('result-message');
            
            const passRate = (score / quizData.length) * 100;
            if (passRate >= 80) {
                msgEl.innerHTML = "훌륭합니다! <span class='text-amber-400'>합격 안정권</span>입니다. 실전에서도 이 감각을 유지하세요!";
            } else if (passRate >= 60) {
                msgEl.innerHTML = "수고하셨습니다. 아슬아슬하게 통과했지만, 틀린 문제를 반드시 복습하여 <span class='text-amber-400'>오답을 정복</span>하세요.";
            } else {
                msgEl.innerHTML = "조금 더 노력이 필요합니다. Gem의 해설과 오답 노트를 꼼꼼히 확인하고 <span class='text-red-400'>다시 도전</span>합시다!";
            }

            const waContainer = document.getElementById('wrong-answers-container');
            if (wrongAnswers.length === 0) {
                waContainer.innerHTML = '<div class="text-center text-slate-400 py-10">오답이 없습니다. 완벽합니다!</div>';
            } else {
                wrongAnswers.forEach(wa => {
                    const item = document.createElement('div');
                    item.className = 'bg-slate-800 p-5 rounded-lg border border-slate-700';
                    item.innerHTML = `
                        <div class="font-bold text-lg mb-3 pb-2 border-b border-slate-700">${wa.question}</div>
                        <div class="mb-2 text-sm md:text-base">
                            <span class="inline-block w-16 text-slate-400">내 선택:</span> 
                            <span class="text-red-400 line-through decoration-red-400/50">${wa.userChoice}</span>
                        </div>
                        <div class="mb-4 text-sm md:text-base">
                            <span class="inline-block w-16 text-slate-400">정답:</span> 
                            <span class="text-green-400 font-medium">${wa.correctChoice}</span>
                        </div>
                        <div class="bg-amber-900/10 p-4 rounded text-slate-300 text-sm leading-relaxed border-l-2 border-amber-500">
                            <span class="font-bold text-amber-400 block mb-1">핵심 체크:</span>
                            ${wa.explanation}
                        </div>
                    `;
                    waContainer.appendChild(item);
                });
            }

            // 부모 창으로 데이터 전송 (필수 지침 준수)
            syncToParentGist(wrongAnswers);
        }

        function syncToParentGist(wrongAnswersData) {
            const payload = {
                type: 'SYNC_WRONG_ANSWERS',
                source: 'Premium_Minbeob_Quiz_by_Gem',
                score: score,
                total: quizData.length,
                data: wrongAnswersData
            };
            
            try {
                if (window.parent && window.parent !== window) {
                    window.parent.postMessage(payload, '*');
                    console.log("✅ [Gem's App] 오답 수첩 데이터가 부모 창으로 성공적으로 발송되었습니다.", payload);
                } else {
                    console.log("ℹ️ [Gem's App] 단독 창에서 실행 중입니다. (postMessage 발송 생략)");
                }
            } catch(e) {
                console.error("❌ [Gem's App] 데이터 동기화 중 오류 발생:", e);
            }
        }
    </script>
</body>
</html>
