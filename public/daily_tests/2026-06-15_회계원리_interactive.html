                question: "다음은 (주)관세가 생산·판매하는 제품 A에 관한 자료이다.\n\n최대 생산가능수량: 10,000단위 / 현재 생산·판매수량: 8,000단위\n단위당 외부 판매가격: ₩ 300 / 단위당 변동제조원가: ₩ 100\n단위당 변동판매비: ₩ 40 / 단위당 고정제조간접원가: ₩ 90\n\n(주)한국은 (주)관세에게 제품 A에 특수장치를 부착한 제품 B를 제작하여, 단위당 ₩ 220에 1,500단위를 공급해줄 것을 제안하였다. (주)관세는 유휴생산능력 내에서 제품 B를 생산할 수 있으며, 기존 판매에 지장을 주지 않는다. 제품 B의 생산 시 단위당 ₩ 30의 특수장치원가가 추가되며, 제품 B의 단위당 변동판매비는 ₩ 30이 된다. 특별주문 수락 시 영업이익 변동은?",
                options: ["₩ 90,000 감소", "₩ 90,000 증가", "₩ 120,000 감소", "₩ 120,000 증가", "₩ 150,000 증가"],
                answer: 1, // ② ₩ 90,000 증가
                explanation: "· 남은 생산능력 = 10,000 - 8,000 = 2,000단위로, 특별주문 1,500단위는 기존 정규판매 기회손실 없이 전량 수용 가능함.\n· 제품 B의 단위당 증분 원가 = 변동제조원가(100) + 추가특수장치(30) + 변동판매비(30) = ₩160 (고정비는 비관련원가)\n· 단위당 증분 이익 = 주문단가(220) - 증분원가(160) = ₩60\n· 총 영업이익 효과 = 1,500단위 * ₩60 = ₩90,000 증가가 정답입니다.",
                keyword: "단기특수의사결정 - 특별주문수락"
            },
            {
                id: 35,
                question: "(주)한국은 재해로 인하여 재고자산이 파손되었는데 취득원가는 ₩ 600,000이었다. 이 재고자산에 ₩ 100,000이 소요되는 수리를 거치면 ₩ 350,000에 팔 수 있고, 수리를 거치지 않는다면 ₩ 200,000에 팔 수 있다. 이런 경우의 기회비용과 비관련원가는?",
                options: [
                    "₩ 200,000 | ₩ 600,000",
                    "₩ 350,000 | ₩ 200,000",
                    "₩ 250,000 | ₩ 600,000",
                    "₩ 200,000 | ₩ 200,000",
                    "₩ 250,000 | ₩ 400,000"
                ],
                answer: 0, // ① ₩ 200,000 | ₩ 600,000
                explanation: "· 취득원가 ₩600,000은 과거에 이미 발생한 매몰원가이므로 현재 의사결정의 '비관련원가'입니다.\n· 수리하여 판매(대안1)를 선택할 경우, 포기해야 하는 다른 최선의 대안 즉 그대로 판매 시 얻을 수 있는 금액 ₩200,000이 '기기회비용'으로 정의됩니다. 따라서 ①번 쌍이 올바릅니다.",
                keyword: "의사결정 관련원가 정보 분석"
            }
        ];

        let currentIdx = 0;
        let score = 0;
        let userAnswers = [];

        const quizScreen = document.getElementById('quiz-screen');
        const resultScreen = document.getElementById('result-screen');
        const qNumber = document.getElementById('q-number');
        const qText = document.getElementById('q-text');
        const optionsContainer = document.getElementById('options-container');
        const feedbackBox = document.getElementById('feedback-box');
        const feedbackResult = document.getElementById('feedback-result');
        const feedbackExplanation = document.getElementById('feedback-explanation');
        const nextBtn = document.getElementById('next-btn');
        const progressText = document.getElementById('progress-text');
        const progressBar = document.getElementById('progress-bar');
        const finalScore = document.getElementById('final-score');
        const resultComment = document.getElementById('result-comment');
        const wrongNotesList = document.getElementById('wrong-notes-list');

        function loadQuestion() {
            feedbackBox.classList.add('hidden');
            const q = quizData[currentIdx];
            
            // Progress Update
            const displayNum = currentIdx + 1;
            const total = quizData.length;
            progressText.innerText = `${displayNum < 10 ? '0' + displayNum : displayNum} / ${total} 문항`;
            progressBar.style.width = `${(displayNum / total) * 100}%`;

            // Display Question
            qNumber.innerText = `Q${displayNum}.`;
            qText.innerText = q.question;

            // Render Options
            optionsContainer.innerHTML = '';
            q.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = "w-full text-left bg-[#1c1c1f] hover:bg-[#27272a] border border-[#27272a] rounded-xl p-4 transition-all duration-150 flex items-center space-x-3 text-sm md:text-[15px] font-medium text-zinc-200 shadow-sm";
                btn.innerHTML = `<span class="w-6 h-6 rounded-full bg-zinc-800 text-zinc-400 flex items-center justify-center text-xs font-bold shrink-0 border border-zinc-700">${idx + 1}</span> <span class="leading-relaxed">${opt}</span>`;
                btn.onclick = () => selectOption(idx);
                optionsContainer.appendChild(btn);
            });
        }

        function selectOption(selectedIdx) {
            // Disable buttons after choice
            const buttons = optionsContainer.querySelectorAll('button');
            buttons.forEach(b => b.removeAttribute('onclick'));

            const q = quizData[currentIdx];
            const isCorrect = (selectedIdx === q.answer);
            userAnswers.push({
                qId: q.id,
                selected: selectedIdx,
                isCorrect: isCorrect
            });

            if(isCorrect) {
                score += (100 / quizData.length);
                feedbackResult.className = "text-emerald-400 font-bold text-base";
                feedbackResult.innerText = "🎯 완벽합니다! 정답입니다.";
                buttons[selectedIdx].classList.add('border-emerald-500', 'bg-emerald-950/20');
                buttons[selectedIdx].querySelector('span').classList.add('bg-emerald-500', 'text-neutral-900', 'border-emerald-400');
            } else {
                feedbackResult.className = "text-rose-400 font-bold text-base";
                feedbackResult.innerText = `❌ 오답입니다. (정답: ${q.answer + 1}번)`;
                buttons[selectedIdx].classList.add('border-rose-500', 'bg-rose-950/20');
                buttons[selectedIdx].querySelector('span').classList.add('bg-rose-500', 'text-white', 'border-rose-400');
                
                // Highlight correct answer softly
                buttons[q.answer].classList.add('border-emerald-500/50', 'bg-emerald-950/10');
            }

            feedbackExplanation.innerText = q.explanation;
            feedbackBox.classList.remove('hidden');
            feedbackBox.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        nextBtn.onclick = () => {
            currentIdx++;
            if(currentIdx < quizData.length) {
                loadQuestion();
            } else {
                showResult();
            }
        };

        function showResult() {
            quizScreen.classList.add('hidden');
            resultScreen.classList.remove('hidden');
            
            const roundedScore = Math.round(score);
            finalScore.innerText = `${roundedScore} / 100`;

            // Setup comment based on score
            if(roundedScore >= 80) {
                resultComment.innerText = "대단합니다! 회계원리 최고 득점권입니다. 이 페이스를 유지하시면 주택관리사보 1차 합격은 확실합니다.";
            } else if(roundedScore >= 60) {
                resultComment.innerText = "합격 안정권 점수입니다! 틀린 지문들의 회계 처리 로직을 오답수첩으로 최종 점검해 완벽을 기하세요.";
            } else {
                resultComment.innerText = "과락 기준 및 평균 점수 보완이 필요합니다. 아래 생성된 취약 유형 오답 노트를 반드시 복습하세요.";
            }

            // Render Wrong Notes & Sync to Parent Gist
            wrongNotesList.innerHTML = '';
            let incorrectDataSummary = [];

            userAnswers.forEach((ans, idx) => {
                const origQ = quizData[idx];
                if(!ans.isCorrect) {
                    incorrectDataSummary.push({
                        no: idx + 1,
                        correct_opt: origQ.answer + 1,
                        user_opt: ans.selected + 1,
                        keyword: origQ.keyword
                    });

                    const note = document.createElement('div');
                    note.className = "bg-[#18181b] border border-rose-500/20 rounded-xl p-4 text-xs md:text-sm space-y-2";
                    note.innerHTML = `
                        <div class="flex items-center justify-between">
                            <span class="text-rose-400 font-bold">문항 ${idx + 1} (오답)</span>
                            <span class="bg-[#27272a] text-zinc-400 px-2 py-0.5 rounded text-[11px]">핵심키워드: ${origQ.keyword}</span>
                        </div>
                        <p class="text-zinc-300 font-medium line-clamp-2">${origQ.question.split('\n')[0]}</p>
                        <div class="flex space-x-4 pt-1 text-zinc-400 text-[12px]">
                            <span>정답: <strong class="text-emerald-400">${origQ.answer + 1}번</strong></span>
                            <span>선택한 답: <strong class="text-rose-400">${ans.selected + 1}번</strong></span>
                        </div>
                    `;
                    wrongNotesList.appendChild(btn => {});
                    wrongNotesList.appendChild(note);
                }
            });

            if(incorrectDataSummary.length === 0) {
                wrongNotesList.innerHTML = `<div class="bg-[#18181b] border border-emerald-500/20 rounded-xl p-6 text-center text-zinc-400 text-sm">🎉 틀린 문제가 없습니다! 완벽한 마스터입니다.</div>`;
            }

            // [MANDATORY] syncToParentGist & postMessage implementation
            syncToParentGist(incorrectDataSummary);
        }

        function syncToParentGist(summaryData) {
            console.log("Syncing incorrect data to parent window...", summaryData);
            if (window.opener) {
                window.opener.postMessage({
                    type: "INCORRECT_NOTE_SYNC",
                    source: "HousingManagerQuizWebApp",
                    data: summaryData,
                    score: Math.round(score)
                }, "*");
            }
            if (window.parent) {
                window.parent.postMessage({
                    type: "INCORRECT_NOTE_SYNC",
                    source: "HousingManagerQuizWebApp",
                    data: summaryData,
                    score: Math.round(score)
                }, "*");
            }
        }

        // Initialize First Question
        window.onload = () => {
            loadQuestion();
        };
    </script>
</body>
</html>
