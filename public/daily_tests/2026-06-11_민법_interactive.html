        q: "불법행위에 관한 설명으로 옳지 않은 것은? (다툼이 있으면 판례에 따름)",
        options: [
          "① 공동불법행위가 성립하기 위해서는 행위자 사이에 행위공동의 인식은 필요하지 않다.",
          "② 교사자나 방조자도 공동행위자로서 공동불법행위책임을 질 수 있다.",
          "③ 공동불법행위자 중 1인이 한 상계는 다른 공동불법행위자에게도 공동면책의 효력이 미친다.",
          "④ 책임능력 없는 미성년자의 감독의무자는 그 미성년자의 불법행위에 대하여 원칙적으로 손해배상책임을 지지 않는다.",
          "⑤ 타인의 신체, 자유 또는 명예를 해하거나 기타 정신상 고통을 가한 자는 재산 이외의 손해에 대하여도 배상할 책임이 있다."
        ],
        answer: 3,
        exp: "미성년자 본인에게 불법행위에 대한 시비 변별력(책임능력)이 부재하여 직접 책임을 지울 수 없을 때에는, 민법 제755조 제1항 법리에 의거하여 그 보호감독의무자인 부모 등이 면책 사유를 완벽히 증명하지 못하는 한 '원칙적으로 손해배상 연대책임'을 전면 부과받게 됩니다.",
        keyword: "책임무능력자의 감독의무자 법정배상책임 구조"
      }
    ];

    let currentIndex = 0;
    let score = 0;
    const userAnswers = [];

    const progressText = document.getElementById("progress-text");
    const progressBar = document.getElementById("progress-bar");
    const questionNum = document.getElementById("question-num");
    const questionText = document.getElementById("question-text");
    const optionsContainer = document.getElementById("options-container");
    const explanationBox = document.getElementById("explanation-box");
    const resultBadge = document.getElementById("result-badge");
    const explanationText = document.getElementById("explanation-text");
    const nextBtn = document.getElementById("next-btn");
    
    const quizContainer = document.getElementById("quiz-container");
    const reportContainer = document.getElementById("report-container");
    const finalScore = document.getElementById("final-score");
    const wrongAnswersList = document.getElementById("wrong-answers-list");

    function initQuiz() {
      if (currentIndex >= dataset.length) {
        finishQuiz();
        return;
      }

      // UI Reset
      explanationBox.classList.add("hidden");
      optionsContainer.innerHTML = "";

      // Load Question
      const currentItem = dataset[currentIndex];
      const displayNum = String(currentIndex + 1).padStart(2, '0');
      
      progressText.innerText = `${displayNum} / ${dataset.length} 문항`;
      progressBar.style.width = `${((currentIndex) / dataset.length) * 100}%`;
      
      questionNum.innerText = `Q${displayNum}.`;
      questionText.innerText = currentItem.q;

      // Render Options
      currentItem.options.forEach((opt, idx) => {
        const btn = document.createElement("button");
        btn.className = "w-full text-left p-4 rounded-xl bg-[#1f2937]/40 border border-gray-800 hover:border-teal-500/50 hover:bg-[#1f2937]/80 transition duration-150 flex items-center justify-between group";
        btn.innerHTML = `
          <span class="text-sm md:text-base text-gray-300 group-hover:text-white">${opt}</span>
          <span class="w-5 h-5 rounded-full border border-gray-600 flex items-center justify-center text-xs text-transparent group-hover:border-teal-400 group-hover:text-teal-400 font-bold">&#10003;</span>
        `;
        btn.onclick = () => checkAnswer(idx);
        optionsContainer.appendChild(btn);
      });
    }

    function checkAnswer(selectedIndex) {
      const currentItem = dataset[currentIndex];
      const isCorrect = (selectedIndex === currentItem.answer);
      
      userAnswers.push({
        qNum: currentItem.id,
        userPick: selectedIndex,
        isCorrect: isCorrect
      });

      if (isCorrect) score += 1;

      // Freeze options
      Array.from(optionsContainer.children).forEach((btn, idx) => {
        btn.onclick = null;
        if (idx === currentItem.answer) {
          btn.className = "w-full text-left p-4 rounded-xl bg-teal-950/40 border-2 border-teal-500 flex items-center justify-between";
          btn.querySelector('span:last-child').className = "w-5 h-5 rounded-full bg-teal-500 text-gray-900 flex items-center justify-center text-xs font-bold";
          btn.querySelector('span:last-child').innerHTML = "&#10003;";
        } else if (idx === selectedIndex && !isCorrect) {
          btn.className = "w-full text-left p-4 rounded-xl bg-rose-950/40 border border-rose-500/70 flex items-center justify-between";
          btn.querySelector('span:last-child').className = "w-5 h-5 rounded-full bg-rose-500 text-white flex items-center justify-center text-xs font-bold";
          btn.querySelector('span:last-child').innerHTML = "&times;";
        } else {
          btn.className = "w-full text-left p-4 rounded-xl bg-[#1f2937]/10 border border-gray-900 opacity-40 flex items-center justify-between";
        }
      });

      // Show Feedback
      if (isCorrect) {
        resultBadge.className = "text-xs font-bold px-3 py-1 rounded-full bg-teal-500 text-gray-900";
        resultBadge.innerText = "정답 확인";
      } else {
        resultBadge.className = "text-xs font-bold px-3 py-1 rounded-full bg-rose-500 text-white";
        resultBadge.innerText = "오답 확인";
      }

      explanationText.innerText = currentItem.exp;
      explanationBox.classList.remove("hidden");
    }

    nextBtn.onclick = () => {
      currentIndex++;
      initQuiz();
    };

    function finishQuiz() {
      quizContainer.classList.add("hidden");
      reportContainer.classList.remove("hidden");
      progressBar.style.width = "100%";
      progressText.innerText = "평가 완료";

      const finalScoreCalculated = Math.round((score / dataset.length) * 100);
      finalScore.innerText = `${finalScoreCalculated}점`;

      const wrongItems = userAnswers.filter(item => !item.isCorrect);
      
      if (wrongItems.length === 0) {
        wrongAnswersList.innerHTML = `
          <div class="text-center py-8 bg-[#1f2937]/30 border border-teal-500/20 rounded-xl">
            <p class="text-teal-400 font-bold mb-1">축하합니다! 만점 합격입니다.</p>
            <p class="text-xs text-gray-500">모든 지문의 논리 구조를 마스터하셨습니다.</p>
          </div>
        `;
      } else {
        wrongAnswersList.innerHTML = "";
        wrongItems.forEach(w => {
          const originalItem = dataset.find(d => d.id === w.qNum);
          const block = document.createElement("div");
          block.className = "bg-[#1f2937]/40 border border-gray-800 rounded-xl p-4 space-y-2";
          block.innerHTML = `
            <div class="flex items-center justify-between">
              <span class="text-xs font-bold font-mono text-rose-400">[문항 ${originalItem.id}]</span>
              <span class="text-xs bg-gray-800 text-gray-400 px-2 py-0.5 rounded border border-gray-700 font-medium">키워드: ${originalItem.keyword}</span>
            </div>
            <p class="text-sm font-medium text-gray-200 line-clamp-2">${originalItem.q.split('\n')[0]}</p>
            <div class="text-xs flex gap-4 text-gray-400 font-mono">
              <span>정답: <b class="text-teal-400">${originalItem.answer + 1}번</b></span>
              <span>수험생 선택: <b class="text-rose-400">${w.userPick + 1}번</b></span>
            </div>
          `;
          wrongAnswersList.appendChild(block);
        });
      }

      // 부모 창이나 Gist 인프라로 채점 원격 공유 및 오답 동기화 발사 코드 완벽 이행
      syncToParentGist({
        totalQuestions: dataset.length,
        correctCount: score,
        scoreCalculated: finalScoreCalculated,
        wrongReport: wrongItems.map(w => {
          const matched = dataset.find(d => d.id === w.qNum);
          return { id: w.qNum, keyword: matched.keyword, picked: w.userPick + 1, correct: matched.answer + 1 };
        })
      });
    }

    function syncToParentGist(payload) {
      if (window.parent && window.parent !== window) {
        window.parent.postMessage({
          type: "QUIZ_APP_SYNC",
          source: "JUTA_ 일타강사_SYSTEM",
          data: payload
        }, "*");
      }
      console.log("[Sync System Data Stream Sent]", payload);
    }

    // 초기 기동
    window.onload = initQuiz;
  </script>
</body>
</html>
