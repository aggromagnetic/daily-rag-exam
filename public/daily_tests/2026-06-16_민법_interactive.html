<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>주택관리사보 1차 민법 - 프리미엄 모의고사</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap');
    body {
      font-family: 'Noto Sans KR', sans-serif;
    }
    .option-btn:disabled {
      cursor: not-allowed;
    }
  </style>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen pb-12 antialiased">
  <div id="app" class="max-w-3xl mx-auto p-4 md:p-8 mt-4 md:mt-8">
    
    <!-- Header -->
    <header class="text-center mb-10">
      <h1 class="text-3xl font-bold text-yellow-400 mb-2">주택관리사보 1차 민법</h1>
      <p class="text-gray-400">일타강사 Gem의 프리미엄 인터랙티브 학습</p>
    </header>

    <!-- Start Screen -->
    <div id="start-screen" class="text-center bg-gray-800 p-10 rounded-2xl shadow-2xl border border-gray-700 transform transition-all">
      <div class="mb-6 text-5xl">🎯</div>
      <h2 class="text-2xl font-bold mb-4 text-white">준비되셨습니까?</h2>
      <p class="text-gray-400 mb-8 leading-relaxed">
        실제 시험과 동일한 환경에서 30문항을 풀어보세요.<br>
        틀린 문제는 '오답 노트'를 통해 완벽하게 정리해 드립니다.
      </p>
      <button onclick="startQuiz()" class="bg-yellow-500 hover:bg-yellow-400 text-gray-900 font-bold text-lg py-4 px-10 rounded-full transition-all shadow-lg hover:shadow-yellow-500/30">
        시험 시작하기
      </button>
    </div>

    <!-- Quiz Screen -->
    <div id="quiz-screen" class="hidden flex-col gap-6">
      
      <!-- Progress Bar -->
      <div class="flex justify-between items-end text-sm text-gray-400 mb-2 px-2">
        <span id="progress-text" class="font-medium text-yellow-400">문제 1 / 30</span>
        <span id="score-text">현재 점수: 0점</span>
      </div>
      <div class="w-full bg-gray-700 h-2 rounded-full overflow-hidden mb-4">
        <div id="progress-bar" class="bg-gradient-to-r from-yellow-600 to-yellow-400 h-full w-0 transition-all duration-500"></div>
      </div>

      <!-- Question Area -->
      <div class="bg-gray-800 p-6 md:p-8 rounded-2xl shadow-xl border border-gray-700">
        <h3 id="question-text" class="text-lg md:text-xl font-medium mb-8 leading-loose text-white">
          <!-- Question text injected here -->
        </h3>
        
        <!-- Options List -->
        <div id="options-container" class="space-y-3">
          <!-- Options injected here -->
        </div>
      </div>

      <!-- Feedback Area -->
      <div id="feedback-area" class="hidden bg-gray-800 p-6 md:p-8 rounded-2xl shadow-xl border border-gray-700 border-l-4">
        <div class="flex items-center gap-3 mb-4">
          <div id="feedback-icon" class="text-2xl"></div>
          <h4 id="feedback-title" class="text-lg font-bold"></h4>
        </div>
        <div class="bg-gray-900 p-4 rounded-lg border border-gray-700">
          <p class="text-sm text-yellow-500 font-bold mb-2">일타강사 Gem의 핵심 해설</p>
          <p id="explanation-text" class="text-gray-300 leading-relaxed"></p>
        </div>
        <div class="mt-6 flex justify-end">
          <button id="next-btn" onclick="nextQuestion()" class="bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 px-8 rounded-lg transition-all shadow-lg hover:shadow-blue-500/30">
            다음 문제 ➔
          </button>
        </div>
      </div>
    </div>

    <!-- Result Screen -->
    <div id="result-screen" class="hidden flex-col gap-8">
      <!-- Score Summary -->
      <div class="text-center bg-gray-800 p-10 rounded-2xl shadow-2xl border border-gray-700">
        <div class="text-6xl mb-4">🏆</div>
        <h2 class="text-3xl font-bold text-white mb-4">수고하셨습니다!</h2>
        <p class="text-gray-400 text-lg mb-6">모든 시험이 종료되었습니다. 최종 결과를 확인하세요.</p>
        <div class="inline-block bg-gray-900 border border-gray-700 rounded-full px-8 py-4">
          <p class="text-xl text-gray-300">최종 점수 <span id="final-score" class="font-black text-yellow-400 text-5xl ml-2 mr-1"></span> 점</p>
        </div>
      </div>

      <!-- Wrong Answers Note -->
      <div class="bg-gray-800 p-6 md:p-8 rounded-2xl shadow-xl border border-gray-700">
        <div class="flex items-center gap-3 border-b border-gray-700 pb-4 mb-6">
          <span class="text-2xl">📓</span>
          <h3 class="text-xl font-bold text-white">나만의 오답 노트</h3>
          <span class="text-sm font-normal text-gray-400 ml-auto bg-gray-700 px-3 py-1 rounded-full" id="wrong-count-badge"></span>
        </div>
        <div id="wrong-answers-container" class="space-y-8">
          <!-- Wrong answers injected here -->
        </div>
      </div>
      
      <div class="text-center pb-8">
         <button onclick="location.reload()" class="bg-gray-700 hover:bg-gray-600 text-white font-medium py-3 px-8 rounded-lg transition-all">다시 풀기</button>
      </div>
    </div>

  </div>

      // 초기화
      feedbackArea.classList.add('hidden');
      feedbackArea.className = 'hidden bg-gray-800 p-6 md:p-8 rounded-2xl shadow-xl border border-gray-700 border-l-4'; // Reset classes

      const q = questions[currentQuestionIndex];

      const currentNumber = currentQuestionIndex + 1;
      progressText.innerText = `문제 ${currentNumber} / ${questions.length}`;
      progressBar.style.width = `${((currentQuestionIndex) / questions.length) * 100}%`;
      scoreText.innerText = `현재 점수: ${Math.round(score)}점`;

      // 문제 세팅
      questionText.innerHTML = `<span class="text-yellow-400 font-bold mr-2">${currentNumber}.</span> ${q.question}`;

      // 보기 생성
      q.options.forEach((optText, idx) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn w-full text-left p-4 rounded-xl border border-gray-600 hover:bg-gray-700 hover:border-gray-500 transition-all text-gray-200 flex items-start gap-4 focus:outline-none';
        btn.onclick = () => selectOption(idx, btn);
        
        const numCircle = document.createElement('div');
        numCircle.className = 'flex-shrink-0 w-7 h-7 rounded-full bg-gray-700 text-sm flex items-center justify-center font-bold border border-gray-600 mt-0.5';
        numCircle.innerText = idx + 1;
        
        const textSpan = document.createElement('div');
        textSpan.className = 'flex-1 leading-relaxed';
        textSpan.innerHTML = optText;

        btn.appendChild(textSpan);

      userAnswers.push({
        questionId: q.id,
        selectedOption: selectedIndex,
        isCorrect: isCorrect
      });

      // 버튼 상태 변경
      const allBtns = optionsContainer.querySelectorAll('.option-btn');
      allBtns.forEach((btn, idx) => {
        btn.disabled = true; // 비활성화
        btn.classList.remove('hover:bg-gray-700', 'hover:border-gray-500');
        
        const circle = btn.querySelector('div:first-child');

        if (idx === correctIndex) {
          btn.classList.add('bg-green-900/40', 'border-green-500');
          circle.classList.add('bg-green-600', 'border-green-500', 'text-white');
        } else if (idx === selectedIndex && !isCorrect) {
          btn.classList.add('bg-red-900/40', 'border-red-500');
          circle.classList.add('bg-red-600', 'border-red-500', 'text-white');
        } else {
          btn.classList.add('opacity-50');
        }
      });

      // 피드백 영역 표시
      feedbackArea.classList.remove('hidden');
      
      if (isCorrect) {
        score += SCORE_PER_QUESTION;
        scoreText.innerText = `현재 점수: ${Math.round(score)}점`;
        feedbackArea.classList.add('border-l-green-500');
        feedbackIcon.innerText = '✅';
        feedbackTitle.innerText = '정답입니다! 완벽한 이해도입니다.';
        feedbackTitle.classList.add('text-green-400');
        feedbackTitle.classList.remove('text-red-400');
      } else {
        feedbackArea.classList.add('border-l-red-500');
        feedbackIcon.innerText = '❌';
        feedbackTitle.innerText = '틀렸습니다. 해설을 꼭 확인하세요.';
        feedbackTitle.classList.add('text-red-400');
        feedbackTitle.classList.remove('text-green-400');
      }

      explanationText.innerHTML = q.explanation;
      
      // 스크롤 이동
      setTimeout(() => {
        feedbackArea.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }, 100);
    }

    function nextQuestion() {
      if (currentQuestionIndex < questions.length - 1) {
        currentQuestionIndex++;
        renderQuestion();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      } else {
        showResult();
      }
    }

    function showResult() {
      quizScreen.classList.remove('flex');
      quizScreen.classList.add('hidden');
      resultScreen.classList.remove('hidden');
      resultScreen.classList.add('flex');

      document.getElementById('final-score').innerText = Math.round(score);

      const wrongAnswers = userAnswers.filter(a => !a.isCorrect);
      document.getElementById('wrong-count-badge').innerText = `총 ${wrongAnswers.length}문제`;

      const wrongContainer = document.getElementById('wrong-answers-container');
      
      if (wrongAnswers.length === 0) {
         wrongContainer.innerHTML = `<div class="text-center text-green-400 p-8 border border-green-800 rounded-xl bg-green-900/20">🎉 완벽합니다! 틀린 문제가 하나도 없습니다. 합격을 축하합니다.</div>`;
      } else {
        wrongAnswers.forEach(ans => {
          const q = questions[ans.questionId - 1];
          const div = document.createElement('div');
          div.className = 'bg-gray-900 p-5 rounded-xl border border-gray-700 shadow-sm';
          
          div.innerHTML = `
            <div class="mb-4 pb-4 border-b border-gray-800">
              <h4 class="text-lg font-medium text-white leading-loose"><span class="text-red-400 font-bold mr-2">Q${q.id}.</span> ${q.question}</h4>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
              <div class="bg-red-900/20 p-4 rounded-lg border border-red-900/50">
                <p class="text-xs text-red-400 font-bold mb-1">내가 고른 오답</p>
                <p class="text-sm text-gray-300">${q.options[ans.selectedOption]}</p>
              </div>
              <div class="bg-green-900/20 p-4 rounded-lg border border-green-900/50">
                <p class="text-xs text-green-400 font-bold mb-1">정답</p>
                <p class="text-sm text-gray-300">${q.options[q.answer - 1]}</p>
              </div>
            </div>
            <div class="bg-gray-800 p-4 rounded-lg">
              <p class="text-xs text-yellow-500 font-bold mb-2">💡 핵심 해설</p>
              <p class="text-sm text-gray-300 leading-relaxed">${q.explanation}</p>
            </div>
          `;
          wrongContainer.appendChild(div);
        });
      }

      // 부모 창으로 데이터 동기화
      syncToParentGist();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function syncToParentGist() {
      const wrongAnswers = userAnswers.filter(a => !a.isCorrect);
      
      // HTML 태그 제거용 함수 (정규식)
      const stripHtml = (html) => {
        let tmp = document.createElement("DIV");
        tmp.innerHTML = html;
        return tmp.textContent || tmp.innerText || "";
      }

      const data = {
        type: 'quiz_result',
        examName: '주택관리사보 1차 민법',
        totalQuestions: questions.length,
        score: Math.round(score),
        wrongAnswers: wrongAnswers.map(a => {
            const q = questions[a.questionId - 1];
            return {
                id: q.id,
                questionText: stripHtml(q.question),
                selectedOptionText: stripHtml(q.options[a.selectedOption]),
                correctOptionText: stripHtml(q.options[q.answer - 1]),
                explanation: stripHtml(q.explanation)
            };
        })
      };
      
      console.log("Syncing data to parent:", data);
      
      // 부모 창으로 postMessage 전송
      if (window.parent && window.parent !== window) {
          window.parent.postMessage(data, '*');
      }
    }
  </script>
</body>
</html>
