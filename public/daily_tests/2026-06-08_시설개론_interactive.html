    function initQuiz() {
      currentIdx = 0;
      score = 0;
      userAnswers = [];

      nextBtn.classList.add('hidden');
      fBox.classList.add('hidden');
      renderQuestion();

    function renderQuestion() {
      fBox.classList.add('hidden');
      nextBtn.classList.add('hidden');
      
      const q = questions[currentIdx];
      progressText.innerText = `${currentIdx + 1} / ${questions.length} 문제`;
      progressBar.style.width = `${((currentIdx) / questions.length) * 100}%`;
      
      qCategory.innerText = q.category;
      qText.innerText = `${q.id}. ${q.question}`;
      
      cContainer.innerHTML = '';
      q.choices.forEach((choice, index) => {
        const btn = document.createElement('button');
        btn.className = "w-full text-left bg-slate-800 hover:bg-slate-750 border border-slate-700/50 p-4 rounded-xl transition duration-150 cursor-pointer text-xs sm:text-sm leading-relaxed flex items-start gap-3 text-slate-200 group focus:outline-none focus:border-teal-500/50";
        btn.innerHTML = `<span class="inline-flex items-center justify-center bg-slate-900 border border-slate-700 rounded-full w-5 h-5 text-[10px] font-bold text-slate-400 group-hover:border-teal-400 group-hover:text-teal-400 shrink-0 mt-0.5">${index + 1}</span><span class="break-all">${choice}</span>`;
        btn.onclick = () => handleSelect(index + 1);
        cContainer.appendChild(btn);
      });
    }

    function handleSelect(selectedNum) {
      const q = questions[currentIdx];
      const isCorrect = (selectedNum === q.answer);
      
      userAnswers.push({
        id: q.id,
        selected: selectedNum,
        correct: isCorrect
      });

      if(isCorrect) score += 4; // 각 4점씩 25문항計 100점 만점 밸런스 균형

      // 선택지 비활성화 및 정오답 시각화 표시
      Array.from(cContainer.children).forEach((btn, idx) => {
        btn.onclick = null;
        const currentNum = idx + 1;
        if(currentNum === q.answer) {
          btn.className = "w-full text-left bg-emerald-950/40 border-2 border-emerald-500 p-4 rounded-xl text-xs sm:text-sm leading-relaxed flex items-start gap-3 text-emerald-300 font-medium";
          btn.querySelector('span').className = "inline-flex items-center justify-center bg-emerald-500 rounded-full w-5 h-5 text-[10px] font-bold text-slate-950 shrink-0 mt-0.5";
        } else if(currentNum === selectedNum && !isCorrect) {
          btn.className = "w-full text-left bg-rose-950/40 border-2 border-rose-500 p-4 rounded-xl text-xs sm:text-sm leading-relaxed flex items-start gap-3 text-rose-300";
          btn.querySelector('span').className = "inline-flex items-center justify-center bg-rose-500 rounded-full w-5 h-5 text-[10px] font-bold text-slate-950 shrink-0 mt-0.5";
        } else {
          btn.className = "w-full text-left bg-slate-900/40 border border-slate-800/80 p-4 rounded-xl text-xs sm:text-sm leading-relaxed flex items-start gap-3 text-slate-500 opacity-60";
        }

      // 피드백 연출
      if(isCorrect) {
        fBox.className = "rounded-xl p-4 border border-emerald-800/60 bg-emerald-950/20 mb-6";
        fIcon.innerHTML = `<svg class="w-5 h-5 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>`;
        fTitle.className = "text-emerald-400 font-bold text-xs sm:text-sm";
        fTitle.innerText = "정답입니다! 완벽한 개념 정립입니다.";
      } else {
        fBox.className = "rounded-xl p-4 border border-rose-800/60 bg-rose-950/20 mb-6";
        fIcon.innerHTML = `<svg class="w-5 h-5 text-rose-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>`;

        fTitle.innerText = `아쉬운 오답 (선택: ${selectedNum}번 / 정답: ${q.answer}번)`;
      }
      
      fExplan.innerText = q.explan;
      fBox.classList.remove('hidden');
      nextBtn.classList.remove('hidden');
      
      if(currentIdx === questions.length - 1) {
        nextBtn.innerText = "최종 채점 결과 보기";
      } else {
        nextBtn.innerText = "다음 문제로 이동";

    nextBtn.onclick = () => {

        currentIdx++;
        renderQuestion();
      } else {

      }
    };

    function showResults() {
      quizScreen.classList.add('hidden');
      resultScreen.classList.remove('hidden');
      progressBar.style.width = "100%";
      progressText.innerText = "종료";
      scoreText.innerText = `${score} / 100점`;

      wrongSummaryContainer.innerHTML = '';
      const wrongList = userAnswers.filter(item => !item.correct);
      
      if(wrongList.length === 0) {
        wrongSummaryContainer.innerHTML = `<div class="p-4 bg-emerald-950/20 border border-emerald-800/40 rounded-xl text-center text-emerald-400 font-semibold text-xs sm:text-sm">틀린 문제가 전무합니다! 완벽한 마스터 달성입니다.</div>`;
      } else {
        wrongList.forEach(item => {
          const originQ = questions.find(q => q.id === item.id);
          const div = document.createElement('div');
          div.className = "bg-slate-950 border border-slate-800 rounded-xl p-3.5 space-y-1.5";
          div.innerHTML = `
            <div class="flex justify-between font-bold text-slate-200">
              <span>Q. ${originQ.id}번 문항</span>
              <span class="text-rose-400">정답: ${originQ.answer}번 (제출: ${item.selected}번)</span>
            </div>
            <div class="text-slate-400 font-medium">키워드: <span class="text-teal-400">${originQ.keyword}</span></div>
          `;
          wrongSummaryContainer.appendChild(div);
        });
      }

      syncToParentGist();
    }

      const payload = {
        type: "QUIZ_RESULT_SYNC",
        score: score,
        totalQuestions: questions.length,
        wrongNotes: userAnswers.filter(item => !item.correct).map(item => {
          const q = questions.find(origin => origin.id === item.id);
          return {
            id: q.id,
            keyword: q.keyword,
            userChoice: item.selected,
            correctChoice: q.answer
          };
        })
      };
      if (window.parent && window.parent !== window) {
        window.parent.postMessage(payload, "*");
      }
    }

    window.onload = initQuiz;
  </script>
</body>
</html>
