            if (index >= quizDatabase.length) {
                showResults();

            }

            feedbackPanel.classList.add('hidden');
            
            const q = quizDatabase[index];

                questionBox.classList.add('hidden');

            const percentage = ((index + 1) / quizDatabase.length) * 100;

            progressText.innerText = `${index + 1} / ${quizDatabase.length}`;

                    btn.querySelector('span').className = "inline-flex items-center justify-center w-6 h-6 rounded-full bg-rose-500 text-xs font-bold text-white shrink-0";
                } else {
                    btn.className = "w-full text-left p-4 rounded-xl border border-slate-900 bg-slate-950/30 text-sm md:text-base font-medium opacity-50 flex items-start space-x-3 shrink-0";
                }
            });

            // Display Feedback Panel
            if (isCorrect) {
                resultBadge.className = "inline-flex items-center space-x-2 px-3 py-1.5 rounded-full text-xs font-bold mb-4 bg-emerald-950/80 text-emerald-400 border border-emerald-900";
                resultBadge.innerHTML = `
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 12l2 2 4-4"></path></svg>
                    <span>정답입니다! 완벽한 판단력입니다.</span>
                `;
            } else {
                resultBadge.className = "inline-flex items-center space-x-2 px-3 py-1.5 rounded-full text-xs font-bold mb-4 bg-rose-950/80 text-rose-400 border border-rose-900";
                resultBadge.innerHTML = `
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"></path></svg>
                    <span>아쉽게도 오답입니다. 일타해설을 주목하십시오!</span>
                `;
            }

            explanationText.innerHTML = q.explanation;
            feedbackPanel.classList.remove('hidden');
        }

        // Post Message sync with parent component/iframe environment
        function syncToParentGist(results) {
            if (window.parent && window.parent !== window) {
                window.parent.postMessage({
                    type: 'QUIZ_RESULT_SYNC',
                    score: results.score,
                    totalQuestions: results.total,
                    incorrectNotes: results.incorrectNotes,
                    summary: `주택관리사 1차 민법 퀴즈 완료: 총 ${results.total}문제 중 ${results.correct}문제 정답 (${results.accuracy}%). 오답 ${results.incorrectNotes.length}개 기록됨.`
                }, '*');
            }
        }

        // Present Final Scorecard and Sync
        function showResults() {
            quizCard.classList.add('hidden');
            resultCard.classList.remove('hidden');

            const total = quizDatabase.length;
            const finalScoreVal = Math.round((score / total) * 100);
            
            document.getElementById('final-score').innerText = `${finalScoreVal}점`;
            document.getElementById('final-accuracy').innerText = `${score} / ${total} 문항`;

            // Setup incorrect notes list
            const listContainer = document.getElementById('incorrect-list');
            listContainer.innerHTML = '';

            if (incorrectList.length === 0) {
                listContainer.innerHTML = `
                    <div class="text-center py-10 bg-slate-950 rounded-2xl border border-slate-800">
                        <span class="text-4xl">👑</span>
                        <h4 class="font-bold text-emerald-400 mt-2 text-sm md:text-base">축하합니다! 무결점 수석 만점입니다.</h4>
                        <p class="text-slate-500 text-xs mt-1">틀린 문제가 존재하지 않아 완벽한 합격 지위입니다.</p>
                    </div>
                `;
            } else {
                incorrectList.forEach((item) => {
                    const block = document.createElement('div');
                    block.className = "p-5 bg-slate-950 border border-slate-800 rounded-xl space-y-3";
                    
                    let boxText = '';
                    if (item.boxContent) {
                        boxText = `<div class="my-2 p-3 bg-slate-900 border border-slate-800 rounded-lg text-xs leading-relaxed text-slate-300 whitespace-pre-line">${item.boxContent}</div>`;
                    }

                    block.innerHTML = `
                        <div class="flex items-center justify-between">
                            <span class="text-xs font-extrabold bg-rose-950/80 text-rose-400 border border-rose-900/50 px-2.5 py-0.5 rounded">기출 Q.${item.originalId}</span>
                            <span class="text-xs text-slate-500 font-semibold">키워드: <span class="text-indigo-400">${item.keyword}</span></span>
                        </div>
                        <h4 class="text-sm md:text-base font-bold text-slate-100 leading-snug">${item.question}</h4>
                        ${boxText}
                        <div class="grid grid-cols-2 gap-2 text-xs border-y border-slate-800 py-2.5 my-2">
                            <div><span class="text-slate-500 block">수험생 선택지</span><span class="text-rose-400 font-bold">${item.userChoice}. ${item.userChoiceText}</span></div>
                            <div><span class="text-slate-500 block">정답 번호</span><span class="text-emerald-400 font-bold">${item.correctChoice}. ${item.correctChoiceText}</span></div>
                        </div>
                        <div class="text-xs md:text-sm text-slate-400 bg-slate-900/50 p-3 rounded-lg border border-slate-900 leading-relaxed">
                            <b class="text-indigo-400">💡 핵심 해법:</b> ${item.explanation}
                        </div>
                    `;
                    listContainer.appendChild(block);
                });
            }

            // Execute sync
            syncToParentGist({
                score: finalScoreVal,
                total: total,
                correct: score,
                accuracy: finalScoreVal,
                incorrectNotes: incorrectList
            });
        }

        // Event listener for Next Question button
        nextBtn.addEventListener('click', () => {
            currentIdx += 1;
            loadQuestion(currentIdx);
        });

        // Initialize App
        window.addEventListener('load', initQuiz);
    </script>
</body>
</html>
