<!DOCTYPE html>
<html lang="ko" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>주택관리사보 1차 완벽 대비 모의고사</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body { font-family: 'Pretendard', sans-serif; background-color: #111827; color: #f3f4f6; }
        .fade-in { animation: fadeIn 0.4s ease-in-out; }
        .slide-up { animation: slideUp 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .box-question { background-color: #374151; padding: 1rem; border-radius: 0.5rem; margin: 1rem 0; border-left: 4px solid #3b82f6; line-height: 1.8; }
        
        /* Custom scrollbar for dark mode */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #1f2937; }
        ::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #6b7280; }
    </style>
</head>
<body class="min-h-screen flex flex-col antialiased">

    <!-- Header -->
    <header class="bg-gray-800 shadow-lg border-b border-gray-700 p-4 sticky top-0 z-50">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold text-blue-400">🔥 일타강사 Gem의 프리미엄 모의고사</h1>
            <div id="progress-text" class="text-gray-400 text-sm font-semibold hidden">0 / 30</div>
        </div>
        <div id="progress-bar-container" class="max-w-4xl mx-auto mt-2 h-1 bg-gray-700 rounded-full overflow-hidden hidden">
            <div id="progress-bar" class="h-full bg-blue-500 transition-all duration-300 w-0"></div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow flex items-center justify-center p-4">
        <div id="app-container" class="max-w-4xl w-full bg-gray-800 rounded-2xl shadow-2xl border border-gray-700 overflow-hidden">
            
            <!-- Intro Screen -->
            <div id="intro-screen" class="p-10 text-center fade-in">
                <h2 class="text-3xl font-bold text-white mb-4">주택관리사보 1차 핵심 기출 분석</h2>
                <p class="text-gray-300 mb-8 leading-relaxed">
                    반갑습니다! 수험생 여러분의 합격 메이커, <strong>일타강사 Gem</strong>입니다.<br>
                    실제 시험과 동일한 30문항으로 구성된 이 프리미엄 모의고사는 단순 암기가 아닌 <strong>원리 이해와 함정 돌파</strong>에 초점을 맞췄습니다.<br>
                    한 문제씩 몰입해서 풀어보세요. 오답은 제가 완벽하게 교정해 드립니다.
                </p>
                <button onclick="startQuiz()" class="px-8 py-3 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-lg shadow-lg transition-transform transform hover:scale-105">
                    모의고사 시작하기 (클릭)
                </button>
            </div>

            <!-- Quiz Screen -->
            <div id="quiz-screen" class="hidden p-6 md:p-10">
                <div class="mb-6">
                    <span id="question-number" class="inline-block px-3 py-1 bg-blue-900 text-blue-300 rounded-full text-sm font-bold mb-3">문제 1</span>
                    <h3 id="question-text" class="text-lg md:text-xl font-medium text-white leading-relaxed"></h3>
                </div>
                
                <div id="options-container" class="space-y-3">
                    <!-- Options injected here via JS -->
                </div>

                <div id="feedback-container" class="mt-6 hidden slide-up">
                    <div id="feedback-message" class="font-bold text-lg mb-2"></div>
                    <div id="feedback-explanation" class="p-4 bg-gray-700 rounded-lg text-gray-200 text-sm leading-relaxed border-l-4">
                        <!-- Explanation injected here -->
                    </div>
                    <button id="next-btn" onclick="nextQuestion()" class="mt-4 w-full py-3 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-lg transition-colors">
                        다음 문제로 넘어가기
                    </button>
                </div>
            </div>

            <!-- Result Screen -->
            <div id="result-screen" class="hidden p-6 md:p-10 fade-in">
                <div class="text-center mb-8">
                    <h2 class="text-3xl font-bold text-white mb-2">모의고사 종료</h2>
                    <p class="text-gray-400">수고하셨습니다! 일타강사 Gem의 분석 결과를 확인하세요.</p>
                    <div class="mt-6 inline-block bg-gray-900 rounded-full p-8 border-4 border-blue-500">
                        <span id="final-score" class="text-5xl font-bold text-blue-400"></span><span class="text-2xl text-gray-500"> / 100</span>
                    </div>
                </div>

                <div class="mb-6">
                    <h3 class="text-xl font-bold text-yellow-400 border-b border-gray-700 pb-2 mb-4 flex items-center justify-between">
                        <span>📝 나의 오답 노트</span>
                        <span class="text-sm text-gray-400 font-normal">복사해서 복습용으로 활용하세요</span>
                    </h3>
                    <div id="incorrect-list" class="space-y-4">
                        <!-- Incorrect answers injected here -->
                    </div>
                </div>
                
                <div class="text-center mt-8">
                    <button onclick="location.reload()" class="px-6 py-3 bg-gray-700 hover:bg-gray-600 text-white font-bold rounded-lg transition-colors">
                        다시 도전하기
                    </button>
                </div>
            </div>

        </div>
    </main>

            if (window.parent) {
                window.parent.postMessage({
                    type: 'QUIZ_RESULT_SYNC',
                    payload: resultData
                }, '*');

        }

                answer: 1,
                explanation: "💡 <strong>마지막 점검:</strong> 2번이 화재 확산 방지를 위한 올바른 조치입니다. 오답 분석: ① 단지서버는 통신배관실이 아니라 보안과 관리가 용이한 '집중구내통신실'에 설치합니다. ③ 내구연한 표시는 의무가 아닌 권장사항. ④ 예비부품은 '5%' 이상 5년간 확보 권장. ⑤ 전자출입시스템 접지단자는 부식 방지를 위해 '내부'에 설치해야 합니다."

        // --- ⚙️ 앱 상태 관리 ---
        let currentQuestionIndex = 0;
        let score = 0;
        let userAnswers = []; // 오답노트 생성을 위한 배열

        const DOM = {
            introScreen: document.getElementById('intro-screen'),
            quizScreen: document.getElementById('quiz-screen'),
            resultScreen: document.getElementById('result-screen'),
            progressText: document.getElementById('progress-text'),
            progressBarContainer: document.getElementById('progress-bar-container'),
            progressBar: document.getElementById('progress-bar'),
            qNumber: document.getElementById('question-number'),
            qText: document.getElementById('question-text'),
            optionsContainer: document.getElementById('options-container'),
            feedbackContainer: document.getElementById('feedback-container'),
            feedbackMsg: document.getElementById('feedback-message'),
            feedbackExp: document.getElementById('feedback-explanation'),
            nextBtn: document.getElementById('next-btn'),
            finalScore: document.getElementById('final-score'),
            incorrectList: document.getElementById('incorrect-list')
        };

        function startQuiz() {
            DOM.introScreen.classList.add('hidden');
            DOM.quizScreen.classList.remove('hidden');
            DOM.progressText.classList.remove('hidden');
            DOM.progressBarContainer.classList.remove('hidden');
            loadQuestion();
        }

        function loadQuestion() {
            const q = quizData[currentQuestionIndex];
            
            // 상태 초기화
            DOM.feedbackContainer.classList.add('hidden');
            DOM.optionsContainer.innerHTML = '';
            
            // 프로그레스 바 업데이트
            DOM.progressText.innerText = `${currentQuestionIndex + 1} / ${quizData.length}`;
            const percent = ((currentQuestionIndex) / quizData.length) * 100;
            DOM.progressBar.style.width = `${percent}%`;

            // 문제 텍스트 세팅
            DOM.qNumber.innerText = `문제 ${q.id}`;
            DOM.qText.innerHTML = q.text;

            // 보기 생성
            q.options.forEach((optText, index) => {
                const optDiv = document.createElement('div');
                optDiv.className = 'option-card bg-gray-700 hover:bg-blue-600 border border-gray-600 rounded-lg p-4 cursor-pointer transition-colors text-gray-200 shadow';
                optDiv.innerHTML = optText;
                optDiv.onclick = () => selectOption(index, optDiv);
                DOM.optionsContainer.appendChild(optDiv);
            });

            // 버튼 텍스트 변경 (마지막 문제일 경우)
            if (currentQuestionIndex === quizData.length - 1) {
                DOM.nextBtn.innerText = "결과 확인 및 오답 노트 생성";
                DOM.nextBtn.classList.remove('bg-blue-600', 'hover:bg-blue-500');
                DOM.nextBtn.classList.add('bg-red-600', 'hover:bg-red-500');
            }
        }

        function selectOption(selectedIndex, element) {
            // 이미 풀었으면 클릭 방지
            if(!DOM.feedbackContainer.classList.contains('hidden')) return;

            const q = quizData[currentQuestionIndex];
            const isCorrect = (selectedIndex === q.answer);
            const allOptions = DOM.optionsContainer.children;

            // 기록 저장
            userAnswers.push({
                question: q,
                userSelectedIndex: selectedIndex,
                isCorrect: isCorrect
            });

            if (isCorrect) score++;

            // 스타일링 적용
            for(let i=0; i<allOptions.length; i++) {
                allOptions[i].classList.remove('hover:bg-blue-600', 'cursor-pointer');
                allOptions[i].style.pointerEvents = 'none';
                
                if (i === q.answer) {
                    allOptions[i].classList.replace('bg-gray-700', 'bg-green-700'); // 정답 초록색
                    allOptions[i].classList.add('border-green-400');
                } else if (i === selectedIndex && !isCorrect) {
                    allOptions[i].classList.replace('bg-gray-700', 'bg-red-800'); // 오답 빨간색
                    allOptions[i].classList.add('border-red-400', 'opacity-70');
                } else {
                    allOptions[i].classList.add('opacity-50');
                }
            }

            // 해설 노출
            DOM.feedbackContainer.classList.remove('hidden');
            if(isCorrect) {
                DOM.feedbackMsg.innerHTML = "✅ 완벽합니다! 정확한 포인트입니다.";
                DOM.feedbackMsg.className = "font-bold text-lg mb-2 text-green-400";
            } else {
                DOM.feedbackMsg.innerHTML = "❌ 아쉽습니다. 하지만 실전 합격을 위한 훌륭한 예방주사입니다!";
                DOM.feedbackMsg.className = "font-bold text-lg mb-2 text-red-400";
            }
            DOM.feedbackExp.innerHTML = q.explanation;
        }

        function nextQuestion() {
            if (currentQuestionIndex < quizData.length - 1) {
                currentQuestionIndex++;
                loadQuestion();
            } else {
                showResults();
            }
        }

        function showResults() {
            DOM.quizScreen.classList.add('hidden');
            DOM.progressText.classList.add('hidden');
            DOM.progressBarContainer.classList.add('hidden');
            DOM.resultScreen.classList.remove('hidden');

            // 점수 계산 (100점 만점 환산)
            const finalScoreVal = Math.round((score / quizData.length) * 100);
            DOM.finalScore.innerText = finalScoreVal;

            // 오답 노트 생성
            DOM.incorrectList.innerHTML = '';
            const incorrectItems = userAnswers.filter(ans => !ans.isCorrect);

            if (incorrectItems.length === 0) {
                DOM.incorrectList.innerHTML = `<div class="p-4 bg-green-900 border border-green-700 rounded-lg text-center text-green-200">축하합니다! 오답이 없습니다. 이대로 실전까지 가시면 수석 합격입니다!</div>`;
            } else {
                incorrectItems.forEach(item => {
                    const q = item.question;
                    const noteDiv = document.createElement('div');
                    noteDiv.className = 'bg-gray-800 p-4 rounded-lg border-l-4 border-red-500 shadow-md text-left';
                    noteDiv.innerHTML = `
                        <div class="font-bold text-white mb-1">[문제 ${q.id}]</div>
                        <div class="text-sm text-gray-300 mb-2 truncate">${q.text.replace(/<[^>]*>?/gm, ' ')}</div>
                        <div class="text-sm mb-1"><span class="text-red-400 font-semibold">내 선택:</span> ${q.options[item.userSelectedIndex]}</div>
                        <div class="text-sm mb-3"><span class="text-green-400 font-semibold">정답:</span> ${q.options[q.answer]}</div>
                        <div class="text-sm bg-gray-700 p-3 rounded text-gray-200">${q.explanation}</div>
                    `;
                    DOM.incorrectList.appendChild(noteDiv);
                });
            }

            // 🚨 부모 창으로 데이터 전송 (요구사항 완벽 반영)
            const resultData = {
                totalScore: finalScoreVal,
                correctCount: score,
                totalQuestions: quizData.length,
                incorrectLog: incorrectItems.map(item => ({
                    questionId: item.question.id,
                    userChoice: item.userSelectedIndex,
                    correctAnswer: item.question.answer
                }))
            };
            syncToParentGist(resultData);
        }
    </script>
