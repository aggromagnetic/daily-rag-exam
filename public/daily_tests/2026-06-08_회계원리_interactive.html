<!doctype html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>주택관리사보 1차 회계원리 프리미엄 인터랙티브 퀴즈 웹앱</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700&display=swap');
        body { font-family: 'Pretendard', sans-serif; }
    </style>
</head>
<body class="bg-[#0f172a] text-[#f8fafc] min-h-screen flex flex-col justify-between antialiased">

    <header class="border-b border-slate-800 bg-[#1e293b]/50 backdrop-blur sticky top-0 z-50">
        <div class="max-w-3xl mx-auto px-4 py-4 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <span class="bg-indigo-600 text-white text-xs font-bold px-2.5 py-1 rounded-sm uppercase tracking-wider">Pass-Pass</span>

        <div class="w-full bg-slate-800 h-1">
            <div id="progress-bar" class="bg-indigo-500 h-1 transition-all duration-300" style="width: 2.85%"></div>
        </div>
    </header>

    <main class="max-w-3xl w-full mx-auto px-4 py-8 flex-grow flex flex-col justify-center">
        
        <div id="quiz-view" class="space-y-6">
            <div class="bg-[#1e293b] border border-slate-800 rounded-xl p-6 shadow-xl">
                <div class="flex items-start gap-3">
                    <span id="q-number" class="text-indigo-400 font-bold text-xl leading-none mt-1">Q1.</span>
                    <div id="q-text" class="text-slate-100 font-medium text-base md:text-lg leading-relaxed whitespace-pre-line">
                        </div>
                </div>
            </div>

            <div id="options-container" class="space-y-3">
                </div>

            <div id="feedback-box" class="hidden transform transition-all duration-300">
                <div id="feedback-status" class="rounded-t-xl p-4 font-bold text-lg flex items-center gap-2">
                    </div>
                <div class="bg-[#161e2e] border-x border-b border-slate-800 rounded-b-xl p-6 space-y-4">
                    <div>
                        <h4 class="text-xs font-bold text-indigo-400 tracking-wide uppercase mb-1">Gem 일타 강사의 완벽 해설</h4>
                        <p id="explanation-text" class="text-slate-300 text-sm md:text-base leading-relaxed whitespace-pre-line"></p>
                    </div>
                    <button id="next-btn" class="w-full bg-indigo-600 hover:bg-indigo-500 active:bg-indigo-700 text-white font-bold py-3 px-4 rounded-lg shadow-lg shadow-indigo-600/20 transition cursor-pointer text-center">
                        다음 문제로 넘어가기 &rarr;
                    </button>
                </div>
            </div>
        </div>

        <div id="result-view" class="hidden space-y-8 py-4">
            <div class="bg-[#1e293b] border border-slate-800 rounded-xl p-8 text-center shadow-2xl relative overflow-hidden">
                <div class="absolute top-0 left-0 w-full h-1.5 bg-gradient-to-r from-indigo-500 via-purple-500 to-pink-500"></div>
                <h2 class="text-2xl md:text-3xl font-extrabold text-white mb-2">최종 합격 진단 리포트</h2>
                <p class="text-slate-400 text-sm mb-6">수험생님의 실시간 채점 및 오답노트 연동 결과가 완료되었습니다.</p>
                
                <div class="inline-block bg-slate-900/50 border border-slate-800 px-8 py-6 rounded-2xl mb-4">
                    <span class="text-slate-400 block text-xs font-bold uppercase tracking-widest mb-1">최종 득점</span>
                    <span id="final-score" class="text-5xl md:text-6xl font-black text-indigo-400 tracking-tight">0 <span class="text-xl font-medium text-slate-500">/ 35</span></span>
                </div>
                <p id="score-comment" class="text-indigo-300 font-semibold text-base max-w-md mx-auto"></p>
            </div>

            <div class="space-y-4">
                <div class="flex items-center justify-between border-b border-slate-800 pb-2">
                    <h3 class="text-lg font-bold text-white flex items-center gap-2">
                        <span class="inline-block w-2.5 h-2.5 bg-rose-500 rounded-full"></span> 
                        취약 개념 분석 및 약점 극복 오답수첩
                    </h3>
                    <span class="text-xs text-slate-400">자동 복사하여 Gemini에 정밀 분석 요청이 가능합니다.</span>
                </div>
                <div id="incorrect-notes" class="space-y-4">
                    </div>
            </div>
        </div>
    </main>

    <footer class="border-t border-slate-900 bg-slate-950 py-4 text-center text-xs text-slate-600">
        <div class="max-w-3xl mx-auto px-4">
            &copy; 2026 주택관리사보 합격 프리미엄 인터랙티브 시스템. All Rights Reserved.
        </div>
    </footer>

    <script>
        const quizData = [

                options: [

            },
            {
                q: "한국채택국제회계기준(K-IFRS) 재무보고를 위한 개념체계상 '일반목적재무보고의 목적과 한계'에 관한 설명으로 가장 옳지 않은 것은?",

                    "보고기업의 재무성과에 대한 정보는 경영진이 경제적 자원을 얼마나 효율적이고 효과적으로 사용했는지 평가하는 데 도움을 준다.",

                exp: "S1을 1순위로 선배분하고 수수관계 하향 적용을 단행합니다.\n- S1 부문 원가(₩100,000) 1차 안분:\n  S2 배부액 = ₩100,000 × 20% = ₩20,000\n  P1 배부액 = ₩100,000 × 40% = ₩40,000\n  P2 배부액 = ₩100,000 × 40% = ₩40,000\n- S2 부문 총 원가 결합: 기존 고유액(₩80,000) + S1 귀속 수취액(₩20,000) = ₩100,000\n- S2 부문 원가(₩100,000) 2차 안분 (S1은 하향 배부이므로 더 이상 상향하지 않음. 따라서 P1과 P2 배부 비율은 45:45 즉 1:1 안분 처리):\n  P1 배부액 = ₩100,000 × (45/90) = ₩50,000\n- 제조부문 P1이 받게 될 총 보조부문 합계원가 = S1 유입분(₩40,000) + S2 유입분(₩50,000) = ₩90,000",
                kw: "단계배부법, 보조부문원가배분 순서"
            },
            {
                q: "(주)서울은 20×1년 초에 설립되었으며 선입선출법을 가정하여 원가흐름을 파악한다. 20×1년 및 20×2년의 생산량 및 판매량은 다음과 같으며, 총고정제조간접원가는 매년 ₩200,000으로 일정하게 발생하였다. 20×2년도의 전부원가계산과 변동원가계산을 비교할 때, 두 방법 하의 영업이익 차이에 대한 설명으로 가장 옳은 것은? (단, 기초 및 기말 재공품은 존재하지 않는다.)\n\n[자료]\n- 20×1년: 당기 생산량 10,000개 / 당기 판매량 8,000개\n- 20×2년: 당기 생산량 8,000개 / 당기 판매량 9,000개",
                options: [
                    "전부원가계산 영업이익이 변동원가계산 영업이익보다 ₩15,000 더 크다.",
                    "변동원가계산 영업이익이 전부원가계산 영업이익보다 ₩15,000 더 크다.",
                    "전부원가계산 영업이익이 변동원가계산 영업이익보다 ₩25,000 더 크다.",
                    "변동원가계산 영업이익이 전부원가계산 영업이익보다 ₩25,000 더 크다.",
                    "변동원가계산 영업이익이 전부원가계산 영업이익보다 ₩40,000 더 크다."
                ],
                answer: 1,
                exp: "이익조정 차이 도출 공식: '전부영업이익 - 변동영업이익 = 기말재고 고정비 - 기초재고 고정비'\n- 20×1년 단위당 고정제조간접비 = ₩200,000 ÷ 10,000개 = ₩20 / 20×1년말 재고수량 = 2,000개\n  이 재고가 20×2년 '기초재고'에 포함된 고정제조간접비가 됨 = 2,000개 × ₩20 = ₩40,000\n- 20×2년 단위당 고정제조간접비 = ₩200,000 ÷ 8,000개 = ₩25\n  20×2년 말 재고수량 = 기초(2,000개) + 생산(8,000개) - 판매(9,000개) = 1,000개 (선입선출법에 의해 당기 생산분 잔존)\n  20×2년 '기말재고' 포함 고정제조간접비 = 1,000개 × ₩25 = ₩25,000\n- 차이 산출 대입: 전부이익 - 변동이익 = ₩25,000 - ₩40,000 = -₩15,000\n결과값이 음수(-)이므로 변동원가계산 영업이익이 전부원가계산보다 ₩15,000 더 큽니다.",
                kw: "전부원가와 변동원가 이익차이조정, 선입선출법"
            },
            {
                q: "(주)제일은 표준원가계산제도를 채택하고 있다. 20×1년도 제품 2,000단위를 생산하는 데 관련된 직접재료원가의 표준 및 실제 발생 자료가 다음과 같을 때, 직접재료원가의 '가격차이'는 얼마인가? (단, 직접재료의 가격차이는 사용(소비) 시점이 아닌 구입 시점에서 분리하며, 당기 구입량과 사용량은 동일하다.)\n\n[자료]\n- 제품 단위당 직접재료 수량표준: 3kg\n- 직접재료 단위당 가격표준: ₩100/kg\n- 당기 직접재료원가 실제발생액(구입 및 사용액): ₩648,000\n- 직접재료원가 수량차이(능률차이): ₩20,000 (불리)",
                options: ["₩28,000 (유리)", "₩28,000 (불리)", "₩48,000 (유리)", "₩48,000 (불리)", "₩68,000 (불리)"],
                answer: 1,
                exp: "- 총허용표준수량(SQ) 산출: 실제 생산량 2,000단위 × 단당 표준 3kg = 6,000kg\n- 수량(능률)차이 공식을 이용한 실제 투입수량(AQ) 역산:\n  수량차이 = (AQ - SQ) × SP &rarr; (AQ - 6,000kg) × ₩100 = +₩20,000 (불리)\n  AQ - 6,000 = 200kg 이므로 실제 사용량 AQ = 6,200kg\n- 실제 가격투입총액 (AQ × AP) = ₩648,000\n- 재료비 가격차이 도출:\n  가격차이 = (AQ × AP) - (AQ × SP) = ₩648,000 - (6,200kg × ₩100) = ₩648,000 - ₩620,000 = +₩28,000 (불리한 차이)",
                kw: "표준원가계산, 직접재료비 차이분석, 가격차이"
            },
            {
                q: "(주)대양은 제품 A와 제품 B를 생산 및 판매하고 있다. 과거의 판매실적을 분석한 결과, 제품 A와 제품 B의 판매수량 배합비율은 항상 3: 2로 일정하게 유지된다. 제품 A의 단위당 판매가격은 ₩2,000, 단위당 변동원가는 ₩1,200이며, 제품 B의 단위당 판매가격은 ₩3,000, 단위당 변동원가는 ₩1,500이다. 회사의 연간 총고정원가가 ₩1,620,000일 때, (주)대양이 목표 영업이익 ₩540,000을 달성하기 위해 판매해야 하는 제품 B의 수량은 얼마인가?",
                options: ["600단위", "800단위", "1,000단위", "1,200단위", "2,000단위"],
                answer: 1,
                exp: "복수 제품 복합 CVP분석을 패키지 묶음 단위 기준으로 분석 처리합니다.\n- 개별 단위당 공헌이익 산출:\n  제품 A 공헌이익 = ₩2,000 - ₩1,200 = ₩800 / 제품 B 공헌이익 = ₩3,000 - ₩1,500 = ₩1,500\n- 복합 가중평균 단위당 공헌이익 도출 (A 3개, B 2개인 5개 1묶음 패키지 기준):\n  1꾸러미(패키지)당 공헌이익 = (₩800 × 3) + (₩1,500 × 2) = ₩2,400 + ₩3,000 = ₩5,400\n- 이익달성 필요 총 패키지 꾸러미 수 계산:\n  필요 패키지 수 = (총고정비 ₩1,620,000 + 목표이익 ₩540,000) ÷ 패키지 공헌이익(₩5,400) = ₩2,160,000 ÷ ₩5,400 = 400 패키지\n- 제품 B의 소요 판매수량 구하기:\n  400 패키지 × 패키지 내 포함된 제품 B 배합량(2단위) = 800단위",
                kw: "복수제품 CVP분석, 가중평균공헌이익, 제품배합"
            }
        ];

        let currentIdx = 0;
        let score = 0;
        let userResponses = []; // { qIdx, chosen, isCorrect }

        const qNumberEl = document.getElementById("q-number");
        const qTextEl = document.getElementById("q-text");
        const optionsContainer = document.getElementById("options-container");
        
        const feedbackBox = document.getElementById("feedback-box");
        const feedbackStatus = document.getElementById("feedback-status");
        const explanationText = document.getElementById("explanation-text");
        const nextBtn = document.getElementById("next-btn");
        
        const progressText = document.getElementById("progress-text");
        const progressBar = document.getElementById("progress-bar");
        
        const quizView = document.getElementById("quiz-view");
        const resultView = document.getElementById("result-view");
        const finalScoreEl = document.getElementById("final-score");
        const scoreCommentEl = document.getElementById("score-comment");
        const incorrectNotesContainer = document.getElementById("incorrect-notes");

        function loadQuestion(idx) {
            if(idx >= quizData.length) {
                showResults();
                return;
            }
            
            // UI 초기화
            feedbackBox.classList.add("hidden");
            optionsContainer.innerHTML = "";
            
            // 상태 업데이트
            progressText.innerText = `${String(idx + 1).padStart(2, '0')} / ${quizData.length}`;
            progressBar.style.width = `${((idx + 1) / quizData.length) * 100}%`;
            
            // 데이터 매핑
            const currentQ = quizData[idx];
            qNumberEl.innerText = `Q${idx + 1}.`;
            qTextEl.innerText = currentQ.q;
            
            // 보기 렌더링
            currentQ.options.forEach((opt, oIdx) => {
                const btn = document.createElement("button");
                btn.className = "w-full text-left bg-slate-900 hover:bg-slate-800 border border-slate-800 rounded-xl p-4 transition duration-200 cursor-pointer flex items-center gap-4 text-slate-200 font-medium group active:border-indigo-500";
                
                const numSpan = document.createElement("span");
                numSpan.className = "w-6 h-6 rounded-full bg-slate-800 text-slate-400 group-hover:bg-indigo-600 group-hover:text-white flex items-center justify-center text-xs font-bold font-mono transition";
                numSpan.innerText = oIdx + 1;
                
                const txtSpan = document.createElement("span");
                txtSpan.className = "flex-1 text-sm md:text-base leading-snug";
                txtSpan.innerText = opt;
                
                btn.appendChild(numSpan);
                btn.appendChild(txtSpan);
                
                btn.addEventListener("click", () => handleSelect(oIdx));
                optionsContainer.appendChild(btn);
            });
        }

        function handleSelect(chosenOptIdx) {
            // 이미 답을 고른 경우 무시
            if(!feedbackBox.classList.contains("hidden")) return;
            
            const currentQ = quizData[currentIdx];
            const isCorrect = (chosenOptIdx === currentQ.answer);
            
            if(isCorrect) score++;
            
            userResponses.push({
                qIdx: currentIdx,
                chosen: chosenOptIdx,
                isCorrect: isCorrect
            });

            // 옵션 스타일 변경 피드백
            const optionButtons = optionsContainer.children;
            for(let i=0; i<optionButtons.length; i++) {
                optionButtons[i].classList.remove("hover:bg-slate-800", "bg-slate-900");
                if(i === currentQ.answer) {
                    optionButtons[i].classList.add("bg-emerald-950/40", "border-emerald-500", "text-emerald-300");
                    optionButtons[i].querySelector("span").className = "w-6 h-6 rounded-full bg-emerald-500 text-slate-950 flex items-center justify-center text-xs font-bold font-mono";
                } else if(i === chosenOptIdx && !isCorrect) {
                    optionButtons[i].classList.add("bg-rose-950/40", "border-rose-500", "text-rose-300");
                    optionButtons[i].querySelector("span").className = "w-6 h-6 rounded-full bg-rose-500 text-slate-950 flex items-center justify-center text-xs font-bold font-mono";
                } else {
                    optionButtons[i].classList.add("opacity-40", "bg-slate-900/20");
                }
            }

            // 하단 피드백 박스 업데이트
            if(isCorrect) {
                feedbackStatus.className = "bg-emerald-600 text-white rounded-t-xl p-4 font-bold text-lg flex items-center gap-2";
                feedbackStatus.innerHTML = `<span>&#127881;</span> 정답입니다! 아주 훌륭합니다.`;
            } else {
                feedbackStatus.className = "bg-rose-600 text-white rounded-t-xl p-4 font-bold text-lg flex items-center gap-2";
                feedbackStatus.innerHTML = `<span>&#128161;</span> 아쉽지만 오답입니다. (정답: ①②③④⑤[${currentQ.answer + 1}번])`;
            }
            
            explanationText.innerText = currentQ.exp;
            feedbackBox.classList.remove("hidden");
            
            // 즉각적인 부모창 데이터 동기화 연동
            syncToParentGist();
        }

        nextBtn.addEventListener("click", () => {
            currentIdx++;
            loadQuestion(currentIdx);
        });

        function showResults() {
            quizView.classList.add("hidden");
            resultView.classList.remove("hidden");
            
            progressText.innerText = "종료";
            progressBar.style.width = "100%";
            progressBar.className = "bg-gradient-to-r from-indigo-500 via-purple-500 to-pink-500 h-1";

            finalScoreEl.innerHTML = `${score} <span class="text-xl font-medium text-slate-500">/ ${quizData.length}</span>`;
            
            // 일타강사 총평 멘트
            let comment = "";
            const ratio = score / quizData.length;
            if(ratio >= 0.85) {
                comment = "🏆 대단합니다! 이미 주택관리사보 합격권 고지에 도달하셨습니다. 실수 방지에만 집중하시면 무난히 수석 패스입니다!";
            } else if(ratio >= 0.6) {
                comment = "✨ 합격 안정권 진입 직전입니다! 오답노트 정리된 핵심 키워드를 한 번만 리마인드 하시면 무조건 합격입니다.";
            } else {
                comment = "🔥 지금부터가 진짜 시작입니다! 낙담 마시고 취약 개념 키워드를 Gemini와 집중 보완하여 약점을 합격의 무기로 만드십시오.";
            }
            scoreCommentEl.innerText = comment;

            // 오답노트 빌드
            incorrectNotesContainer.innerHTML = "";
            const incorrects = userResponses.filter(r => !r.isCorrect);

            if(incorrects.length === 0) {
                incorrectNotesContainer.innerHTML = `
                    <div class="bg-slate-900/60 border border-slate-800 rounded-xl p-8 text-center text-emerald-400 font-semibold">
                        🎉 틀린 문제가 단 하나도 없습니다! 회계원리 마스터 자격 충족!
                    </div>
                `;
            } else {
                incorrects.forEach(item => {
                    const origQ = quizData[item.qIdx];
                    const card = document.createElement("div");
                    card.className = "bg-[#1e293b] border border-slate-800 rounded-xl p-5 space-y-3 shadow-md";
                    
                    card.innerHTML = `
                        <div class="flex items-center justify-between border-b border-slate-800 pb-2">
                            <span class="font-bold text-rose-400">오답 문항 Q${item.qIdx + 1}</span>
                            <span class="bg-slate-900 border border-slate-800 text-indigo-400 text-xs px-2.5 py-1 rounded-md font-semibold">핵심: ${origQ.kw}</span>
                        </div>
                        <p class="text-slate-300 text-xs md:text-sm line-clamp-2 italic text-ellipsis overflow-hidden">${origQ.q}</p>
                        <div class="grid grid-cols-2 gap-4 text-xs bg-slate-950 p-3 rounded-lg font-mono">
                            <div><span class="text-slate-500">수험생님 선택:</span> <span class="text-rose-400 font-bold">${item.chosen + 1}번</span></div>
                            <div><span class="text-slate-500">실제 확정정답:</span> <span class="text-emerald-400 font-bold">${origQ.answer + 1}번</span></div>
                        </div>
                    `;
                    incorrectNotesContainer.appendChild(card);
                });
            }
            
            // 최종 결과값 전송 동기화
            syncToParentGist();
        }

        // 부모 창으로 데이터 연동 전달 스크립트 코드 탑재 필수 규칙 이행
        function syncToParentGist() {
            const payload = {
                type: "HOUSING_MANAGER_QUIZ_SYNC",
                timestamp: new Date().getTime(),
                summary: {
                    totalQuestions: quizData.length,
                    currentIdx: currentIdx,
                    score: score,
                    isFinished: currentIdx >= quizData.length
                },
                details: userResponses
            };
            
            // 1. postMessage를 통한 부모 창 및 iframe 상위 연동 
            if (window.parent && window.parent !== window) {
                window.parent.postMessage(payload, "*");
            }
            
            // 2. 콘솔 추적 로그 남김 (데이터 손실 방지 백업)
            console.log("=== [Sync Data to Parent Interlock] ===", payload);
        }

        // 초기 시작 동작
        window.addEventListener("load", () => {
            loadQuestion(currentIdx);
            syncToParentGist();
        });
    </script>
</body>
