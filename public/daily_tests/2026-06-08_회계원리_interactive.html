<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>K-IFRS 회계학 프리미엄 인터랙티브 퀴즈</title>
  <style>
    :root {
      --bg-main: #f4f6f9;
      --surface: #ffffff;
      --text-main: #2d3748;
      --text-muted: #718096;
      --primary: #3182ce;
      --primary-hover: #2b6cb0;
      --success: #38a169;
      --error: #e53e3e;
      --border: #e2e8f0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    body { background-color: var(--bg-main); color: var(--text-main); line-height: 1.6; padding: 16px; }
    .container { max-width: 680px; margin: 0 auto; }
    header { background: linear-gradient(135deg, #1a365d, #2a4365); color: white; padding: 20px; border-radius: 12px; margin-bottom: 16px; text-align: center; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
    header h1 { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
    header p { font-size: 13px; opacity: 0.85; }
    .progress-bar { background-color: rgba(255,255,255,0.2); height: 6px; border-radius: 3px; margin-top: 12px; overflow: hidden; }
    .progress-fill { background-color: #63b3ed; height: 100%; width: 0%; transition: width 0.3s ease; }
    .card { background: var(--surface); border-radius: 12px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 16px; display: none; }
    .card.active { display: block; animation: fadeIn 0.4s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
    .q-meta { font-size: 13px; color: var(--primary); font-weight: 600; margin-bottom: 6px; }
    .q-text { font-size: 15px; font-weight: 600; margin-bottom: 14px; white-space: pre-wrap; word-break: break-all; }
    .box-criterion { background-color: #f7fafc; border: 1px solid var(--border); border-left: 4px solid #4a5568; padding: 12px; border-radius: 6px; font-size: 14px; margin-bottom: 14px; white-space: pre-wrap; font-family: inherit; }
    .options-container { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
    .option-btn { background: var(--surface); border: 1px solid var(--border); padding: 12px 14px; border-radius: 8px; text-align: left; font-size: 14px; cursor: pointer; transition: all 0.2s ease; display: block; width: 100%; }
    .option-btn:hover { background-color: #ebf8ff; border-color: var(--primary); }
    .option-btn.correct { background-color: #c6f6d5 !important; border-color: var(--success) !important; color: #22543d; font-weight: 600; }
    .option-btn.incorrect { background-color: #fed7d7 !important; border-color: var(--error) !important; color: #742a2a; }
    .option-btn:disabled { pointer-events: none; }
    .feedback-panel { border-radius: 8px; padding: 14px; font-size: 13.5px; display: none; margin-top: 12px; }
    .feedback-panel.correct { display: block; background-color: #f0fff4; border: 1px solid #c6f6d5; color: #22543d; }
    .feedback-panel.incorrect { display: block; background-color: #fff5f5; border: 1px solid #fed7d7; color: #742a2a; }
    .feedback-title { font-weight: 700; margin-bottom: 4px; display: flex; align-items: center; gap: 6px; }
    .nav-actions { display: flex; justify-content: space-between; align-items: center; margin-top: 16px; border-top: 1px solid var(--border); padding-top: 14px; }
    .btn { padding: 10px 16px; border: none; border-radius: 6px; font-size: 13.5px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
    .btn-hint { background-color: #edf2f7; color: #4a5568; }
    .btn-hint:hover { background-color: #e2e8f0; }
    .btn-next { background-color: var(--primary); color: white; display: none; margin-left: auto; }
    .btn-next:hover { background-color: var(--primary-hover); }
    .hint-text { background-color: #fffff0; border: 1px dashed #ecc94b; color: #744210; padding: 10px; border-radius: 6px; font-size: 13px; margin-top: 10px; display: none; }
    .result-view { text-align: center; padding: 30px 20px; }
    .score-circle { width: 100px; height: 100px; border-radius: 50%; background: #ebf8ff; border: 4px solid var(--primary); display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; font-size: 28px; font-weight: 800; color: var(--primary); }
    .summary-text { font-size: 15px; margin-bottom: 20px; color: var(--text-muted); }
    .wrong-list-title { text-align: left; font-size: 14px; font-weight: 700; border-bottom: 2px solid #cbd5e0; padding-bottom: 4px; margin-bottom: 10px; color: #4a5568; }
    .wrong-item { background: #fff5f5; border: 1px solid #fed7d7; border-radius: 6px; padding: 10px; font-size: 13px; text-align: left; margin-bottom: 8px; }
    .wrong-item-num { font-weight: 700; color: var(--error); margin-bottom: 2px; }
    .btn-retry { background-color: var(--success); color: white; width: 100%; padding: 12px; font-size: 15px; margin-top: 14px; }
    .btn-retry:hover { background-color: #2f855a; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1 id="quiz-title">K-IFRS 회계학 프리미엄 퀴즈</h1>
      <p id="quiz-progress-text">준비 중...</p>
      <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
    </header>
    <div id="quiz-box"></div>
  </div>

  <script>
    const quizData = [
      {
        id: 1,
        question: "(주)한국의 20×1년 초 자산총계는 ₩500,000이고 부채총계는 ₩200,000이다. 20×1년 회계기간 동안 총수익은 ₩300,000, 총비용은 ₩250,000이 발생하였으며, 기중 유상증자를 통해 현금 ₩50,000을 수취하였다. 20×1년 말 부채총계가 ₩250,000일 때, 회계등식을 이용해 도출한 20×1년 말 자산총계는 얼마인가? (단, 주어진 자료 외의 다른 자본거래는 없다.)",
        options: ["₩550,000", "₩600,000", "₩650,000", "₩700,000", "₩750,000"],
        answer: 2,
        hint: "기초 재무상태표 정보를 통해 기초 자본을 먼저 산출한 뒤, 기중 당기순이익(수익-비용) 및 증자 거래를 반영하여 기말 자본을 도출해 보십시오.",
        rationale: "기초 자본(₩300,000)에 당기순이익(₩50,000)과 유상증자(₩50,000)를 합산하면 기말 자본은 ₩400,000이 되므로, 여기에 기말 부채(₩250,000)를 더하면 기말 자산총계는 ₩650,000이 됩니다."
      },
      {
        id: 2,
        question: "한국채택국제회계기준(K-IFRS)의 재무보고를 위한 개념체계에서 규정하는 '유용한 재무정보의 질적 특성'에 관한 설명으로 가장 옳은 것은?",
        options: [
          "목적적합한 재무정보는 예측가치, 확인가치 또는 이 둘 모두를 갖는다.",
          "표현충실성은 모든 면에서 정확한 것을 의미하며, 현상을 기술하는 데 오류나 누락이 없어야만 달성되는 특성이다.",
          "검증가능성은 근본적 질적 특성 중 하나로, 정보가 나타내고자 하는 경제적 현상을 충실히 표현하는지를 정보이용자가 확인하는 데 도움을 준다.",
          "중요성은 개별 기업 재무보고서 관점에서 해당 정보와 관련된 항목의 성격에만 근거하여 해당 기업에 특유한 측면의 목적적합성을 의미한다.",
          "비교가능성, 검증가능성, 적시성, 이해가능성 등의 보강적 질적 특성은 정보가 목적적합하지 않더라도 이를 개별적으로 유용하게 만들 수 있다."
        ],
        answer: 0,
        hint: "개념체계상 근본적 질적 특성(목적적합성, 표현충실성)과 보강적 질적 특성의 명확한 정의 및 상호 관계를 비교해 보십시오.",
        rationale: "목적적합한 정보는 이용자의 의사결정에 차이를 만들어낼 수 있어야 하며 이를 위해 예측가치나 확인가치를 갖추어야 합니다. 표현충실성은 완벽한 정확성을 뜻하지 않으며, 검증가능성은 보강적 특성이고, 중요성은 성격과 규모를 모두 고려합니다."
      },
      {
        id: 3,
        question: "한국채택국제회계기준(K-IFRS) 재무보고를 위한 개념체계에서 제시하는 재무제표 요소의 '측정기준'에 관한 설명으로 가장 옳지 않은 것은?",
        options: [
          "역사적 원가는 자산을 취득하거나 창출할 때 발생한 원가의 가치로서, 자산을 취득하거나 창출하기 위하여 지급한 대가와 거래원가를 포함한다.",
          "공정가치는 측정일에 시장참여자 사이의 정상거래에서 자산을 매도할 때 받거나 부채를 이전할 때 지급하게 될 가격을 말한다.",
          "사용가치는 기업이 자산의 사용과 궁극적인 처분으로 얻을 것으로 기대하는 현금흐름 등의 현재가치이다.",
          "이행가치는 부채를 이행할 때 이전해야 하는 현금이나 그 밖의 경제적 자원의 현재가치이다.",
          "자산의 현행원가는 측정일 현재 동등한 자산의 원가로서, 측정일에 지급할 대가에서 그 날에 발생할 거래원가를 차감한 금액으로 측정한다."
        ],
        answer: 4,
        hint: "현행원가는 측정일 현재 기준의 원가로서, 자산을 취득할 때 발생하는 거래원가를 처리하는 방향성(가산 혹은 차감)을 점검해 보십시오.",
        rationale: "자산의 현행원가는 측정일 현재 동등한 자산에 대해 지급할 대가에 그 날에 발생할 거래원가를 '포함(가산)'하여 측정하므로 차감한다고 기술한 항목은 오답입니다."
      },
      {
        id: 4,
        question: "한국채택국제회계기준(K-IFRS) 재무보고를 위한 개념체계상 '일반목적재무보고의 목적과 한계'에 관한 설명으로 가장 옳지 않은 것은?",
        options: [
          "일반목적재무보고서의 주된 목적은 현재 및 잠재적 투자자, 대여자 및 기타 채권자가 기업에 자원을 제공하는 것과 관련된 의사결정을 할 때 유용한 보고기업의 재무정보를 제공하는 것이다.",
          "일반목적재무보고서는 보고기업의 가치를 직접 보여주기 위해 고안된 것이 아니며, 현재 및 잠재적 투자자 등이 보고기업의 가치를 추정하는 데 도움을 주는 정보를 제공한다.",
          "일반목적재무보고서는 현재 및 잠재적 투자자, 대여자 및 기타 채권자가 필요로 하는 모든 정보를 완벽하게 제공하므로, 경영진과 감독당국 역시 이를 주된 정보 원천으로 의존해야 한다.",
          "보고기업의 재무성과에 대한 정보는 경영진이 경제적 자원을 얼마나 효율적이고 효과적으로 사용했는지 평가하는 데 도움을 준다.",
          "재무보고를 위한 개념체계는 회계기준이 아니며, 어떠한 내용도 특정 한국채택국제회계기준이나 그 요구사항에 우선하지 않는다."
        ],
        answer: 2,
        hint: "일반목적재무보고가 정보이용자 모두의 요구조건을 완벽히 충족할 수 있는지와 경영진이 자체 보고서 외에 이것에 전적으로 의존하는지 생각해 보십시오.",
        rationale: "일반목적재무보고서는 주요 정보이용자가 필요로 하는 모든 정보를 완벽히 제공할 수 없으며, 기업 내부 정보를 언제든 얻을 수 있는 경영진은 재무보고서의 주된 대상이 아닙니다."
      },
      {
        id: 5,
        question: "한국채택국제회계기준(K-IFRS) 재무보고를 위한 개념체계에 따르면 '비용'은 자산의 감소나 부채의 증가로 인해 자본의 감소를 초래할 때 인식한다. (주)대한은 당기 말 재고자산 실사 및 평가를 수행하였으며, 이 과정에서 확인된 자산의 가치 감소분을 포괄손익계산서상 비용(매출원가 및 기타비용)으로 인식하고자 한다. 다음 자료를 바탕으로 당기 포괄손익계산서에 인식될 '재고자산감모손실'과 '재고자산평가손실'의 총 합계액(비용 인식 총액)은 얼마인가? (단, 재고자산평가손실과 정상감모손실은 매출원가에 포함하고, 비정상감모손실은 영업외비용으로 처리한다.)",
        box: "[자료]\n- 장부상 기말 재고수량: 500개\n- 실제 창고 실사수량: 450개\n- 단위당 취득원가: ₩1,000\n- 단위당 기말 순실현가능가치: ₩900\n- 감모수량 중 40%는 정상적인 원인으로, 60%는 비정상적인 원인으로 발생하였다.",
        options: ["₩45,000", "₩50,000", "₩65,000", "₩80,000", "₩95,000"],
        answer: 4,
        hint: "정상/비정상 감모분류는 손익계산서상 표시 위치(매출원가 대 영업외비용)의 차이일 뿐, 둘 다 당기 '비용' 항목에 속한다는 점과 평가손실은 실제 수량을 기준으로 계산함을 상기하십시오.",
        rationale: "감모손실 총액은 (500개-450개)×₩1,000 = ₩50,000이며, 평가손실은 450개×(₩1,000-₩900) = ₩45,000입니다. 회계분류상 매출원가나 영업외비용에 관계없이 포괄손익계산서에 반영되는 총 가치 감소액은 두 항목의 단순 합산액인 ₩95,000입니다."
      },
      {
        id: 6,
        question: "한국채택국제회계기준(K-IFRS) 재무보고를 위한 개념체계에서 재무정보는 미래 결과를 예측하기 위해 사용하는 절차의 투입요소로 사용될 때 '예측가치'를 갖는다. (주)민국은 투자자에게 목적적합한 예측 정보를 제공하기 위해 CVP 분석을 수행하고 있다. (주)민국이 단위당 판매가격 ₩1,000, 단위당 변동원가 ₩600인 단일 제품을 판매하여 당기에 매출액의 15%에 해당하는 영업이익을 획득할 것으로 추정될 때, 회사의 예측 안전한계율(Margin of Safety Ratio)은 얼마인가? (단, 주어진 자료 외에 다른 조건은 없으며, 안전한계율은 매출액 대비 안전한계매출액의 비율을 의미한다.)",
        options: ["15.0%", "25.0%", "37.5%", "40.0%", "62.5%"],
        answer: 2,
        hint: "CVP 분석의 핵심 공식인 '영업이익률 = 안전한계율 × 공헌이익률'의 연계 구조를 적용하여 구하고자 하는 비율을 도출해 보십시오.",

      },
      {
        id: 7,

    let currentIdx = 0;
    let scores = []; // { id: num, isCorrect: bool, chosen: num }
    let showHintCount = 0;

    function syncToParentGist() {
      if (window.parent && window.parent.postMessage) {
        const wrongAnswers = scores.filter(s => !s.isCorrect).map(s => {
          const q = quizData.find(item => item.id === s.id);
          return {
            id: s.id,
            questionText: q.question,
            chosenAnswer: q.options[s.chosen],
            correctAnswer: q.options[q.answer],
            rationale: q.rationale
          };
        });
        
        const messageData = {
          type: "QUIZ_SYNC",
          payload: {
            totalQuestions: quizData.length,
            correctCount: scores.filter(s => s.isCorrect).length,
            wrongCount: wrongAnswers.length,
            wrongGistData: wrongAnswers,
            timestamp: new Date().toISOString()
          }
        };
        window.parent.postMessage(messageData, "*");
      }
    }

    function renderQuiz() {
      const quizBox = document.getElementById("quiz-box");
      quizBox.innerHTML = "";

      if (currentIdx >= quizData.length) {
        renderResult();
        return;
      }

      const item = quizData[currentIdx];
      const card = document.createElement("div");
      card.className = "card active";

      const meta = document.createElement("div");
      meta.className = "q-meta";
      meta.innerText = `문항 ${currentIdx + 1} / ${quizData.length}`;
      card.appendChild(meta);

      const qText = document.createElement("div");
      qText.className = "q-text";
      qText.innerText = `${item.id}. ${item.question}`;
      card.appendChild(qText);

      if (item.box) {
        const boxDiv = document.createElement("div");
        boxDiv.className = "box-criterion";
        boxDiv.innerText = item.box;
        card.appendChild(boxDiv);
      }

      const optionsContainer = document.createElement("div");
      optionsContainer.className = "options-container";

      const btnArray = [];
      item.options.forEach((opt, idx) => {
        const btn = document.createElement("button");
        btn.className = "option-btn";
        btn.innerText = opt;
        btn.onclick = () => handleSelection(idx, btnArray, item);
        optionsContainer.appendChild(btn);
        btnArray.push(btn);
      });
      card.appendChild(optionsContainer);

      const hintText = document.createElement("div");
      hintText.className = "hint-text";
      hintText.id = `hint-${item.id}`;
      hintText.innerText = `💡 힌트: ${item.hint}`;
      card.appendChild(hintText);

      const feedback = document.createElement("div");
      feedback.className = "feedback-panel";
      feedback.id = `feedback-${item.id}`;
      card.appendChild(feedback);

      const nav = document.createElement("div");
      nav.className = "nav-actions";

      const hintBtn = document.createElement("button");
      hintBtn.className = "btn btn-hint";
      hintBtn.innerText = "힌트 보기";
      hintBtn.onclick = () => {
        hintText.style.display = "block";
        hintBtn.style.display = "none";
      };
      nav.appendChild(hintBtn);

      const nextBtn = document.createElement("button");
      nextBtn.className = "btn btn-next";
      nextBtn.id = `next-btn-${item.id}`;
      nextBtn.innerText = currentIdx === quizData.length - 1 ? "결과 확인" : "다음 문항 ➔";
      nextBtn.onclick = () => {
        currentIdx++;
        updateProgressBar();
        renderQuiz();
      };
      nav.appendChild(nextBtn);

      card.appendChild(nav);
      quizBox.appendChild(card);
      updateProgressBar();
    }

    function handleSelection(selectedIdx, btnArray, item) {
      btnArray.forEach((btn, idx) => {
        btn.disabled = true;
        if (idx === item.answer) {
          btn.classList.add("correct");
        } else if (idx === selectedIdx) {
          btn.classList.add("incorrect");
        }
      });

      const isCorrect = selectedIdx === item.answer;
      scores.push({ id: item.id, isCorrect: isCorrect, chosen: selectedIdx });

      const feedback = document.getElementById(`feedback-${item.id}`);
      feedback.className = `feedback-panel ${isCorrect ? 'correct' : 'incorrect'}`;
      feedback.innerHTML = `
        <div class="feedback-title">
          <span>${isCorrect ? '⭕ 정답입니다!' : '❌ 오답입니다.'}</span>
        </div>
        <div>${item.rationale}</div>
      `;

      document.getElementById(`next-btn-${item.id}`).style.display = "block";
      syncToParentGist();
    }

    function updateProgressBar() {
      const pct = (currentIdx / quizData.length) * 100;
      document.getElementById("progress-fill").style.width = `${pct}%`;
      if (currentIdx < quizData.length) {
        document.getElementById("quiz-progress-text").innerText = `진행률: ${currentIdx + 1} / ${quizData.length}번 문제 푸는 중`;
      } else {
        document.getElementById("quiz-progress-text").innerText = `테스트 완료`;
      }
    }

    function renderResult() {
      const quizBox = document.getElementById("quiz-box");
      const correctCount = scores.filter(s => s.isCorrect).length;
      
      let html = `
        <div class="card active result-view">
          <div class="score-circle">${correctCount} / ${quizData.length}</div>
          <h3>테스트가 종료되었습니다!</h3>
          <p class="summary-text">틀린 문항 요약 정보가 아래 배정되며, 부모 프레임 오답 수첩 연동 데이터가 정상 전송되었습니다.</p>
      `;

      const wrongs = scores.filter(s => !s.isCorrect);
      if (wrongs.length > 0) {
        html += `<div class="wrong-list-title">오답 분석 대상 리스트</div>`;
        wrongs.forEach(w => {
          const original = quizData.find(q => q.id === w.id);
          html += `
            <div class="wrong-item">
              <div class="wrong-item-num">⚠️ ${original.id}번 문제 오답 기록</div>
              <div><b>선택한 보기:</b> ${original.options[w.chosen]}</div>
              <div style="color:var(--success); margin-top:2px;"><b>정확한 정답:</b> ${original.options[original.answer]}</div>
            </div>
          `;
        });
      } else {
        html += `<p style="color:var(--success); font-weight:700; margin:16px 0;">🎉 축하합니다! 모든 난제 계산 로직을 완벽 정복하셨습니다.</p>`;
      }

      html += `
          <button class="btn btn-retry" onclick="restartQuiz()">처음부터 다시 풀기</button>
        </div>
      `;
      quizBox.innerHTML = html;
      syncToParentGist();
    }

    function restartQuiz() {
      currentIdx = 0;
      scores = [];
      renderQuiz();
    }

    window.onload = () => {
      renderQuiz();
    };
  </script>
</body>
