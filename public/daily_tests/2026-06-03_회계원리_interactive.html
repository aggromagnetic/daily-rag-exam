<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>K-IFRS 회계학 프리미엄 퀴즈 웹앱</title>
  <style>
    :root {
      --bg-main: #f8fafc;
      --surface: #ffffff;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --success: #16a34a;
      --error: #dc2626;
      --accent: #f0fdf4;
      --accent-err: #fef2f2;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    body { background-color: var(--bg-main); color: var(--text-main); line-height: 1.6; padding: 16px; }
    .container { max-width: 768px; margin: 0 auto; background: var(--surface); border-radius: 16px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05), 0 2px 4px -1px rgba(0,0,0,0.03); padding: 24px; }
    header { border-bottom: 2px solid var(--border); padding-bottom: 16px; margin-bottom: 24px; display: flex; justify-content: space-between; align-items: center; }
    h1 { font-size: 20px; font-weight: 700; color: var(--primary); }
    .score-board { font-size: 14px; font-weight: 600; background: #eff6ff; color: var(--primary); padding: 6px 12px; border-radius: 20px; }
    .quiz-flow { display: flex; flex-direction: column; gap: 32px; }
    .q-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px; position: relative; transition: all 0.2s ease; }
    .q-card.answered { border-color: #cbd5e1; background: #fafafa; }
    .q-header { display: flex; align-items: flex-start; gap: 8px; margin-bottom: 14px; }
    .q-num { background: var(--primary); color: #fff; font-size: 13px; font-weight: 700; padding: 2px 8px; border-radius: 6px; white-space: nowrap; margin-top: 2px; }
    .q-text { font-size: 15px; font-weight: 600; color: var(--text-main); white-space: pre-line; word-break: break-all; }
    .box-info { background: #f1f5f9; border-left: 4px solid var(--text-muted); padding: 12px; margin: 12px 0; font-size: 14px; border-radius: 0 8px 8px 0; white-space: pre-line; color: #334155; font-weight: 500; }
    .options-list { display: flex; flex-direction: column; gap: 8px; margin-top: 16px; }
    .opt-btn { width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--border); padding: 12px 16px; border-radius: 8px; font-size: 14px; cursor: pointer; transition: all 0.15s ease; color: var(--text-main); display: flex; align-items: center; }
    .opt-btn:hover { background: #f8fafc; border-color: #cbd5e1; }
    .opt-btn.selected { border-color: var(--primary); background: #f0f5ff; font-weight: 600; }
    .opt-btn.correct { background: var(--accent) !important; border-color: var(--success) !important; color: var(--success) !important; font-weight: 600; }
    .opt-btn.wrong { background: var(--accent-err) !important; border-color: var(--error) !important; color: var(--error) !important; }
    .feedback-box { margin-top: 16px; padding: 14px; border-radius: 8px; font-size: 14px; display: none; border: 1px solid #fed7d7; background: #fff5f5; }
    .feedback-box.pass { border-color: #bbf7d0; background: #f0fdf4; }
    .fb-title { font-weight: 700; margin-bottom: 4px; display: flex; align-items: center; gap: 4px; }
    .fb-title.pass { color: var(--success); }
    .fb-title.fail { color: var(--error); }
    .fb-desc { color: #475569; white-space: pre-line; font-size: 13.5px; }
    footer { margin-top: 40px; text-align: center; }
    .submit-btn { background: var(--primary); color: #fff; border: none; padding: 14px 28px; font-size: 16px; font-weight: 700; border-radius: 8px; cursor: pointer; width: 100%; box-shadow: 0 4px 12px rgba(37,99,235,0.2); transition: background 0.2s; }
    .submit-btn:hover { background: var(--primary-hover); }
    @media(max-width: 480px) { body { padding: 8px; } .container { padding: 16px; } h1 { font-size: 18px; } }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>K-IFRS 회계학 RAG 모의고사</h1>
    <div class="score-board">제출 전</div>
  </header>

  <form id="quizForm" onsubmit="event.preventDefault();">
    <div class="quiz-flow" id="quizContainer"></div>
    <footer style="margin-top: 32px;">
      <button type="button" class="submit-btn" onclick="gradeQuiz()">시험지 제출 및 오답 데이터 동기화</button>
    </footer>
  </form>
</div>

<script>
  const quizData = [
    {
      id: 1,
      q: "(주)미래의 20×1년도 기말 자산은 ₩800,000, 기말 부채는 ₩300,000이다. 20×1년 중 유상증자로 ₩100,000을 조달하였고, 주주에게 현금배당 ₩30,000을 지급하였다. 20×1년 초 자산이 ₩500,000이고 부채가 ₩200,000이었다고 가정할 때, 20×1년도 '당기순이익'은 얼마인가? (단, 당기 중 기타포괄손익은 발생하지 않았다.)",
      opts: ["₩100,000", "₩130,000", "₩150,000", "₩170,000", "₩200,000"],
      ans: 2,
      exp: "기초자본 = 기초자산(500,000) - 기초부채(200,000) = ₩300,000\n기말자본 = 기말자산(800,000) - 기말부채(300,000) = ₩500,000\n자본변동등식: 기말자본 = 기초자본 + 유상증자 - 현금배당 + 당기순이익\n500,000 = 300,000 + 100,000 - 30,000 + 당기순이익\n500,000 = 370,000 + 당기순이익\n따라서 당기순이익은 ₩130,000(②번)입니다."
    },
    {
      id: 2,
      q: "한국채택국제회계기준(K-IFRS)의 '재무보고를 위한 개념체계'에 따른 유용한 재무정보의 질적 특성에 관한 설명으로 옳지 않은 것은?",
      opts: [
        "재무정보가 유용하기 위해서는 목적적합해야 하고 나타내고자 하는 바를 충실하게 표현해야 한다.",
        "목적적합한 재무정보는 정보이용자의 의사결정에 차이가 나도록 할 수 있으며, 이를 위해 예측가치나 확인가치를 가져야 한다.",
        "완벽한 표현충실성을 달성하기 위해서는 서술이 완전하고 중립적이며 오류가 없어야 한다.",
        "비교가능성, 검증가능성, 적시성, 이해가능성은 재무정보의 유용성을 결정짓는 근본적 질적 특성에 해당한다.",
        "검증가능성은 합리적인 판단력이 있고 독립적인 서로 다른 관찰자가 어떤 서술이 표현충실성에 있어 대체로 합의에 이를 수 있음을 의미한다."
      ],
      ans: 4,
      exp: "목적적합성과 표현충실성은 '근본적 질적 특성'이며, 비교가능성, 검증가능성, 적시성, 이해가능성은 정보의 유용성을 높여주는 '보강적 질적 특성'입니다. 따라서 ④번은 근본적 질적 특성과 보강적 질적 특성을 혼동하여 설명했으므로 오답입니다."
    },
    {
      id: 3,
      q: "한국채택국제회계기준(K-IFRS)의 '재무보고를 위한 개념체계'에서 제시하는 재무제표 요소의 측정기준에 관한 설명으로 옳지 않은 것은?",

      ans: 5,
      exp: "역사적 원가 측정 방식 하에서는 부채의 장부금액을 매 측정일마다 시장 이자율의 변동에 따라 지속적으로 갱신하지 않습니다. 측정일의 시장 조건 변동을 반영하여 장부금액을 실시간으로 갱신하는 방식은 '현행가치(공정가치 등)' 측정 방식의 핵심 특징입니다."
    },
    {
      id: 4,
      q: "기업의 재무상태표에 보고되는 부채 중 한국채택국제회계기준(K-IFRS)상 '금융부채'에 해당하지 않는 비금융부채 항목만을 <보기>에서 모두 고른 것은?",
      box: "<보기>\nㄱ. 거래처로부터 상품을 매입하고 발생한 외상매입금\nㄴ. 거래 은행으로부터 자금을 차입하면서 발행한 약속어음\nㄷ. 고객에게 재화나 용역을 미래에 제공하기로 하고 미리 수취한 선수금\nㄹ. 종업원에게 미래에 지급해야 할 의무가 있는 퇴직급여부채\nㅁ. 과세당국에 납부해야 할 미지급법인세\nㅂ. 장기 자금 조달을 위해 자본시장에서 발행한 사채(회사채)",
      opts: ["ㄱ, ㄴ, ㅂ", "ㄷ, ㄹ, ㅁ", "ㄱ, ㄷ, ㅁ", "ㄴ, ㄹ, ㅂ", "ㄷ, ㅁ, ㅂ"],
      ans: 2,
      exp: "금융부채는 거래상대방에게 현금 등 금융자산을 인도하기로 한 '계약상 의무'입니다.\n- ㄱ, ㄴ, ㅂ: 현금을 지급할 계약상 의무가 있으므로 금융부채입니다.\n- ㄷ(선수금): 미래에 현금이 아닌 '재화나 용역'을 제공할 의무이므로 비금융부채입니다.\n- ㄹ(퇴직급여부채): 의제의무 성격이 포함되며 K-IFRS 제1019호의 특수 적용을 받는 비금융부채입니다.\n- ㅁ(미지급법인세): 계약이 아니라 '법률(세법)'에 의해 강제되는 의무이므로 비금융부채입니다.\n따라서 비금융부채 항목만을 고른 것은 ㄷ, ㄹ, ㅁ(②번)입니다."
    },
    {
      id: 5,
      q: "(주)대산은 20×1년도 재무제표 분석을 수행하고 있다. 다음 자료를 이용하여 산출한 20×1년도 '재고자산회전율'은 얼마인가? (단, 재고자산회전율은 평균재고자산을 기준으로 산정하며, 기초 및 기말재고자산은 재무상태표에 최종 보고되는 금액을 사용한다.)",
      box: "[자료]\n기초재고자산: ₩200,000\n당기 총매입액: ₩1,400,000\n장부상 기말재고자산: ₩400,000\n기말재고자산 실지재고수량에 따른 원가: ₩300,000\n기말재고자산 실지재고수량의 순실현가능가치: ₩200,000\n(단, (주)대산은 재고자산감모손실과 재고자산평가손실을 모두 매출원가에 포함하여 회계처리한다.)",
      opts: ["5.0회", "6.0회", "7.0회", "8.0회", "9.0회"],
      ans: 3,
      exp: "1. 정상 매출원가 = 기초재고(200,000) + 당기매입(1,400,000) - 장부상 기말재고(400,000) = ₩1,200,000\n2. 재고자산감모손실 = 장부원가(400,000) - 실지원가(300,000) = ₩100,000\n3. 재고자산평가손실 = 실지원가(300,000) - 순실현가능가치(200,000) = ₩100,000\n4. 감모/평가손실이 모두 매출원가에 가산되므로 총매출원가 = 1,200,000 + 100,000 + 100,000 = ₩1,400,000\n5. 재무상태표상 최종 기말재고자산 = 저가법 결과물인 순실현가능가치 ₩200,000\n6. 평균재고자산 = (기초 200,000 + 기말 200,000) / 2 = ₩200,000\n7. 재고자산회전율 = 총매출원가(1,400,000) / 평균재고(200,000) = 7.0회(③번)입니다."

      exp: "직접노무원가 능률차이 공식 = (AQ - SQ) × SP\n- 실제소요시간(AQ) = 3,800시간\n- 실제생산량에 허용된 표준시간(SQ) = 실제생산량 1,200단위 × 표준시간 3시간 = 3,600시간\n- 표준임률(SP) = ₩500\n▶ 계산: (3,800시간 - 3,600시간) × ₩500 = +100,000원. 실제 쓴 시간이 표준 가이드라인 허용치보다 더 많으므로 회사에 불리한 차이가 생성됩니다. 따라서 ₩100,000 불리(②번)입니다."
    },
    {
      id: 34,
      q: "(주)세종은 단일 제품을 생산·판매하고 있다. 제품의 단위당 판매가격은 ₩2,000이며, 단위당 변동원가는 ₩1,200이다. 연간 총고정원가는 ₩400,000이 발생한다. (주)세종에 적용되는 법인세율이 30%일 때, 세후 목표이익 ₩140,000을 달성하기 위한 제품의 판매수량은 얼마인가?",
      opts: ["500단위", "625단위", "750단위", "800단위", "875단위"],
      ans: 3,
      exp: "1. 세전으로 환산한 목표이익 = 세후 목표이익 / (1 - 법인세율) = 140,000 / (1 - 0.3) = ₩200,000\n2. 커버해야 할 목표 총 공헌이익 = 고정비(400,000) + 세전이익(200,000) = ₩600,000\n3. 제품 1단위당 벌어들이는 단위당 공헌이익 = 판매가(2,000) - 변동비(1,200) = ₩800\n4. 달성을 위한 필수 판매량 = 목표 총 공헌이익(600,000) / 단위당 공헌이익(800) = 750단위(③번)입니다."
    },
    {
      id: 35,
      q: "(주)태양은 자사 제품에 들어가는 핵심 부품을 매년 1,000단위씩 자가 제조하여 사용하고 있다. 부품 단위당 제조원가는 직접재료원가 ₩300, 직접노무원가 ₩200, 변동제조간접원가 ₩100, 고정제조간접원가 ₩150이다. 최근 외부 공급업체로부터 동일한 부품 1,000단위를 단위당 ₩650에 납품하겠다는 제의를 받았다. 외부에서 구입할 경우 기존 부품 제조에 배부되던 고정제조간접원가 중 단위당 ₩50을 회피할 수 있으며, 기존 유휴설비를 외부로 임대하여 연간 ₩80,000의 임대수익을 얻을 수 있다. 외부 구입 제의를 수락할 경우 회사 전체의 영업이익에 미치는 영향은 무엇인가?",
      opts: [
        "외부구입 시 이익 ₩50,000 증가",
        "외부구입 시 이익 ₩80,000 증가",
        "자가제조 시 이익 ₩50,000 증가",
        "자가제조 시 이익 ₩80,000 증가",
        "외부구입 시 이익 ₩100,000 증가"
      ],
      ans: 2,
      exp: "의사결정과 연계되는 증분/관련 원가를 비교합니다.\n- 자가제조 유지 시 발생하는 관련 비용(기회비용 관점 통합):\n  * 변동제조원가 절감 가능분 = (300+200+100) × 1,000단위 = ₩600,000\n  * 회피가능 고정원가 = 50 × 1,000단위 = ₩50,000\n  * 외부구입 시 얻을 수 있는 공장 임대수익 포기분(기회비용) = ₩80,000\n  * 제조 대안의 총 관련원가 = 600,000 + 50,000 + 80,000 = ₩730,000\n- 외부 구입 대안 선택 시 순수 지출액 = ₩650 × 1,000단위 = ₩650,000\n외부에서 사오면 자가제조 대안(730,000원)을 고수하는 것보다 관련 총 비용이 80,000원 감소하므로 결과적으로 기업의 영업이익은 ₩80,000 증가(②번)하게 됩니다."
    }
  ];

  let userAnswers = {};

  function renderQuiz() {
    const container = document.getElementById('quizContainer');
    container.innerHTML = quizData.map((item) => {
      let boxHtml = item.box ? `<div class="box-info">${item.box}</div>` : '';
      let optionsHtml = item.opts.map((opt, i) => `
        <button type="button" class="opt-btn" data-qid="${item.id}" data-idx="${i+1}" onclick="selectOption(${item.id}, ${i+1})">
          ${i+1}. ${opt}
        </button>
      `).join('');

      return `
        <div class="q-card" id="qCard_${item.id}">
          <div class="q-header">
            <span class="q-num">Q ${item.id}</span>
            <div class="q-text">${item.q}</div>
          </div>
          ${boxHtml}
          <div class="options-list">${optionsHtml}</div>
          <div class="feedback-box" id="fb_${item.id}">
            <div class="fb-title" id="fbTitle_${item.id}"></div>
            <div class="fb-desc">${item.exp}</div>
          </div>
        </div>
      `;
    }).join('');
  }

  function selectOption(qid, optIdx) {
    userAnswers[qid] = optIdx;
    const cardsOpts = document.querySelectorAll(`[data-qid="${qid}"]`);
    cardsOpts.forEach(btn => btn.classList.remove('selected'));
    const target = document.querySelector(`[data-qid="${qid}"][data-idx="${optIdx}"]`);
    if(target) target.classList.add('selected');
  }

  function gradeQuiz() {
    let score = 0;
    let wrongNotes = [];

    quizData.forEach((item) => {
      const uAns = userAnswers[item.id];
      const cAns = item.ans;
      const card = document.getElementById(`qCard_${item.id}`);
      const fb = document.getElementById(`fb_${item.id}`);
      const fbTitle = document.getElementById(`fbTitle_${item.id}`);
      
      card.classList.add('answered');
      fb.style.display = 'block';

      const optBtns = document.querySelectorAll(`[data-qid="${item.id}"]`);
      optBtns.forEach(btn => {
        const bIdx = parseInt(btn.getAttribute('data-idx'));
        if(bIdx === cAns) btn.classList.add('correct');
        if(uAns === bIdx && uAns !== cAns) btn.classList.add('wrong');
      });

      if(uAns === cAns) {
        score++;
        fb.classList.add('pass');
        fbTitle.className = 'fb-title pass';
        fbTitle.innerText = "✓ 정답입니다.";
      } else {
        fb.classList.remove('pass');
        fbTitle.className = 'fb-title fail';
        fbTitle.innerText = `✗ 오답 (선택: ${uAns ? uAns+'번' : '미선택'} / 정답: ${cAns}번)`;
        
        wrongNotes.push({
          questionId: item.id,
          questionText: item.q,
          selectedAnswer: uAns || null,
          correctAnswer: cAns,
          explanation: item.exp
        });
      }
    });

    document.querySelector('.score-board').innerText = `점수: ${score} / ${quizData.length} 문제`;
    window.scrollTo({ top: 0, behavior: 'smooth' });

    syncToParentGist({
      totalQuestions: quizData.length,
      correctCount: score,
      wrongCount: wrongNotes.length,
      wrongNotes: wrongNotes,
      timestamp: new Date().toISOString()
    });
  }

  function syncToParentGist(payload) {
    if (window.opener) {
      window.opener.postMessage({ type: "QUIZ_RESULT_SYNC", data: payload }, "*");
    } else if (window.parent && window.parent !== window) {
      window.parent.postMessage({ type: "QUIZ_RESULT_SYNC", data: payload }, "*");
    } else {
      console.log("부모 창 연동이 감지되지 않아 Local에서 자체 로깅 콘솔 데이터를 출력합니다.", payload);
    }
  }

  window.onload = renderQuiz;
</script>
