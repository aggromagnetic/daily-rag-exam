<!doctype html>
<html lang="ko">

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700&display=swap');
        body { font-family: 'Pretendard', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between antialiased">

    <header class="border-b border-slate-800 bg-slate-900/50 backdrop-blur sticky top-0 z-50">
        <div class="max-w-4xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <span class="bg-amber-500 text-slate-950 text-xs font-bold px-2 py-1 rounded">1차 핵심</span>
                <h1 class="text-lg font-bold tracking-tight text-amber-400">일타강사 Gem의 합격 스파르타</h1>
            </div>
            <div class="text-sm font-semibold text-slate-400 bg-slate-800 px-3 py-1 rounded-full">
                <span id="current-idx">1</span> / <span id="total-idx">30</span> 문항
            </div>
        </div>
    </header>

    <main class="max-w-4xl w-full mx-auto px-4 py-8 flex-grow flex flex-col justify-center">
        
        <div id="welcome-card" class="bg-slate-900 border border-slate-800 rounded-2xl p-8 text-center space-y-6 shadow-xl">
            <h2 class="text-2xl md:text-3xl font-extrabold text-slate-100 leading-tight">
                주택관리사보 1차 시험<br><span class="text-amber-400">엄격 교정 프리미엄 모의고사</span>
            </h2>
            <p class="text-slate-400 max-w-md mx-auto text-sm md:text-base">
                실제 출제 기준에 맞추어 오타와 오류를 완벽히 교정한 30문항입니다. 한 문제씩 고도의 집중력으로 격파해 나가십시오. 합격의 확신을 드립니다.
            </p>
            <button onclick="startQuiz()" class="w-full sm:w-auto bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold px-8 py-4 rounded-xl transition shadow-lg shadow-amber-500/10 cursor-pointer">
                실전 모의고사 시작하기
            </button>
        </div>

        <div id="quiz-card" class="hidden space-y-6">
            <div class="w-full bg-slate-800 h-2 rounded-full overflow-hidden">
                <div id="progress-bar" class="bg-amber-500 h-full transition-all duration-300" style="width: 0%"></div>
            </div>

            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 md:p-8 shadow-xl space-y-6">
                <div>
                    <span id="q-category" class="inline-block text-xs font-semibold text-amber-400 bg-amber-500/10 border border-amber-500/20 px-2.5 py-1 rounded-md mb-3">공동주택관리실무</span>
                    <h3 id="q-text" class="text-lg md:text-xl font-bold leading-relaxed whitespace-pre-line text-slate-100">
                        </h3>
                </div>

                <div id="options-container" class="space-y-3">
                    </div>

                <div id="feedback-box" class="hidden border-t border-slate-800 pt-6 space-y-4">
                    <div class="flex items-center space-x-3">
                        <span id="result-badge" class="font-bold px-3 py-1 rounded-lg text-sm">CORRECT</span>
                        <span id="correct-answer-display" class="text-sm text-slate-400"></span>
                    </div>
                    <blockquote class="bg-slate-950 border-l-4 border-slate-700 p-4 rounded-r-xl">
                        <p id="explanation-text" class="text-sm md:text-base text-slate-300 leading-relaxed whitespace-pre-line"></p>
                    </blockquote>
                    <button onclick="nextQuestion()" id="next-btn" class="w-full bg-slate-800 hover:bg-slate-700 text-slate-200 font-semibold py-3.5 rounded-xl transition cursor-pointer">
                        다음 문항 격파하기 &rarr;
                    </button>
                </div>
            </div>
        </div>

        <div id="result-card" class="hidden space-y-8">
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-8 text-center space-y-4 shadow-xl">
                <h2 class="text-3xl font-extrabold text-amber-400">시험 종료 및 성적 요약</h2>
                <div class="py-6">
                    <span class="text-6xl font-black text-slate-100" id="final-score">0</span>
                    <span class="text-xl text-slate-400">/ 100 점</span>
                </div>
                <p id="result-comment" class="text-slate-300 max-w-md mx-auto text-sm md:text-base font-medium"></p>
            </div>

            <div class="space-y-4">
                <h3 class="text-xl font-bold text-slate-200 flex items-center space-x-2">
                    <span>📌 고효율 압축 오답노트</span>
                </h3>
                <div id="wrong-notes-container" class="space-y-4">
                    </div>
            </div>
        </div>

    </main>

    <footer class="border-t border-slate-900 bg-slate-950 py-4 text-center text-xs text-slate-600">
        &copy; 2026 주택관리사보 1차 완벽 합격 프로세스. All Rights Reserved.
    </footer>

                    "비상정지장치는 전동기의 토크 손실 시 엘리베이터 카를 정지시킨다.",
                    "비상용승강기의 승강장 바닥면적은 옥외에 승강장을 설치하는 경우를 제외하고 비상용승강기 1대에 대하여 6㎡ 이상으로 한다.",
                    "주접촉기는 정전, 저전압, 고장 등이 발생될 경우 승강기의 주회로를 차단하는 장치이다.",
                    "세이프티 슈는 카의 출입문이 닫힐 때 인체나 물건이 출입문에 끼이거나 부딪히는 경우 출입문을 다시 개방하는 장치로 보통 카 출입문의 양단에 설치한다."
                ],
                answer: 2,
                explanation: "② 메커니즘 정밀 판정: 카가 하강 중 로프가 끊어지거나 제어 불능으로 규정 속도의 1.3~1.4배 이상 폭주할 때, 조속기(Governor) 와이어가 작동하며 가이드레일을 기계적 쐐기로 꽉 잡아 물리적으로 세우는 장치가 '비상정지장치(Safety Gear)'입니다. \n모터의 전원 공급 중단이나 단순 '토크 손실' 상황 시 즉각 구동축을 기계적으로 압착 결하는 장치는 **전자브레이크(M.G. Brake)**이므로 개념 매칭 오류입니다.",
                keyword: "비상정지장치와 전자브레이크의 차이"
            }
        ];

        let currentIdx = 0;
        let score = 0;
        let userAnswers = [];

        function startQuiz() {
            document.getElementById('welcome-card').classList.add('hidden');
            document.getElementById('quiz-card').classList.remove('hidden');
            renderQuestion();
        }

        function renderQuestion() {
            const q = questions[currentIdx];
            document.getElementById('current-idx').innerText = currentIdx + 1;
            document.getElementById('total-idx').innerText = questions.length;
            document.getElementById('q-category').innerText = q.category;
            document.getElementById('q-text').innerText = `${q.id}. ${q.question}`;
            
            // Progress Bar Updating
            const pct = ((currentIdx) / questions.length) * 100;
            document.getElementById('progress-bar').style.width = `${pct}%`;

            // Reset Options Container
            const container = document.getElementById('options-container');
            container.innerHTML = '';
            
            // Hide Feedback Area
            document.getElementById('feedback-box').classList.add('hidden');

            q.options.forEach((opt, index) => {
                const optNum = index + 1;
                const btn = document.createElement('button');
                btn.className = "w-full text-left bg-slate-900 hover:bg-slate-800 border border-slate-800 px-5 py-4 rounded-xl flex items-start space-x-3 transition cursor-pointer text-slate-300 hover:text-slate-100 group";
                btn.onclick = () => selectOption(optNum);
                btn.disabled = userAnswers[currentIdx] !== undefined;

                const numSpan = document.createElement('span');
                numSpan.className = "flex-shrink-0 bg-slate-800 text-slate-400 group-hover:bg-amber-500 group-hover:text-slate-950 rounded-full w-6 h-6 flex items-center justify-center text-xs font-bold transition";
                numSpan.innerText = optNum;

                const textSpan = document.createElement('span');
                textSpan.className = "text-sm md:text-base font-medium leading-relaxed";
                textSpan.innerText = opt;

                btn.appendChild(numSpan);
                btn.appendChild(textSpan);
                container.appendChild(btn);
            });
        }

        function selectOption(chosen) {
            const q = questions[currentIdx];
            userAnswers[currentIdx] = chosen;

            const container = document.getElementById('options-container');
            const buttons = container.getElementsByTagName('button');

            // Disable all buttons and dye colors
            for (let i = 0; i < buttons.length; i++) {
                buttons[i].disabled = true;
                const currentOptNum = i + 1;
                
                if (currentOptNum === q.answer) {
                    // Correct Option Highlighting
                    buttons[i].className = "w-full text-left bg-emerald-950/40 border border-emerald-500 rounded-xl flex items-start space-x-3 px-5 py-4 text-emerald-300";
                    buttons[i].getElementsByTagName('span')[0].className = "flex-shrink-0 bg-emerald-500 text-slate-950 rounded-full w-6 h-6 flex items-center justify-center text-xs font-bold";
                } else if (currentOptNum === chosen) {
                    // Wrong Choice Highlighting
                    buttons[i].className = "w-full text-left bg-rose-950/40 border border-rose-500 rounded-xl flex items-start space-x-3 px-5 py-4 text-rose-300";
                    buttons[i].getElementsByTagName('span')[0].className = "flex-shrink-0 bg-rose-500 text-slate-950 rounded-full w-6 h-6 flex items-center justify-center text-xs font-bold";
                } else {
                    buttons[i].className = "w-full text-left bg-slate-900 border border-slate-900 opacity-40 rounded-xl flex items-start space-x-3 px-5 py-4 text-slate-500";
                }
            }

            // Set Badges
            const isCorrect = chosen === q.answer;
            if (isCorrect) {
                score++;
                document.getElementById('result-badge').className = "font-bold px-3 py-1 rounded-lg text-xs bg-emerald-500/20 border border-emerald-500/30 text-emerald-400";
                document.getElementById('result-badge').innerText = "정답 확인";
            } else {
                document.getElementById('result-badge').className = "font-bold px-3 py-1 rounded-lg text-xs bg-rose-500/20 border border-rose-500/30 text-rose-400";
                document.getElementById('result-badge').innerText = "오답 감지";
            }

            document.getElementById('correct-answer-display').innerText = `출제정답: ${q.answer}번`;
            document.getElementById('explanation-text').innerText = q.explanation;
            document.getElementById('feedback-box').classList.remove('hidden');
        }

        function nextQuestion() {
            currentIdx++;
            if (currentIdx < questions.length) {
                renderQuestion();
            } else {
                showResults();
            }
        }

        function showResults() {
            document.getElementById('quiz-card').classList.add('hidden');
            document.getElementById('result-card').classList.remove('hidden');

            const finalPct = Math.round((score / questions.length) * 100);
            document.getElementById('final-score').innerText = finalPct;

            let comment = "";
            if (finalPct >= 80) comment = "👑 대단합니다! 이미 주택관리사보 1차 합격권 완성 단계입니다. 일타강사 Gem이 보장하는 마스터 스펙입니다.";
            else if (finalPct >= 60) comment = "🎉 안정적인 과락 통과 및 합격 평균 달성선입니다! 틀린 핵심 키워드를 오답노트에서 재검토 하십시오.";
            else comment = "🔥 아직 좌절할 단계가 아닙니다. 아래 생성된 핵심 오답 압축 요약본을 토대로 복습하여 보완하십시오.";

            document.getElementById('result-comment').innerText = comment;

            // Generate Wrong Notes Summary
            const wrongNotesContainer = document.getElementById('wrong-notes-container');
            wrongNotesContainer.innerHTML = '';

            let gistData = [];

            questions.forEach((q, idx) => {
                const uAns = userAnswers[idx];
                const isWrong = uAns !== q.answer;
                
                // Add to Gist Data Payload anyway for Parent Process Syncing
                gistData.push({
                    qNum: q.id,
                    correct: !isWrong,
                    userChoice: uAns || null,
                    actualAnswer: q.answer,
                    keyword: q.keyword
                });

                if (isWrong) {
                    const card = document.createElement('div');
                    card.className = "bg-slate-900 border border-slate-800 rounded-xl p-5 space-y-2";
                    card.innerHTML = `
                        <div class="flex justify-between items-center text-xs text-slate-400">
                            <span class="font-bold text-amber-500">[문항 ${q.id}] ${q.category}</span>
                            <span>선택: ${uAns ? uAns+'번' : '미선택'} | 정답: <strong class="text-emerald-400">${q.answer}번</strong></span>
                        </div>
                        <p class="text-sm font-semibold text-slate-200">${q.question.split('\n')[0]}</p>
                        <div class="text-xs bg-slate-950 p-3 rounded-lg text-slate-300 leading-relaxed border-l-2 border-amber-500">
                            <strong>강사 코칭 요약:</strong> ${q.explanation.split('\n')[0]} <br>
                            <span class="inline-block mt-1 text-amber-400 font-bold">핵심 키워드: ${q.keyword}</span>
                        </div>
                    `;
                    wrongNotesContainer.appendChild(card);
                }
            });

            if(score === questions.length) {
                wrongNotesContainer.innerHTML = '<p class="text-center text-emerald-400 text-sm py-4">모든 지문을 격파하셨습니다! 오답노트가 깔끔하게 비어있습니다. 만점입니다!</p>';
            }

            // Execute Required Parent Gist Syncing Logic
            syncToParentGist(gistData);
        }

        function syncToParentGist(payload) {
            console.log("Syncing Data to Parent Frame...", payload);
            if (window.parent && window.parent !== window) {
                window.parent.postMessage({
                    type: "QUIZ_RESULT_SYNC",
                    score: score,
                    totalQuestions: questions.length,
                    data: payload
                }, "*");
            }
        }
    </script>
</body>
</html>
