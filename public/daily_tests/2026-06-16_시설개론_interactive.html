    const resTotal = document.getElementById("res-total");
    const resCorrect = document.getElementById("res-correct");
    const resScore = document.getElementById("res-score");
    const wrongAnswersContainer = document.getElementById("wrong-answers-container");
    const wrongCountBadge = document.getElementById("wrong-count-badge");

    // Parent Gist Sync Integration
    function syncToParentGist(payload) {
      if (window.parent && window.parent.postMessage) {
        window.parent.postMessage({
          type: "QUIZ_RESULT_SYNC",
          data: payload
        }, "*");
      }
    }

    function renderQuestion() {
      feedbackBox.classList.add("hidden");
      const currentItem = dataset[currentIndex];
      
      // Update Progress UI
      progressText.innerText = `${currentIndex + 1} / ${dataset.length}`;
      progressBar.style.width = `${((currentIndex + 1) / dataset.length) * 100}%`;
      
      // Render Question Contents
      questionTag.innerText = currentItem.tag;
      questionText.innerText = currentItem.q;
      
      // Clear & Render Options
      optionsContainer.innerHTML = "";
      currentItem.options.forEach((opt, idx) => {
        const btn = document.createElement("button");
        btn.className = "cursor-pointer w-full text-left bg-slate-800/60 hover:bg-slate-800 text-slate-200 border border-slate-800 hover:border-slate-700 rounded-xl p-4 text-xs md:text-sm font-medium transition duration-150 flex items-start space-x-3 focus:outline-none focus:ring-2 focus:ring-teal-500/50";
        btn.innerHTML = `<span class="flex-shrink-0 inline-flex items-center justify-center w-5 h-5 rounded-full bg-slate-900 border border-slate-700 text-[11px] font-bold text-slate-400 group-hover:text-slate-200">${idx + 1}</span><span class="leading-relaxed">${opt.substring(2)}</span>`;
        btn.onclick = () => handleSelection(idx);
        optionsContainer.appendChild(btn);
      });
    }

    function handleSelection(selectedIndex) {
      const currentItem = dataset[currentIndex];
      userAnswers.push(selectedIndex);
      
      // Disable options interaction
      Array.from(optionsContainer.children).forEach((child) => {
        child.removeAttribute("onclick");
        child.style.pointerEvents = "none";
      });

      const isCorrect = (selectedIndex === currentItem.answer);
      if (isCorrect) score++;

      // Visual feedback on options
      const items = optionsContainer.children;
      items[currentItem.answer].className = "w-full text-left bg-emerald-950/40 text-emerald-300 border border-emerald-500/40 rounded-xl p-4 text-xs md:text-sm font-semibold flex items-start space-x-3";
      items[currentItem.answer].firstChild.className = "flex-shrink-0 inline-flex items-center justify-center w-5 h-5 rounded-full bg-emerald-500 text-slate-950 text-[11px] font-black";
      items[currentItem.answer].firstChild.innerText = "✓";

      if (!isCorrect) {
        items[selectedIndex].className = "w-full text-left bg-rose-950/40 text-rose-300 border border-rose-500/40 rounded-xl p-4 text-xs md:text-sm font-semibold flex items-start space-x-3";
        items[selectedIndex].firstChild.className = "flex-shrink-0 inline-flex items-center justify-center w-5 h-5 rounded-full bg-rose-500 text-slate-950 text-[11px] font-black";
        items[selectedIndex].firstChild.innerText = "✕";
      }

      // Display Explanation Box
      feedbackTitle.innerHTML = isCorrect 
        ? `<span class="text-emerald-400">✨ 정답입니다! 아주 훌륭합니다.</span>` 
        : `<span class="text-rose-400">🚨 아쉽지만 오답입니다. 핵심 정비 필수!</span>`;
      
      feedbackBox.className = isCorrect 
        ? "border border-emerald-900/50 bg-emerald-950/20 rounded-xl p-4 transition-all duration-300 animate-fade-in"
        : "border border-rose-900/50 bg-rose-950/20 rounded-xl p-4 transition-all duration-300 animate-fade-in";
      
      feedbackExplanation.innerText = currentItem.explanation;
    }

    nextBtn.onclick = () => {
      currentIndex++;
      if (currentIndex < dataset.length) {
        renderQuestion();
      } else {
        showResults();
      }
    };

    function showResults() {
      quizScreen.classList.add("hidden");
      resultScreen.classList.remove("hidden");

      const totalQuestions = dataset.length;
      const finalScore = Math.round((score / totalQuestions) * 100);

      resTotal.innerText = totalQuestions;
      resCorrect.innerText = score;
      resScore.innerText = `${finalScore}점`;

      let wrongCount = 0;
      wrongAnswersContainer.innerHTML = "";

      const wrongItemsData = [];

      dataset.forEach((item, idx) => {
        const userSel = userAnswers[idx];
        if (userSel !== item.answer) {
          wrongCount++;
          wrongItemsData.push({
            no: item.id,
            tag: item.tag,
            picked: userSel + 1,
            correct: item.answer + 1
          });

          const wrongCard = document.createElement("div");
          wrongCard.className = "bg-slate-950/40 border border-slate-800 p-4 rounded-xl space-y-2";
          wrongCard.innerHTML = `
            <div class="flex items-center justify-between">
              <span class="text-xs font-bold text-slate-400">[문항 ${item.id}] ${item.tag}</span>
              <span class="text-[11px] font-medium px-2 py-0.5 rounded bg-rose-950 text-rose-400 border border-rose-900">오답</span>
            </div>
            <p class="text-xs font-bold text-slate-200 line-clamp-1">${item.q}</p>
            <div class="grid grid-cols-2 gap-2 text-[11px] pt-1 border-t border-slate-900">
              <div class="text-slate-400">선택한 답: <span class="text-rose-400 font-bold">${userSel + 1}번</span></div>
              <div class="text-slate-400">정확한 정답: <span class="text-emerald-400 font-bold">${item.answer + 1}번</span></div>
            </div>
          `;
          wrongAnswersContainer.appendChild(wrongCard);
        }
      });

      wrongCountBadge.innerText = `${wrongCount}개`;
      if (wrongCount === 0) {
        wrongAnswersContainer.innerHTML = `<p class="text-center text-xs text-slate-500 py-6">틀린 문제가 전혀 없습니다! 퍼펙트 합격권 달성 🎉</p>`;
      }

      // Sync data package back to ecosystem via parent proxy
      syncToParentGist({
        score: finalScore,
        correctCount: score,
        totalCount: totalQuestions,
        wrongList: wrongItemsData
      });
    }

    // Initialize WebApp
    renderQuestion();
  </script>
</body>
</html>
