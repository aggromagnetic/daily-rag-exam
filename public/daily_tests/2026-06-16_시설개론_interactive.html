          "비상용승강기의 승강장 바닥면적은 옥외에 승강장을 설치하는 경우를 제외하고 비상용승강기 1대에 대하여 6㎡ 이상으로 한다.",
          "주접촉기는 정전, 저전압, 고장 등이 발생될 경우 승강기의 주회로를 차단하는 장치이다.",
          "세이프티 슈는 카의 출입문이 닫힐 때 인체나 물건이 출입문에 끼이거나 부딪히는 경우 출입문을 다시 개방하는 장치로 보통 카 출입문의 양단에 설치한다."
        ],
        answer: 2,
        explanation: "② 승강기 안전장치 중 '비상정지장치(Safety Gear)'는 와이어로프가 단선되거나 조속기(Governor) 유동 기계장치에 의해 설정된 과속도 한계치를 돌파했을 때 레일을 쐐기식으로 꽉 움켜쥐어 기계적으로 제동하는 핵심 기계식 구동 장치입니다. 전동기 토크 손실(동력 차단) 시 스프링 힘으로 회전축을 잡는 장치는 승강기 본체의 기계실 전동기 제동기(전자 브레이크)입니다.",
        keyword: "비상정지장치와 전자브레이크 매커니즘"
      }
    ];

    let currentIndex = 0;
    let userAnswers = new Array(quizData.length).fill(null);
    let wrongNotes = [];

    // DOM 요소 캐싱
    const qText = document.getElementById("question-text");
    const optContainer = document.getElementById("options-container");
    const idxDisplay = document.getElementById("current-index");
    const totalDisplay = document.getElementById("total-questions");
    const progBar = document.getElementById("progress-bar");
    
    const feedbackPanel = document.getElementById("feedback-panel");
    const feedbackIcon = document.getElementById("feedback-icon");
    const feedbackTitle = document.getElementById("feedback-title");
    const feedbackExpl = document.getElementById("feedback-explanation");
    const nextBtn = document.getElementById("next-btn");

    const quizView = document.getElementById("quiz-view");
    const resultView = document.getElementById("result-view");
    const scoreDisplay = document.getElementById("score-display");
    const correctCountDisplay = document.getElementById("correct-count");
    const wrongCountDisplay = document.getElementById("wrong-count");
    const wrongNotesContainer = document.getElementById("wrong-notes-container");
    
    const btnSyncGist = document.getElementById("btn-sync-gist");
    const btnRestart = document.getElementById("btn-restart");

    totalDisplay.textContent = quizData.length;

    // 초기화 및 렌더링
    function renderQuestion() {
      if (currentIndex >= quizData.length) {
        showResults();
        return;
      }

      // 화면 초기화
      feedbackPanel.classList.add("hidden");
      optContainer.innerHTML = "";
      
      idxDisplay.textContent = currentIndex + 1;
      progBar.style.width = `${(currentIndex / quizData.length) * 100}%`;

      const currentQuiz = quizData[currentIndex];
      qText.textContent = `${currentQuiz.id}. ${currentQuiz.question}`;

      // 보기 생성
      currentQuiz.options.forEach((opt, index) => {
        const btn = document.createElement("button");
        btn.className = "w-full text-left px-5 py-4 bg-gray-800 hover:bg-gray-750 text-gray-200 font-medium rounded-xl border border-gray-750 transition duration-200 flex items-center gap-4 cursor-pointer focus:outline-none focus:border-teal-500/50 group";
        
        const numCircle = document.createElement("span");
        numCircle.className = "w-6 h-6 shrink-0 rounded-full bg-gray-700 text-gray-400 flex items-center justify-center text-xs font-bold group-hover:bg-teal-500/20 group-hover:text-teal-300 transition";
        numCircle.textContent = index + 1;

        const labelText = document.createElement("span");
        labelText.className = "leading-relaxed text-sm md:text-base";
        labelText.textContent = opt;

        btn.appendChild(numCircle);
        btn.appendChild(labelText);
        
        btn.addEventListener("click", () => handleAnswer(index + 1));
        optContainer.appendChild(btn);
      });
    }

    // 답안 선택 핸들러
    function handleAnswer(selected) {
      // 이미 답을 고른 경우 터치 무효화
      if (!feedbackPanel.classList.contains("hidden")) return;

      const currentQuiz = quizData[currentIndex];
      userAnswers[currentIndex] = selected;
      
      const isCorrect = (selected === currentQuiz.answer);
      
      // 보기 UI 고정 및 비활성화 처리
      Array.from(optContainer.children).forEach((child, idx) => {
        const itemIdx = idx + 1;
        child.classList.remove("hover:bg-gray-750", "cursor-pointer");
        if (itemIdx === currentQuiz.answer) {
          child.className += " border-emerald-500/50 bg-emerald-950/20 text-emerald-300";
          child.querySelector("span").className = "w-6 h-6 shrink-0 rounded-full bg-emerald-500 text-white flex items-center justify-center text-xs font-bold";
        } else if (itemIdx === selected && !isCorrect) {
          child.className += " border-rose-500/50 bg-rose-950/20 text-rose-300";
          child.querySelector("span").className = "w-6 h-6 shrink-0 rounded-full bg-rose-500 text-white flex items-center justify-center text-xs font-bold";
        } else {
          child.className += " opacity-40";
        }
      });

      // 피드백 패널 노출
      feedbackPanel.classList.remove("hidden");
      if (isCorrect) {
        feedbackPanel.className = "rounded-2xl p-6 border border-emerald-500/30 bg-emerald-950/10 animate-slide-up";
        feedbackIcon.className = "p-2 rounded-xl bg-emerald-500 text-white shrink-0 mt-0.5";
        feedbackIcon.innerHTML = `<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"/></svg>`;
        feedbackTitle.className = "text-base font-bold text-emerald-400 mb-1";
        feedbackTitle.textContent = "정답입니다! 완벽한 개념 정립입니다.";
      } else {
        feedbackPanel.className = "rounded-2xl p-6 border border-rose-500/30 bg-rose-950/10 animate-slide-up";
        feedbackIcon.className = "p-2 rounded-xl bg-rose-500 text-white shrink-0 mt-0.5";
        feedbackIcon.innerHTML = `<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M6 18L18 6M6 6l12 12"/></svg>`;
        feedbackTitle.className = "text-base font-bold text-rose-400 mb-1";
        feedbackTitle.textContent = `오답입니다. (선택: ${selected}번 / 정답: ${currentQuiz.answer}번)`;
        
        // 오답 리스트 기록 가공저장
        wrongNotes.push({
          id: currentQuiz.id,
          question: currentQuiz.question,
          correctAnswer: currentQuiz.answer,
          userAnswer: selected,
          explanation: currentQuiz.explanation,
          keyword: currentQuiz.keyword
        });
      }

      feedbackExpl.innerHTML = currentQuiz.explanation.replace(/\n/g, "<br>");
    }

    // 다음 문항 이동
    nextBtn.addEventListener("click", () => {
      currentIndex++;
      renderQuestion();
    });

    // 최종 스코어 및 분석 리포트 화면 노출
    function showResults() {
      quizView.classList.add("hidden");
      resultView.classList.remove("hidden");
      progBar.style.width = "100%";

      let correctCount = 0;
      quizData.forEach((q, i) => {
        if (userAnswers[i] === q.answer) correctCount++;
      });

      // 100점 만점 환산 스코어 계산
      const finalScore = Math.round((correctCount / quizData.length) * 100);
      scoreDisplay.textContent = finalScore;
      correctCountDisplay.textContent = `${correctCount}개`;
      wrongCountDisplay.textContent = `${quizData.length - correctCount}개`;

      // 오답노트 동적 주입 및 렌더링
      wrongNotesContainer.innerHTML = "";
      if (wrongNotes.length === 0) {
        wrongNotesContainer.innerHTML = `
          <div class="bg-gray-800 rounded-2xl p-6 text-center border border-gray-750 text-gray-400">
            🎉 틀린 문제가 단 하나도 없습니다! 완벽하게 마스터하셨습니다. 시험 합격을 확신합니다!
          </div>
        `;
      } else {
        wrongNotes.forEach(note => {
          const card = document.createElement("div");
          card.className = "bg-gray-800 rounded-2xl p-5 border border-gray-750 space-y-3 shadow-md";
          card.innerHTML = `
            <div class="flex items-center justify-between flex-wrap gap-2">
              <span class="text-sm font-black text-rose-400">문항 ${note.id}</span>
              <span class="px-2.5 py-0.5 rounded-full text-xs font-bold bg-teal-500/10 text-teal-300 border border-teal-500/20">핵심키워드: ${note.keyword}</span>
            </div>
            <h4 class="text-white font-bold text-sm md:text-base whitespace-pre-line leading-relaxed">${note.question}</h4>
            <div class="grid grid-cols-2 gap-2 text-xs font-semibold bg-gray-950/40 p-2.5 rounded-xl border border-gray-900">
              <div class="text-rose-400">나의 선택지: <span class="font-extrabold">${note.userAnswer}번</span></div>
              <div class="text-emerald-400">실제 정답: <span class="font-extrabold">${note.correctAnswer}번</span></div>
            </div>
            <div class="bg-gray-900/50 p-4 rounded-xl border border-gray-750 text-xs md:text-sm leading-relaxed text-gray-300 whitespace-pre-line">
              <strong class="text-teal-400 block mb-1">일타강사 해설 포인트:</strong>
              ${note.explanation}
            </div>
          `;
          wrongNotesContainer.appendChild(card);
        });
      }
    }

    // 외부 연동 및 동기화 요구사항 처리 (syncToParentGist & postMessage 구현)
    function syncToParentGist() {
      const payload = {
        type: "QUIZ_RESULT_SYNC",
        timestamp: new Date().toISOString(),
        score: Math.round(( (quizData.length - wrongNotes.length) / quizData.length ) * 100),
        totalQuestions: quizData.length,
        wrongCount: wrongNotes.length,
        wrongNotes: wrongNotes
      };

      // 부모 창 및 오픈 윈도우 채널로 데이터 탑재 전송
      if (window.opener) {
        window.opener.postMessage(payload, "*");
      }
      if (window.parent && window.parent !== window) {
        window.parent.postMessage(payload, "*");
      }
      
      alert("오답 수첩 데이터가 부모 시스템 채널로 완벽하게 전송(동기화)되었습니다!");
    }

    btnSyncGist.addEventListener("click", syncToParentGist);

    // 재시작 루틴
    btnRestart.addEventListener("click", () => {
      currentIndex = 0;
      userAnswers = new Array(quizData.length).fill(null);
      wrongNotes = [];
      resultView.classList.add("hidden");
      quizView.classList.remove("hidden");
      renderQuestion();
    });

    // 어플리케이션 첫 로드 실행
    renderQuestion();
  </script>
</body>
</html>
