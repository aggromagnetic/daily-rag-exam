<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">

  <title>주택관리사보 1차 퀴즈 프리미엄 시스템</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>

    .custom-scrollbar::-webkit-scrollbar { width: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: #1f2937; }

<body class="bg-gray-950 text-gray-100 min-h-screen flex flex-col justify-between selection:bg-teal-500 selection:text-white">

  <header class="border-b border-gray-800 bg-gray-900/50 backdrop-blur sticky top-0 z-50">
    <div class="max-w-4xl mx-auto px-4 py-4 flex justify-between items-center">
      <div class="flex items-center space-x-3">
        <span class="bg-gradient-to-r from-teal-400 to-emerald-400 text-gray-950 font-bold px-2.5 py-1 rounded text-xs tracking-wider">일타강사 GEM</span>
        <h1 class="text-lg font-bold tracking-tight text-gray-200">주택관리사보 1차 핵심 타겟 퀴즈</h1>
      </div>
      <div id="progress-text" class="text-sm font-semibold text-teal-400 tracking-wider">01 / 35</div>
    </div>
    <div class="w-full bg-gray-800 h-1">
      <div id="progress-bar" class="bg-gradient-to-r from-teal-400 to-emerald-400 h-1 transition-all duration-300" style="width: 0%"></div>
    </div>
  </header>

  <main class="max-w-4xl w-full mx-auto px-4 py-8 flex-grow flex flex-col justify-center">
    
    <div id="quiz-screen" class="space-y-6">
      <div class="bg-gray-900 border border-gray-800 rounded-2xl p-6 md:p-8 shadow-xl transition-all">
        <div class="inline-flex items-center space-x-2 text-xs font-semibold text-gray-400 uppercase tracking-wider mb-4">
          <span class="w-2 h-2 rounded-full bg-teal-400 animate-pulse"></span>
          <span>회계원리 및 실무 마스터</span>
        </div>
        
        <div id="question-text" class="text-base md:text-lg font-medium leading-relaxed text-gray-100 whitespace-pre-wrap mb-6">
          </div>

        <div id="options-container" class="space-y-3">
          </div>
      </div>

      <div id="feedback-box" class="hidden rounded-xl p-5 border transition-all duration-300">
        <div class="flex items-start space-x-3">
          <div id="feedback-icon" class="font-bold text-xl"></div>
          <div class="flex-1">
            <h4 id="feedback-title" class="font-bold text-base mb-1"></h4>
            <div id="explanation-content" class="text-sm text-gray-300 leading-relaxed whitespace-pre-wrap mt-2 pt-2 border-t border-gray-800"></div>
          </div>
        </div>
        <div class="mt-4 flex justify-end">
          <button id="next-btn" class="bg-gray-100 hover:bg-white text-gray-950 font-bold px-6 py-2.5 rounded-xl text-sm transition-all shadow-md active:scale-95">
            다음 문제 넘어가기 →
          </button>
        </div>
      </div>
    </div>

    <div id="result-screen" class="hidden space-y-8 animate-fade-in">
      <div class="bg-gray-900 border border-gray-800 rounded-2xl p-6 md:p-8 shadow-xl text-center">
        <h2 class="text-2xl font-bold tracking-tight text-gray-100 mb-2">실전 시뮬레이션 종료</h2>
        <p class="text-gray-400 text-sm mb-6">수험생님의 합격을 확신합니다. 최종 스코어를 확인하세요.</p>
        
        <div class="inline-flex items-center justify-center w-36 h-36 rounded-full bg-gray-800/50 border-4 border-teal-500 shadow-inner mb-6">
          <div>
            <span id="final-score" class="text-4xl font-extrabold text-white">0</span>
            <span class="text-gray-400 text-sm block mt-1">/ 100점 만점</span>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-4 max-w-sm mx-auto text-sm">
          <div class="bg-gray-800/40 p-3 rounded-xl border border-gray-800">
            <span class="text-gray-400 block mb-1">정답 문항수</span>
            <span id="correct-count" class="text-lg font-bold text-emerald-400">0개</span>
          </div>
          <div class="bg-gray-800/40 p-3 rounded-xl border border-gray-800">
            <span class="text-gray-400 block mb-1">오답 문항수</span>
            <span id="wrong-count" class="text-lg font-bold text-rose-400">0개</span>
          </div>
        </div>
      </div>

      <div class="space-y-4">
        <div class="flex justify-between items-center">
          <h3 class="text-lg font-bold text-gray-200 flex items-center space-x-2">
            <span class="w-3 h-3 bg-rose-500 rounded-sm"></span>
            <span>GEM 오답 정리 및 취약 키워드 수첩</span>
          </h3>
          <span class="text-xs text-gray-500">※ 부모 대시보드 자동 동기화 적용</span>
        </div>
        <div id="wrong-notes-container" class="space-y-4 max-h-[500px] overflow-y-auto custom-scrollbar pr-2">
          </div>
      </div>

      <div class="text-center pt-4">
        <button onclick="window.location.reload();" class="border border-gray-700 bg-gray-900 hover:bg-gray-800 px-6 py-3 rounded-xl font-semibold text-sm transition active:scale-95 text-gray-300">
          처음부터 다시 도전하기
        </button>
      </div>
    </div>

  </main>

  <footer class="border-t border-gray-900 bg-gray-950 py-4 text-center text-xs text-gray-600">
    &copy; 2026 주택관리사보 1차 최단기 합격 패스포트. All Rights Reserved.
  </footer>

  <script>

        question: "A아파트는 1인당 ₩50,000의 변동원가와 ₩8,000,000의 총고정원가가 소요되는 주부 교육프로그램을 계획하고 있다. 1인당 참가비는 ₩100,000을 받는다. 이 프로그램을 실시하면, 구청으로부터 총 ₩2,000,000의 지원금을 받는다. 이 프로그램의 손익분기점(인원수)은?",
        options: ["100명", "110명", "115명", "120명", "150명"],
        answer: 4,
        keyword: "CVP 분석 (보조금이 포함된 BEP)",
        explanation: "1) 단위당 공헌이익 = 참가비(100,000) - 변동비(50,000) = ₩50,000\n2) 보전해야 할 순 고정비 부담액 = 총고정원가(8,000,000) - 외부 구청지원금(2,000,000) = ₩6,000,000\n3) 손익분기점 최소인원 = 순고정비(6,000,000) / 단위당 공헌이익(50,000) = 120명"
      },
      {
        id: 34,
        question: "A아파트 전기작업반의 월별 직접노무시간과 경비에 대한 기록이 다음과 같다.\n\n[구분 / 4월 / 5월 / 6월]\n· 직접노무시간 / 250시간 / 200시간 / 150시간\n· 경비 / ₩10,000 / ₩11,000 / ₩7,000\n\n7월의 직접노무시간은 200시간으로 예상된다. 고저점법을 적용하여 7월의 경비를 추정하면?",
        options: ["₩8,500", "₩8,600", "₩8,700", "₩8,800", "₩8,900"],
        answer: 1,
        keyword: "고저점법 원가함수 추정",
        explanation: "※ 주의: 고저점법 선택 시 기준 축은 무조건 '조업도(노무시간)' 기준 최고와 최저를 잡아야 함.\n- 최고조업도점: 4월 (250시간, ₩10,000)\n- 최저조업도점: 6월 (150시간, ₩7,000)\n1) 단위당 변동비 = (10,000 - 7,000) / (250 - 150) = 3,000 / 100 = ₩30/시간\n2) 총고정비 = 10,000 - (250 × 30) = ₩2,500\n3) 7월 원가예측 (200시간) = (200 × 30) + 2,500 = ₩8,500"
      },
      {
        id: 35,
        question: "(주)한국은 당기에 손톱깎이 세트 1,000단위를 생산, 판매하는 계획을 수립하였으며, 연간 최대 조업능력은 1,200단위이다. 손톱깎이 세트의 단위당 판매가격은 ₩1,000이다. 단위당 변동원가는 ₩400이며, 총고정원가는 ₩110,000이다. 한편, (주)한국은 당기에 해외 바이어로부터 100단위를 단위당 ₩600에 구매하겠다는 특별주문을 받았으며, 이 주문을 수락하기 위해서는 단위당 ₩150의 운송원가가 추가로 발생한다. 특별주문의 수락이 (주)한국의 당기이익에 미치는 영향은?",
        options: ["₩5,000 증가", "₩5,000 감소", "₩10,000 증가", "₩10,000 감소", "₩15,000 증가"],
        answer: 1,
        keyword: "단기 의사결정 (특별주문 수락여부)",
        explanation: "현재 유휴조업능력이 200단위(1,200 - 1,000) 확보되어 있으므로 특별주문 100단위 수락 시 기존 정상 판매분을 포기할 필요가 없어 기회비용은 발생하지 않습니다.\n- 증분 수익 = 100단위 × ₩600 = +₩60,000\n- 증분 비용 = 100단위 × (제조변동비 400 + 특별운송비 150) = -₩55,000\n- 순손익 영향 = 60,000 - 55,000 = ₩5,000 이익 증가"
      }
    ];

    let currentIndex = 0;
    let score = 0;
    let correctCount = 0;
    let wrongCount = 0;
    const userAnswers = [];

    // UI 요소 포인터
    const quizScreen = document.getElementById('quiz-screen');
    const resultScreen = document.getElementById('result-screen');
    const progressText = document.getElementById('progress-text');
    const progressBar = document.getElementById('progress-bar');
    const questionText = document.getElementById('question-text');
    const optionsContainer = document.getElementById('options-container');
    const feedbackBox = document.getElementById('feedback-box');
    const feedbackIcon = document.getElementById('feedback-icon');
    const feedbackTitle = document.getElementById('feedback-title');
    const explanationContent = document.getElementById('explanation-content');
    const nextBtn = document.getElementById('next-btn');
    const finalScoreEl = document.getElementById('final-score');
    const correctCountEl = document.getElementById('correct-count');
    const wrongCountEl = document.getElementById('wrong-count');
    const wrongNotesContainer = document.getElementById('wrong-notes-container');

    // 초기화 기동
    function initQuiz() {
      currentIndex = 0;
      score = 0;
      correctCount = 0;
      wrongCount = 0;
      userAnswers.length = 0;
      renderQuestion();
    }

    // 문제 렌더링 뷰 변환
    function renderQuestion() {
      feedbackBox.classList.add('hidden');
      const currentQuiz = quizDatabase[currentIndex];
      
      // 상태 바 업데이트
      const total = quizDatabase.length;
      progressText.innerText = `${String(currentIndex + 1).padStart(2, '0')} / ${String(total).padStart(2, '0')}`;
      progressBar.style.width = `${((currentIndex) / total) * 100}%`;

      // 문제 텍스트 적용
      questionText.innerHTML = currentQuiz.question.replace(/\n/g, '<br>');

      // 보기 옵션 리스트 버튼 빌드
      optionsContainer.innerHTML = '';
      currentQuiz.options.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = "w-full text-left p-4 rounded-xl border border-gray-800 bg-gray-900/60 hover:bg-gray-800/80 hover:border-teal-500/50 transition-all focus:outline-none flex items-center space-x-3 group active:scale-[0.99]";
        btn.innerHTML = `
          <span class="w-6 h-6 shrink-0 flex items-center justify-center rounded-full bg-gray-800 text-xs font-bold text-gray-400 group-hover:bg-teal-500 group-hover:text-gray-950 transition-colors">${idx + 1}</span>
          <span class="text-sm font-medium text-gray-300 group-hover:text-white">${opt}</span>
        `;
        btn.onclick = () => handleSelectAnswer(idx + 1);
        optionsContainer.appendChild(btn);
      });
    }

    // 사용자 정답 판정 액션
    function handleSelectAnswer(selectedIdx) {
      // 이미 정답이 표출된 경우 중복 클릭 방어
      if (!feedbackBox.classList.contains('hidden')) return;

      const currentQuiz = quizDatabase[currentIndex];
      const isCorrect = (selectedIdx === currentQuiz.answer);
      userAnswers.push(selectedIdx);

      // 점수 및 통계 집계
      if (isCorrect) {
        correctCount++;
        feedbackBox.className = "rounded-xl p-5 border border-emerald-500/30 bg-emerald-950/20";
        feedbackIcon.className = "text-emerald-400 font-bold text-xl";
        feedbackIcon.innerText = "✓";
        feedbackTitle.className = "font-bold text-emerald-400 text-base mb-1";
        feedbackTitle.innerText = "정답입니다! 완벽한 개념 정립이 돋보입니다.";
      } else {
        wrongCount++;
        feedbackBox.className = "rounded-xl p-5 border border-rose-500/30 bg-rose-950/20";
        feedbackIcon.className = "text-rose-400 font-bold text-xl";
        feedbackIcon.innerText = "✕";
        feedbackTitle.className = "font-bold text-rose-400 text-base mb-1";
        feedbackTitle.innerText = `오답입니다. (정답: ${currentQuiz.answer}번)`;
      }

      explanationContent.innerText = currentQuiz.explanation;
      feedbackBox.classList.remove('hidden');

      // 스크롤 포커싱 완화 유도
      feedbackBox.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    // 다음 라운드 또는 최종 리포트 이동 제어
    nextBtn.onclick = () => {
      currentIndex++;
      if (currentIndex < quizDatabase.length) {
        renderQuestion();
      } else {
        renderFinalReport();
      }
    };

    // 최종 결과 화면 및 오답 수첩 연출
    function renderFinalReport() {
      quizScreen.classList.add('hidden');
      resultScreen.classList.remove('hidden');
      progressBar.style.width = '100%';
      progressText.innerText = "종료";

      // 100점 만점 환산 스코어링
      score = Math.round((correctCount / quizDatabase.length) * 100);
      finalScoreEl.innerText = score;
      correctCountEl.innerText = `${correctCount}개`;
      wrongCountEl.innerText = `${wrongCount}개`;

      wrongNotesContainer.innerHTML = '';
      
      const wrongList = [];

      quizDatabase.forEach((quiz, idx) => {
        const userAns = userAnswers[idx];
        const isWrong = (userAns !== quiz.answer);

        if (isWrong) {
          wrongList.push({
            no: quiz.id,
            userChoice: userAns,
            correctChoice: quiz.answer,
            keyword: quiz.keyword
          });

          // 오답 카드 DOM 빌드
          const card = document.createElement('div');
          card.className = "bg-gray-900 border border-gray-800 rounded-xl p-5 space-y-3";
          card.innerHTML = `
            <div class="flex justify-between items-center border-b border-gray-800 pb-2">
              <span class="text-sm font-bold text-rose-400">문제 ${quiz.id}번</span>
              <span class="bg-gray-800 text-gray-400 px-2 py-0.5 rounded text-xs font-semibold">핵심 테마: ${quiz.keyword}</span>
            </div>
            <p class="text-xs text-gray-400 leading-relaxed whitespace-pre-wrap">${quiz.question}</p>
            <div class="flex space-x-4 text-xs font-semibold py-1">
              <span class="text-rose-400">나의 선택지: ${userAns}번</span>
              <span class="text-emerald-400">정답 처방전: ${quiz.answer}번</span>
            </div>
            <div class="bg-gray-950 p-3 rounded text-xs text-gray-300 leading-relaxed whitespace-pre-wrap border border-gray-800/60">
              <span class="text-teal-400 font-bold block mb-1">일타강사의 원 포인트 레슨:</span>
              ${quiz.explanation}
            </div>
          `;
          wrongNotesContainer.appendChild(card);
        }
      });

      if (wrongList.length === 0) {
        wrongNotesContainer.innerHTML = `
          <div class="text-center py-8 text-gray-500 text-sm">
            틀린 문제가 단 하나도 없습니다! 전국구 수석 합격 페이스입니다.
          </div>
        `;
      }

      // 지침 제2항: 부모 통합 동기화 모듈 Gist 송출 파이프라인 가동
      syncToParentGist(wrongList);
    }

    // 부모 창 데이터 싱크 포스트 오피스 매니저
    function syncToParentGist(wrongData) {
      const payload = {
        type: "QUIZ_RESULT_SYNC",
        score: score,
        correctCount: correctCount,
        wrongCount: wrongCount,
        wrongNotes: wrongData,
        timestamp: new Date().toISOString()
      };
      
      // 임베디드 아이프레임 스코프 및 부모창 전체에 브로드캐스트 전송
      if (window.parent) {
        window.parent.postMessage(payload, "*");
      }
      if (window.opener) {
        window.opener.postMessage(payload, "*");
      }
      console.log("[GEM_INTERACTIVE_SYNC] 부모 플랫폼으로 오답 데이터 동기화 완료:", payload);
    }

    // 실행 커맨드
    window.onload = initQuiz;
  </script>
</body>
</html>
