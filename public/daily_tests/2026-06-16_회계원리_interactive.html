        explanation: "• 이익 차이인 ￦20,000은 기말재고량에 숨어 들어간 고정제조간접원가 금액을 뜻합니다.<br>• 기말재고량 = 생산량(X) - 판매량(1,000개)<br>• 단위당 고정제조간접원가 = 총고정제조간접비(60,000) / 생산량(X)<br>• 방정식 수립: (X - 1,000) × (60,000 / X) = 20,000<br>• 60,000X - 60,000,000 = 20,000X &nbsp; ➔ &nbsp; 40,000X = 60,000,000 &nbsp; ∴ X = <b>1,500개</b>"
      },
      {
        id: 32,
        subject: "회계원리",
        question: "(주)한국은 실제원가계산을 사용하고 있다. 전부원가계산에 의해 20×1년 영업이익을 ￦65,000으로 보고하였다. 당기에 제품 20,000단위를 생산하고 18,000단위를 단위당 ￦20에 판매하였다. 연간 고정제조간접원가가 ￦100,000일 때, '변동원가계산'에 의한 영업이익은?",
        options: ["￦45,000", "￦50,000", "￦55,000", "￦60,000", "￦65,000"],
        answer: 2, // ③ ￦55,000
        explanation: "• 단위당 고정제조간접원가 = 총 고정제조간접비(100,000) / 생산량(20,000) = ￦5<br>• 기말재고량 변동 = 생산(20,000) - 판매(18,000) = 2,000단위 증가<br>• 이익 차이 금액 = 재고 변동량(2,000) × 단위당 고정비(5) = ￦10,000<br>• 변동원가계산 영업이익 = 전부원가 영업이익(65,000) - 이익차이(10,000) = <b>￦55,000</b>"
      },
      {
        id: 33,
        subject: "회계원리",
        question: "A아파트는 1인당 ￦50,000의 변동원가와 ￦8,000,000의 총고정원가가 소요되는 교육프로그램을 계획 중이다. 1인당 참가비는 ￦100,000이며, 실시 시 구청으로부터 총 ￦2,000,000의 보조금(지원금)을 정액 수령한다. 이 프로그램의 손익분기점(BEP) 달성을 위한 최소 인원수는?",
        options: ["100명", "110명", "115명", "120명", "150명"],
        answer: 3, // ④ 120명
        explanation: "• 1인당 공헌이익 = 참가비(100,000) - 변동원가(50,000) = ￦50,000<br>• 회수해야 할 실질 고정비 = 총고정원가(8,000,000) - 구청 보조금 지원액(2,000,000) = ￦6,000,000<br>• 손익분기점 인원수 = 순고정비(6,000,000) / 단위당 공헌이익(50,000) = <b>120명</b>"
      },
      {
        id: 34,
        subject: "회계원리",
        question: "A아파트 전기작업반의 월별 직접노무시간과 경비 기록이 다음과 같다. 고저점법(High-Low Method)을 적용하여 7월 예상 직접노무시간인 200시간에 대한 경비를 추정하면?<br><br><div class='bg-gray-900 p-3 rounded text-sm space-y-1 border border-gray-700'>· 4월: 250시간 / ￦10,000 (최고 조업도 고점)<br>· 5월: 200시간 / ￦11,000<br>· 6월: 150시간 / ￦7,000 (최저 조업도 저점)</div>",
        options: ["￦8,500", "￦8,600", "￦8,700", "￦8,800", "￦8,900"],
        answer: 0, // ① ￦8,500
        explanation: "• <b>주의:</b> 고저점법은 원가의 크기가 아니라 독립변수인 <b>'조업도(노무시간)'의 최고점과 최저점</b>을 기준으로 선정해야 합니다.<br>&nbsp;&nbsp;- 고점: 4월 (250시간, ￦10,000) / 저점: 6월 (150시간, ￦7,000)<br>• 단위당 변동비 = (고점원가 10,000 - 저점원가 7,000) / (고점시간 250 - 저점시간 150) = 3,000 / 100 = 시간당 ￦30<br>• 고정비 계산(고점 대입) = 10,000 - (250시간 × 30) = ￦2,500<br>• 7월 예상 경비(200시간) = (200시간 × 30원) + 고정비(2,500원) = <b>￦8,500</b>"
      },
      {
        id: 35,
        subject: "회계원리",
        question: "(주)한국은 당기에 제품 1,000단위를 생산·판매하는 계획을 수립하였고 최대 조업능력은 1,200단위이다. 제품 단위당 판매가는 ￦1,000, 단위당 변동원가는 ￦400, 총고정원가는 ￦110,000이다. 기중에 해외 바이어로부터 100단위를 단위당 ￦600에 구매하겠다는 특별주문을 받았다. 수락 시 단위당 ￦150의 특별 운송비가 추가 발생한다면, 이 주문의 수락이 당기이익에 미치는 영향은?",
        options: ["￦5,000 증가", "￦5,000 감소", "￦10,000 증가", "￦10,000 감소", "￦15,000 증가"],
        answer: 0, // ① ￦5,000 증가
        explanation: "• 현재 여유 조업능력은 200단위(1,200 - 1,000)이므로, 특별주문 100단위 수락을 위해 기존 정상 판매를 포기할 필요가 없어 기회원가는 발생하지 않습니다.<br>• 특별주문 단위당 증분수익 = ￦600<br>• 특별주문 단위당 증분원가 = 자체 변동비(400) + 추가 운송비(150) = ￦550<br>• 단위당 증분이익 = 600 - 550 = +￦50<br>• 총 당기이익 변화량 = 100단위 × 50원 = <b>￦5,000 증가</b>"
      }
    ];

    let currentIndex = 0;
    let score = 0;
    const userAnswers = new Array(quizData.length).fill(null);
    const incorrectNotes = [];

    // DOM 요소 캐싱
    const quizContainer = document.getElementById('quiz-container');
    const progressBar = document.getElementById('progress-bar');
    const progressBadge = document.getElementById('progress-badge');

    // 초기화 작동
    function initQuiz() {
      renderQuestion();
    }

    // 화면 갱신 프로그레스 바 제어
    function updateProgressBar() {
      const percentage = ((currentIndex) / quizData.length) * 100;
      progressBar.style.width = `${percentage}%`;
      progressBadge.innerText = `진행도: ${currentIndex + 1} / ${quizData.length}`;
    }

    // 한 번에 한 문제씩 렌더링
    function renderQuestion() {
      updateProgressBar();
      const currentQuiz = quizData[currentIndex];
      
      let optionsHTML = '';
      currentQuiz.options.forEach((opt, idx) => {
        optionsHTML += `
          <button onclick="selectOption(${idx})" class="w-full text-left bg-gray-700 hover:bg-gray-600 border border-gray-600 rounded-xl px-5 py-4 transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-amber-500 font-medium text-gray-200 hover:text-white flex items-center space-x-3 group">
            <span class="w-7 h-7 flex items-center justify-center rounded-full bg-gray-800 text-xs text-amber-400 font-bold group-hover:bg-amber-500 group-hover:text-gray-900 transition-colors">${idx + 1}</span>
            <span class="flex-1">${opt}</span>
          </button>
        `;
      });

      quizContainer.innerHTML = `
        <div class="space-y-6">
          <div class="flex items-center justify-between border-b border-gray-700 pb-3">
            <span class="text-xs font-bold tracking-widest text-amber-400 bg-amber-500/10 px-2.5 py-1 rounded border border-amber-500/20 uppercase">${currentQuiz.subject}</span>
            <span class="text-sm font-semibold text-gray-400">Question ${currentQuiz.id} of ${quizData.length}</span>
          </div>
          
          <div class="text-lg font-medium text-white leading-relaxed">
            ${currentQuiz.question}
          </div>

          <div class="space-y-3 pt-2">
            ${optionsHTML}
          </div>
        </div>
        
        <div class="flex justify-end pt-6 border-t border-gray-700 mt-8">
          <span class="text-xs text-gray-500 italic">보기를 터치 또는 클릭하면 즉각 채점 란으로 연결됩니다.</span>
        </div>
      `;
    }

    // 옵션 클릭 선택 처리 피드백
    window.selectOption = function(selectedIndex) {
      const currentQuiz = quizData[currentIndex];
      userAnswers[currentIndex] = selectedIndex;
      const isCorrect = (selectedIndex === currentQuiz.answer);

      if (isCorrect) score++;
      else {
        // 오답 노트 데이터 누적 수집
        incorrectNotes.push({
          num: currentQuiz.id,
          subject: currentQuiz.subject,
          questionSummary: currentQuiz.question.substring(0, 70) + "...",
          correctOpt: currentQuiz.options[currentQuiz.answer],
          userOpt: currentQuiz.options[selectedIndex],
          rawExplanation: currentQuiz.explanation
        });
      }

      // 채점 즉시 실시간 피드백 창으로 전환
      renderFeedback(isCorrect, selectedIndex);
    };

    // 실시간 정오답 피드백 뷰
    function renderFeedback(isCorrect, selectedIndex) {
      const currentQuiz = quizData[currentIndex];
      
      const statusTitle = isCorrect 
        ? `<h3 class="text-2xl font-bold text-green-400 flex items-center space-x-2">🎉 정답입니다! 합격의 징조입니다.</h3>`
        : `<h3 class="text-2xl font-bold text-red-400 flex items-center space-x-2">⚠️ 아쉽습니다! 오답 교정이 필요합니다.</h3>`;

      quizContainer.innerHTML = `
        <div class="space-y-5 animate-fade-in">
          <div class="p-4 rounded-xl ${isCorrect ? 'bg-green-500/10 border border-green-500/20' : 'bg-red-500/10 border border-red-500/20'}">
            ${statusTitle}
            <p class="text-sm text-gray-300 mt-2">
              선택한 보기: <span class="font-semibold ${isCorrect ? 'text-green-300' : 'text-red-300'}">${selectedIndex + 1}번. ${currentQuiz.options[selectedIndex]}</span>
            </p>
            ${!isCorrect ? `<p class="text-sm text-green-300 mt-1">실제 정답: <span class="font-semibold">${currentQuiz.answer + 1}번. ${currentQuiz.options[currentQuiz.answer]}</span></p>` : ''}
          </div>

          <div class="bg-gray-900 border border-gray-700 rounded-xl p-5">
            <h4 class="text-sm font-bold text-amber-400 mb-2 flex items-center">💡 일타강사의 명쾌한 엑기스 해설</h4>
            <div class="text-sm text-gray-300 leading-relaxed space-y-2 custom-scrollbar overflow-y-auto max-h-[220px] pr-2">
              ${currentQuiz.explanation}
            </div>
          </div>

          <div class="flex justify-end pt-4">
            <button onclick="nextStep()" class="bg-gradient-to-r from-amber-500 to-yellow-500 text-gray-900 font-bold px-6 py-3 rounded-xl shadow-lg hover:from-amber-400 hover:to-yellow-400 transition-all transform active:scale-95 flex items-center space-x-2">
              <span>${currentIndex === quizData.length - 1 ? '최종 결과 확인하기' : '다음 문제로 넘어가기'}</span>
              <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                <path fill-rule="evenodd" d="M10.293 3.293a1 1 0 011.414 0l6 6a1 1 0 010 1.414l-6 6a1 1 0 01-1.414-1.414L14.586 11H3a1 1 0 110-2h11.586l-4.293-4.293a1 1 0 010-1.414z" clip-rule="evenodd" />
              </svg>
            </button>
          </div>
        </div>
      `;
    }

    // 다음 라운드 또는 결과창 분기 제어
    window.nextStep = function() {
      if (currentIndex < quizData.length - 1) {
        currentIndex++;
        renderQuestion();
      } else {
        progressBar.style.width = '100%';
        renderReportCard();
      }
    };

    // 최종 오답 리포트 및 상위 프레임 싱크 전송 함수
    function renderReportCard() {
      progressBadge.innerText = `평가 완료`;
      const passScore = 60; 
      const finalPercentage = Math.round((score / quizData.length) * 100);
      const isPassed = finalPercentage >= passScore;

      // 오답수첩 상위 부모 동기화 연동용 데이터 구조 설계
      const syncPayload = {
        totalQuestions: quizData.length,
        correctCount: score,
        scoreRate: finalPercentage,
        wrongList: incorrectNotes.map(n => ({
          id: n.num,
          title: n.questionSummary,
          userAnswer: n.userOpt,
          correctAnswer: n.correctOpt
        }))
      };

      // 부모 창 데이터 동기화 시스템 작동 트리거
      syncToParentGist(syncPayload);

      let wrongListHTML = '';
      if (incorrectNotes.length === 0) {
        wrongListHTML = `
          <div class="text-center p-6 bg-gray-900 rounded-xl border border-green-500/20">
            <p class="text-green-400 font-bold text-lg">🎉 퍼펙트 달성! 틀린 문제가 하나도 없습니다.</p>
            <p class="text-xs text-gray-400 mt-1">실전에서도 무조건 고득점 수석 합격 페이스입니다!</p>
          </div>
        `;
      } else {
        incorrectNotes.forEach(note => {
          wrongListHTML += `
            <div class="bg-gray-900 border border-gray-700 rounded-xl p-4 space-y-2">
              <div class="flex items-center justify-between">
                <span class="text-xs font-bold text-red-400 bg-red-500/10 px-2 py-0.5 rounded border border-red-500/20">문제 ${note.num}번 [${note.subject}]</span>
              </div>
              <p class="text-xs text-gray-400 truncate">${note.questionSummary}</p>
              <div class="grid grid-cols-2 gap-2 text-xs py-1 border-t border-b border-gray-800 my-1">
                <div class="text-red-400">내가 고른 오답: <span class="font-medium">${note.userOpt.substring(0, 20)}</span></div>
                <div class="text-green-400">실제 정답 지문: <span class="font-medium">${note.correctOpt.substring(0, 20)}</span></div>
              </div>
              <details class="group mt-1">
                <summary class="text-xs text-amber-400 cursor-pointer hover:underline focus:outline-none list-none flex items-center space-x-1">
                  <span>▶ 해설 및 약점 교정 보기</span>
                </summary>
                <p class="text-xs text-gray-300 bg-gray-950 p-2.5 rounded mt-2 leading-relaxed border border-gray-800 font-light">
                  ${note.rawExplanation}
                </p>
              </details>
            </div>
          `;
        });
      }

      quizContainer.innerHTML = `
        <div class="space-y-6 animate-fade-in">
          <div class="text-center py-4 border-b border-gray-700">
            <h2 class="text-3xl font-extrabold text-white tracking-tight">최종 성적 리포트</h2>
            <p class="text-sm text-gray-400 mt-1">수고하셨습니다. 수험생님의 오답 수첩 데이터가 연동 완료되었습니다.</p>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div class="bg-gray-900 p-4 rounded-xl text-center border border-gray-700 flex flex-col justify-center">
              <span class="text-xs text-gray-400 font-medium">종합 정답 개수</span>
              <span class="text-2xl font-bold text-amber-400 mt-1">${score} / ${quizData.length} <span class="text-sm text-gray-500">문항</span></span>
            </div>
            <div class="bg-gray-900 p-4 rounded-xl text-center border border-gray-700 flex flex-col justify-center">
              <span class="text-xs text-gray-400 font-medium">환산 백분율 점수</span>
              <span class="text-3xl font-extrabold text-white mt-1">${finalPercentage}<span class="text-lg font-medium text-gray-400"> 점</span></span>
            </div>
            <div class="p-4 rounded-xl text-center flex flex-col justify-center border ${isPassed ? 'bg-green-500/10 border-green-500/30' : 'bg-red-500/10 border-red-500/30'}">
              <span class="text-xs text-gray-400 font-medium">합격 판단 여부</span>
              <span class="text-2xl font-bold mt-1 ${isPassed ? 'text-green-400' : 'text-red-400'}">${isPassed ? 'PASS (합격 안정권)' : '과락 위험 (보충 필요)'}</span>
            </div>
          </div>

          <div class="space-y-3">
            <h3 class="text-md font-bold text-gray-200 flex items-center space-x-2">
              <span class="inline-block w-2 h-4 bg-amber-500 rounded-sm"></span>
              <span>약점 극복 오답 수첩 리스트</span>
            </h3>
            
            <div class="space-y-2 max-h-[300px] overflow-y-auto pr-1 custom-scrollbar">
              ${wrongListHTML}
            </div>
          </div>

          <div class="flex justify-center pt-2">
            <button onclick="location.reload()" class="bg-gray-700 hover:bg-gray-600 text-white font-semibold px-6 py-2.5 rounded-xl text-sm transition-all shadow border border-gray-600 active:scale-95">
              처음부터 다시 도전하기
            </button>
          </div>
        </div>
      `;
    }

    // 부모 창으로 오답 수첩 데이터를 쏴주는 핵심 탑재 소스코드 규칙 충족
    function syncToParentGist(payload) {
      if (typeof window.postMessage === 'function') {
        window.postMessage({
          type: "QUIZ_RESULT_SYNC",
          data: payload
        }, "*");
      }
      if (window.parent && window.parent !== window) {
        window.parent.postMessage({
          type: "QUIZ_RESULT_SYNC",
          data: payload
        }, "*");
      }
      console.log("[Sync] 부모 창으로 데이터 동기화 전송이 성공적으로 완료되었습니다.", payload);
    }

    // 어플리케이션 즉시 시작
    window.onload = initQuiz;
  </script>
</body>
</html>
